<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="東京自由行">
  <meta name="theme-color" content="#5c6b8a">
  <title>東京自由行</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA7pEPkce8tZawB7gf9Ae-a4HiCRb5oXww&libraries=places,routes&language=zh-TW&loading=async" defer></script>
  <style>
    /* ── Design Tokens ─────────────────────────────────── */
    :root {
      --bg:           #f4f2ee;
      --surface:      #ffffff;
      --surface-sub:  #fdfcfb;
      --border:       #e5e0d8;
      --border-lt:    #ede9e2;
      --text-1:       #2a2520;
      --text-2:       #6b6560;
      --text-3:       #9c9790;
      --accent:       #5c6b8a;
      --accent-lt:    #edf0f5;
      --accent-bd:    #c8d0de;
      --accent-deep:  #3d4e6a;
      --sage:         #7a8f7e;
      --sage-lt:      #f0f5f1;
      --red:          #b05a5a;
      --gold:         #a07840;
      --gold-lt:      #f7f2e8;
      --tl-line:      #d8d3cc;
      --r:            12px;
      --r-sm:         8px;
      --shadow:       0 1px 4px rgba(42,37,32,.06), 0 4px 16px rgba(42,37,32,.04);
      --font:         -apple-system,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
    }

    /* ── Reset ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-size: 15px; -webkit-text-size-adjust: 100%; }
    body { font-family: var(--font); background: var(--bg); color: var(--text-1); min-height: 100vh; line-height: 1.6; }
    a    { text-decoration: none; }
    button { font-family: var(--font); border: none; cursor: pointer; background: none; }
    input, select, textarea { font: inherit; }

    /* ── Auth Overlay ──────────────────────────────────── */
    #auth-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg);
      display: none; align-items: center; justify-content: center; padding: 32px;
    }
    .auth-card { width: 100%; max-width: 300px; text-align: center; }
    .auth-icon { font-size: 44px; display: block; margin-bottom: 20px; }
    .auth-title { font-size: 1.25rem; font-weight: 700; color: var(--text-1); letter-spacing: .04em; margin-bottom: 4px; }
    .auth-sub   { font-size: .78rem; color: var(--text-3); letter-spacing: .1em; margin-bottom: 44px; }
    #auth-input {
      width: 100%; padding: 16px 24px;
      border: 1.5px solid var(--border); border-radius: var(--r);
      font-size: 1.6rem; letter-spacing: .6em; text-align: center;
      background: var(--surface); color: var(--text-1);
      outline: none; -webkit-appearance: none; transition: border-color .2s; margin-bottom: 10px;
    }
    #auth-input:focus { border-color: var(--accent); }
    #auth-error { font-size: .78rem; color: var(--red); min-height: 20px; }
    .auth-hint  { margin-top: 28px; font-size: .72rem; color: var(--text-3); letter-spacing: .05em; }

    /* ── App Shell ─────────────────────────────────────── */
    #app { display: none; }

    /* ── Header ────────────────────────────────────────── */
    .app-header {
      position: sticky; top: 0; z-index: 100;
      background: var(--accent-deep); border-bottom: 1px solid var(--accent);
      color: #fff;
    }
    .trip-banner {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px 8px;
    }
    .trip-banner-title { font-size: .92rem; font-weight: 600; letter-spacing: .12em; }
    .trip-banner-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .trip-banner-dates { font-size: .68rem; color: rgba(255,255,255,.58); letter-spacing: .06em; }
    #hdr-weather       { font-size: .62rem; color: rgba(255,255,255,.72); letter-spacing: .03em; }

    /* Day Tabs */
    .day-tabs { display: flex; overflow-x: auto; gap: 8px; padding: 0 16px 12px; scrollbar-width: none; -ms-overflow-style: none; }
    .day-tabs::-webkit-scrollbar { display: none; }
    .day-tab {
      flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 7px 14px; border-radius: var(--r-sm);
      border: 1.5px solid rgba(255,255,255,.2);
      background: transparent; color: rgba(255,255,255,.55);
      transition: border-color .18s, background .18s, color .18s;
    }
    .day-tab:active { transform: scale(.97); }
    .day-tab.active { border-color: rgba(255,255,255,.9); background: rgba(255,255,255,.15); color: #fff; }
    .tab-label { font-size: .7rem; font-weight: 700; letter-spacing: .06em; }
    .tab-date  { font-size: .65rem; white-space: nowrap; opacity: .85; }

    /* ── Countdown ─────────────────────────────────────── */
    #countdown {
      background: var(--accent-lt); border-bottom: 1px solid var(--accent-bd);
      text-align: center; padding: 9px 16px;
      font-size: .74rem; color: var(--text-2); letter-spacing: .1em;
    }
    #countdown strong { color: var(--accent); font-size: 1.4rem; font-weight: 300; margin: 0 4px; }

    /* ── Content ───────────────────────────────────────── */
    .app-content { padding-bottom: 0; }
    .day-panel        { display: none; }
    .day-panel.active { display: block; }

    /* Day Header */
    .day-header { padding: 24px 20px 12px; position: relative; }
    .day-header-actions {
      position: absolute; top: 20px; right: 14px;
      display: flex; flex-direction: column; gap: 6px; align-items: stretch;
    }
    .btn-sort-day, .btn-calc-travel {
      font-size: .7rem; font-weight: 600; padding: 5px 10px;
      border-radius: 6px; white-space: nowrap;
      transition: opacity .15s; text-align: center;
    }
    .btn-sort-day {
      border: 1px solid var(--accent-bd);
      color: var(--accent); background: var(--accent-lt);
    }
    .btn-sort-day:active { opacity: .65; }
    .btn-calc-travel {
      border: 1px solid var(--accent-bd);
      color: var(--accent); background: var(--accent-lt);
    }
    .btn-calc-travel:active { opacity: .65; }
    .btn-calc-travel:disabled { opacity: .4; cursor: default; }
    .day-start-wrap { display: flex; align-items: center; gap: 5px; margin-top: 6px; }
    .day-start-label { font-size: .72rem; color: var(--text-3); }
    .day-start-input {
      font-size: .78rem; font-weight: 600; color: var(--text-2);
      border: 1px solid var(--border-lt); border-radius: 5px;
      padding: 3px 7px; background: var(--surface); width: 72px;
    }
    .day-number-badge {
      display: inline-block; font-size: .66rem; font-weight: 700; letter-spacing: .1em;
      color: var(--accent); background: var(--accent-lt); padding: 3px 10px; border-radius: 100px; margin-bottom: 8px;
    }
    .day-panel-title { font-size: 1.05rem; font-weight: 700; color: var(--text-1); line-height: 1.4; margin-bottom: 3px; }
    .day-panel-date  { font-size: .75rem; color: var(--text-3); letter-spacing: .04em; }

    /* ── Timeline ──────────────────────────────────────── */
    .timeline { padding: 4px 16px 0; }
    .timeline-item { display: grid; grid-template-columns: 52px 20px 1fr; column-gap: 10px; }
    .timeline-time { display: flex; align-items: flex-start; justify-content: flex-end; padding-top: 19px; }
    .time-badge { font-size: .76rem; font-weight: 600; color: var(--text-2); letter-spacing: .02em; white-space: nowrap; }
    .timeline-dot-col { position: relative; display: flex; justify-content: center; padding-top: 20px; }
    .timeline-dot-col::before {
      content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
      width: 1.5px; background: var(--tl-line); transform: translateX(-50%);
    }
    .timeline-item--first .timeline-dot-col::before { top: 26px; }
    .timeline-item--last  .timeline-dot-col::before { top: 0; bottom: auto; height: 26px; }
    .timeline-item--first.timeline-item--last .timeline-dot-col::before { display: none; }
    .timeline-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--accent); border: 2.5px solid var(--bg);
      box-shadow: 0 0 0 1.5px var(--accent);
      position: relative; z-index: 1; flex-shrink: 0;
    }
    .timeline-dot--flight { background: var(--text-3); box-shadow: 0 0 0 1.5px var(--text-3); }
    .timeline-card-col { padding: 12px 0 20px; }

    /* Travel Bridge（景點間交通時間連接器） */
    .travel-bridge { display: grid; grid-template-columns: 52px 20px 1fr; column-gap: 10px; margin: -6px 0; }
    .travel-bridge-line { position: relative; }
    .travel-bridge-line::before {
      content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
      width: 1.5px; background: var(--tl-line); transform: translateX(-50%);
    }
    .travel-bridge-label { font-size: .7rem; color: var(--text-3); padding: 3px 0; display: flex; align-items: center; gap: 3px; }

    /* Spot Card */
    .spot-card {
      background: var(--surface); border: 1px solid var(--border-lt);
      border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow);
      position: relative;
    }
    .spot-card--flight { background: var(--surface-sub); border-style: dashed; box-shadow: none; }

    /* Flight Info Card（班機獨立卡片） */
    .flight-card {
      margin: 0 16px 14px; padding: 12px 14px;
      background: var(--surface-sub); border: 1px dashed var(--text-3);
      border-radius: 8px; display: flex; align-items: flex-start; gap: 10px;
    }
    .flight-card-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 2px; color: var(--text-3); }
    .flight-card-body { flex: 1; min-width: 0; }
    .flight-card-title { font-size: .9rem; font-weight: 700; color: var(--text-1); line-height: 1.35; margin-bottom: 5px; }
    .flight-card-desc  { font-size: .76rem; color: var(--text-2); line-height: 1.7; margin-bottom: 5px; }
    .flight-card-transport { font-size: .72rem; color: var(--text-3); line-height: 1.5; }

    /* Delete Button（景點右上角） */
    .btn-del-spot {
      position: absolute; top: 8px; right: 10px;
      font-size: .8rem; color: var(--text-3);
      padding: 3px 5px; border-radius: 5px; line-height: 1;
      background: transparent; transition: color .15s;
    }
    .btn-del-spot:active { color: var(--red); }
    .btn-move-spot {
      position: absolute; top: 8px;
      font-size: .78rem; color: var(--text-3);
      padding: 3px 5px; border-radius: 5px; line-height: 1;
      background: transparent; transition: color .15s;
    }
    .btn-move-spot:active { color: var(--accent); }
    .btn-move-up { right: 56px; }
    .btn-move-dn { right: 34px; }

    /* Add Spot Button（每天底部） */
    .add-spot-wrap { padding: 12px 16px 4px; }
    .btn-add-spot {
      width: 100%; padding: 10px;
      border: 1.5px dashed var(--accent-bd);
      border-radius: var(--r-sm);
      background: transparent; color: var(--accent);
      font-size: .8rem; letter-spacing: .06em;
      transition: background .15s;
    }
    .btn-add-spot:active { background: var(--accent-lt); }

    /* Add Spot Modal */
    .geocode-status { font-size: .75rem; color: var(--text-2); min-height: 18px; margin-top: 6px; line-height: 1.5; }
    .modal-subtitle { font-size: .75rem; color: var(--text-3); text-align: center; margin-bottom: 18px; }
    .spot-region-tag {
      display: inline-block; font-size: .63rem; font-weight: 600; letter-spacing: .08em;
      color: var(--sage); background: var(--sage-lt);
      padding: 2px 8px; border-radius: 100px; margin-bottom: 6px;
    }
    .spot-name { font-size: .92rem; font-weight: 700; color: var(--text-1); line-height: 1.35; margin-bottom: 6px; }
    .spot-address { font-size: .71rem; color: var(--text-3); line-height: 1.5; margin-bottom: 5px; }
    .spot-hours {
      font-size: .73rem; color: var(--text-2); line-height: 1.5;
      background: var(--accent-lt); border: 1px solid var(--accent-bd);
      border-radius: 6px; padding: 5px 10px; margin-bottom: 8px;
    }
    .spot-desc { font-size: .78rem; color: var(--text-2); line-height: 1.7; margin-bottom: 8px; }

    /* Weather (on spot card) */
    .weather {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      margin-bottom: 8px; padding: 6px 10px;
      background: var(--sage-lt); border-radius: 6px;
      font-size: .73rem; border: 1px solid rgba(122,143,126,.2);
    }
    .w-temp  { font-weight: 600; color: var(--sage); }
    .w-alert { color: var(--red); }

    /* Transport */
    .transport {
      background: var(--accent-lt); border-radius: 7px;
      padding: 7px 11px; margin-bottom: 10px;
      font-size: .74rem; color: var(--text-2); line-height: 1.6;
      border: 1px solid var(--accent-bd);
    }
    .transport-dur { color: var(--text-3); }

    .spot-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .btn-nav {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px; background: var(--accent); color: #fff;
      border-radius: var(--r-sm); font-size: .76rem; font-weight: 600;
      letter-spacing: .03em; transition: opacity .15s;
    }
    .btn-nav:active { opacity: .8; }
    .spot-duration { font-size: .7rem; color: var(--text-3); letter-spacing: .03em; }

    /* ── Dining Section ────────────────────────────────── */
    .dining-section {
      margin: 0 16px 16px; padding: 14px 16px;
      background: var(--gold-lt); border-radius: var(--r);
      border: 1px solid rgba(160,120,64,.22);
    }
    .dining-label {
      font-size: .63rem; letter-spacing: .18em; color: var(--gold);
      font-weight: 700; margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .dining-label::after { content: ''; flex: 1; height: 1px; background: rgba(160,120,64,.2); }
    .dining-group { margin-bottom: 12px; }
    .dining-group:last-child { margin-bottom: 0; }
    .dining-group-label {
      font-size: .6rem; letter-spacing: .12em; color: var(--text-3);
      font-weight: 600; margin-bottom: 6px; padding-bottom: 4px;
      border-bottom: 1px dashed rgba(160,120,64,.2);
    }
    .dining-card { padding: 10px 0; border-bottom: 1px solid rgba(160,120,64,.1); }
    .dining-card:last-child { border-bottom: none; padding-bottom: 0; }
    .dining-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .dining-name { font-size: .88rem; font-weight: 600; color: var(--text-1); }
    .dining-type {
      font-size: .58rem; color: var(--gold); background: rgba(160,120,64,.12);
      padding: 2px 7px; border-radius: 10px; letter-spacing: .06em; flex-shrink: 0;
    }
    .dining-desc { font-size: .75rem; color: var(--text-2); line-height: 1.65; margin-bottom: 8px; }
    .dining-nav {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: .7rem; color: var(--gold);
      border: 1px solid rgba(160,120,64,.4); padding: 5px 12px; border-radius: 14px;
    }

    /* ── Divider ────────────────────────────────────────── */
    .divider {
      height: 10px; margin-top: 8px;
      background: repeating-linear-gradient(90deg, var(--border) 0, var(--border) 2px, var(--bg) 2px, var(--bg) 6px);
    }

    /* ── Section ────────────────────────────────────────── */
    .section { padding: 20px 20px; }
    .section-label {
      font-size: .7rem; letter-spacing: .2em; color: var(--text-3);
      margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    }
    .section-label::before { content: '·'; color: var(--accent); font-size: 1.2rem; line-height: 1; }
    .section-label::after  { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── Expense Form ──────────────────────────────────── */
    .exp-form { display: flex; flex-direction: column; gap: 11px; }
    .row      { display: flex; gap: 10px; }
    .field    { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .field label { font-size: .68rem; color: var(--text-3); letter-spacing: .06em; }
    .field input, .field select {
      padding: 10px 12px; border: 1px solid var(--border);
      background: var(--surface); border-radius: var(--r-sm);
      width: 100%; font-size: .9rem; outline: none;
      -webkit-appearance: none; appearance: none; color: var(--text-1);
    }
    .field input:focus, .field select:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px rgba(92,107,138,.08);
    }
    .twd       { font-size: .72rem; color: var(--text-3); text-align: right; margin-top: -6px; min-height: 1em; }
    .submit-btn {
      padding: 13px; background: var(--accent); color: #fff;
      border-radius: var(--r-sm); font-size: .88rem; letter-spacing: .1em;
    }
    .submit-btn:active { opacity: .85; }
    .setup-hint {
      background: var(--surface-sub); border: 1px solid var(--border);
      border-radius: var(--r-sm); padding: 14px;
      font-size: .78rem; color: var(--text-2); line-height: 1.75;
    }
    .setup-hint code { background: var(--border-lt); padding: 1px 5px; border-radius: 3px; font-size: .72rem; }

    /* ── Expense Summary ───────────────────────────────── */
    .total-box  { text-align: center; margin-bottom: 22px; }
    .total-lbl  { font-size: .68rem; letter-spacing: .15em; color: var(--text-3); margin-bottom: 6px; }
    .total-jpy  { font-size: 2.1rem; font-weight: 300; letter-spacing: .04em; color: var(--text-1); }
    .total-twd  { font-size: .82rem; color: var(--text-3); margin-top: 2px; }
    .chart      { display: flex; flex-direction: column; gap: 12px; }
    .chart-row  { display: flex; align-items: center; gap: 10px; }
    .chart-lbl  { flex: 0 0 68px; font-size: .7rem; color: var(--text-2); text-align: right; }
    .chart-bar-bg { flex: 1; background: var(--border-lt); border-radius: 4px; height: 7px; overflow: hidden; }
    .chart-bar  { height: 100%; background: var(--accent); border-radius: 4px; transition: width .5s ease; }
    .chart-amt  { flex: 0 0 66px; font-size: .7rem; color: var(--text-2); text-align: right; }
    .synced-at  { font-size: .66rem; color: var(--text-3); text-align: center; margin-top: 14px; }
    .panel-empty { text-align: center; padding: 40px 0; font-size: .82rem; color: var(--text-3); letter-spacing: .05em; }

    /* ── Expense Detail ────────────────────────────────── */
    .detail-section { margin-top: 22px; }
    .detail-header {
      font-size: .7rem; letter-spacing: .2em; color: var(--text-3);
      margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    .detail-header::before { content: '·'; color: var(--accent); font-size: 1.2rem; line-height: 1; }
    .detail-header::after  { content: ''; flex: 1; height: 1px; background: var(--border); }
    .detail-tabs {
      display: flex; gap: 6px; overflow-x: auto;
      scrollbar-width: none; margin-bottom: 12px; padding-bottom: 2px;
    }
    .detail-tabs::-webkit-scrollbar { display: none; }
    .detail-tab {
      flex: 0 0 auto; padding: 6px 13px; border-radius: 16px;
      font-size: .7rem; font-weight: 500;
      border: 1px solid var(--border);
      background: var(--surface); color: var(--text-3);
      white-space: nowrap; line-height: 1.3; text-align: center;
    }
    .detail-tab span { display: block; font-size: .6rem; color: var(--text-3); margin-top: 1px; font-weight: 400; }
    .detail-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .detail-tab.active span { color: rgba(255,255,255,.7); }
    .record-list    { display: flex; flex-direction: column; gap: 8px; }
    .record-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 13px; background: var(--surface);
      border: 1px solid var(--border-lt); border-left: 3px solid var(--accent-bd);
      border-radius: var(--r);
    }
    .record-name   { font-size: .85rem; font-weight: 500; color: var(--text-1); }
    .record-meta   { font-size: .68rem; color: var(--text-3); margin-top: 2px; }
    .record-amount { font-size: .85rem; font-weight: 600; color: var(--accent-deep); white-space: nowrap; }
    .record-empty  { text-align: center; padding: 20px 0; font-size: .8rem; color: var(--text-3); }
    .record-subtotal { text-align: right; font-size: .7rem; color: var(--text-3); margin-top: 8px; padding-right: 2px; }
    .record-del {
      font-size: .78rem; color: var(--text-3); padding: 4px 8px;
      border-radius: 6px; flex-shrink: 0; line-height: 1;
    }
    .record-del:active { color: var(--red); background: rgba(176,90,90,.08); }

    /* ── Print Button ──────────────────────────────────── */
    .print-wrap { padding: 14px 20px 36px; }
    .print-btn {
      width: 100%; padding: 12px;
      border: 1px solid var(--border); border-radius: var(--r-sm);
      background: var(--surface); color: var(--text-3);
      font-size: .82rem; letter-spacing: .08em;
    }

    /* ── Toast ─────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: var(--accent-deep); color: #fff;
      padding: 10px 22px; border-radius: 20px;
      font-size: .8rem; letter-spacing: .05em;
      opacity: 0; transition: opacity .3s;
      pointer-events: none; white-space: nowrap; z-index: 9999;
    }
    #toast.show { opacity: 1; }

    /* ── Confirm Modal ─────────────────────────────────── */

</head>

<script>
/* ─── Config ──────────────────────────────────────────── */
var API_URL   = 'https://script.google.com/macros/s/AKfycbyFbLN8_5oVJ6UcPROYyxuM3RiixTr2Oi54Kl92qbsCd5lZizU41VDqtqzdVHhU1XMNpg/exec';
var GAS_URL   = 'https://script.google.com/macros/s/AKfycbw2dnCQjJJv8yBo--WVmSJ5KxjlyHXl51ukr1hnPJ1CH9MuzPUGNPJi7x7X5UQqYhmaTw/exec';
var PASS_CODE = '0315';
var AUTH_KEY  = 'tokyo_trip_auth';
var AUTH_DAYS = 3;
var JPY_TWD        = 0.215;
var tripDays       = [];
var itineraryState = [];   // Task 5：增刪操作的可變狀態
var flightsData    = [];   // 班機資訊（來自 GAS flights 頁籤）
var _addTargetDay  = null; // 新增 modal 的目標天數
var modalMap       = null; // Google Maps 實例（建立後跨 modal 重複使用）
var currentMarker  = null; // 地圖當前圖釘（永遠只保留一個）
var tempPlaceData  = null; // 暫存選取的地點 { lat, lng, name, description, region }

/* ─── Auth ────────────────────────────────────────────── */
function isAuthed() {
  try {
    var s = localStorage.getItem(AUTH_KEY);
    return s ? Date.now() < JSON.parse(s).expiry : false;
  } catch(e) { return false; }
}

function saveAuth() {
  localStorage.setItem(AUTH_KEY, JSON.stringify({ expiry: Date.now() + AUTH_DAYS * 86400000 }));
}

function initAuth() {
  if (isAuthed()) { boot(); return; }

  var overlay = document.getElementById('auth-overlay');
  var input   = document.getElementById('auth-input');
  var errEl   = document.getElementById('auth-error');
  overlay.style.display = 'flex';
  setTimeout(function(){ input.focus(); }, 120);

  function tryLogin() {
    if (input.value === PASS_CODE) {
      saveAuth();
      overlay.style.display = 'none';
      boot();
    } else {
      errEl.textContent = '密碼錯誤，請再試一次';
      input.value = '';
      input.focus();
      setTimeout(function(){ errEl.textContent = ''; }, 2000);
    }
  }

  input.addEventListener('input',   function(){ if (input.value.length === 4) tryLogin(); });
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') tryLogin(); });
}

/* ─── Boot Helpers ───────────────────────────────── */

// fetch 加逾時保護（GAS 慢時不讓畫面永遠等待）
function fetchWithTimeout(url, ms) {
  var ctrl  = new AbortController();
  var timer = setTimeout(function() { ctrl.abort(); }, ms);
  return fetch(url, { signal: ctrl.signal })
    .finally(function() { clearTimeout(timer); });
}

function stableSpotKey(spot, dayNum) {
  var raw = String(dayNum) + '|' + String(spot.spot_name || '') + '|'
          + String(spot.latitude || '') + '|' + String(spot.longitude || '');
  var h = 5381;
  for (var i = 0; i < raw.length; i++) {
    h = ((h << 5) + h) ^ raw.charCodeAt(i);
    h = h >>> 0;
  }
  return 'local_' + dayNum + '_' + h.toString(16).slice(-6);
}

// Step 3 + Step 4 + 渲染 — 可重複呼叫（第一次 & GAS 更新都用）
function prepareAndRender(itinerary, isUpdate) {
  var prepared = itinerary.map(function(day) {
    if (!day.dining || !day.dining.length) {
      return Object.assign({}, day, { dining: STATIC_DINING[day.day] || [] });
    }
    return day;
  });
  tripDays = prepared;
  var _tCache = {};
  try { _tCache = JSON.parse(localStorage.getItem('transit_mins_cache') || '{}'); } catch(e) {}
  var _CACHE_TTL = 4 * 3600 * 1000;
  itineraryState = prepared.map(function(d) {
    var prevSpotsMap = {};
    (itineraryState || []).forEach(function(ps) {
      if (ps.day === d.day) ps.spots.forEach(function(s) {
        if (s.spot_id && s.travel_mins > 0) prevSpotsMap[s.spot_id] = s.travel_mins;
      });
    });
    var spots = applyDayOrder(d.day, (d.spots || []).slice()).map(function(s) {
      var withId = s.spot_id ? s : Object.assign({}, s, { spot_id: stableSpotKey(s, d.day) });
      // Transit cache 優先（防止 GAS 背景輪詢覆蓋剛算好的結果）
      var cached = withId.spot_id ? _tCache[withId.spot_id] : null;
      if (cached && (Date.now() - cached.t < _CACHE_TTL)) {
        return Object.assign({}, withId, { travel_mins: cached.m });
      }
      // 次級：GAS=0 時保留本地非零值
      if (!(withId.travel_mins > 0) && withId.spot_id && prevSpotsMap[withId.spot_id] > 0) {
        return Object.assign({}, withId, { travel_mins: prevSpotsMap[withId.spot_id] });
      }
      return withId;
    });
    var savedStart = localStorage.getItem('day_start_' + d.day);
    return Object.assign({}, d, {
      spots:     spots,
      day_start: d._gas_day_start || savedStart || d.day_start
    });
  });
  // 更新前記錄目前 active 的 day（更新後恢復，避免景點消失）
  var activeDayNum = null;
  if (isUpdate) {
    var activePanel = document.querySelector('.day-panel.active');
    if (activePanel) activeDayNum = Number(activePanel.dataset.day);
  }

  renderItinerary(prepared);

  if (!isUpdate) {
    buildCountdown(prepared);
    renderTabs(prepared);
    buildExpForm();
    activateSmartTab(prepared);
  } else {
    var dayToActivate = activeDayNum || (prepared[0] && prepared[0].day);
    if (dayToActivate) {
      var panel = document.querySelector('.day-panel[data-day="' + dayToActivate + '"]');
      if (panel) panel.classList.add('active');
    }
  }
}

// GAS 資料合併到基底 itinerary（dining/note 保留自 itinerary.json）
function mergeGAS(baseItinerary, gasData) {
  var gasMap = {};
  gasData.itinerary.forEach(function(d) { gasMap[d.day] = d; });
  return baseItinerary.map(function(day) {
    var gas = gasMap[day.day];
    if (!gas) return day;
    var fixedSpots = gas.spots.map(function(s) {
      return Object.assign({}, s, s.latitude && s.longitude ? {
        transport: Object.assign({}, s.transport, {
          google_maps_url: buildNavUrl(s.latitude, s.longitude, s.spot_name)
        })
      } : {});
    });
    var hasSortOrder = fixedSpots.some(function(s) { return s.sort_order !== undefined; });
    if (hasSortOrder) fixedSpots.sort(function(a, b) { return (a.sort_order||0)-(b.sort_order||0); });
    var gasDayStart = normalizeHHMM(gas.day_start);
    return Object.assign({}, day, {
      spots:          fixedSpots,
      day_title:      gas.day_title || day.day_title,
      date:           dateToYMD(gas.date) || day.date,
      day_start:      gasDayStart || day.day_start,
      _gas_day_start: gasDayStart
    });
  });
}

// Maps API load 後背景修正籠統地區名（once）
function setupGeocodeListener() {
  window.addEventListener('load', function() {
    if (!window.google || !window.google.maps) return;
    (async function() {
      var changed = {};
      for (var i = 0; i < itineraryState.length; i++) {
        var day = itineraryState[i];
        for (var j = 0; j < day.spots.length; j++) {
          var s = day.spots[j];
          if (s.region_name === '東京市區' && s.latitude && s.longitude) {
            var comps = await reverseGeocodeAddr(s.latitude, s.longitude);
            var region = inferRegionFromAddr(comps);
            if (region) {
              day.spots[j] = Object.assign({}, s, { region_name: region });
              changed[day.day] = day;
            }
          }
        }
      }
      Object.keys(changed).forEach(function(d) { updateDayPanel(changed[+d]); });
    })();
  }, { once: true });
}

/* ─── Boot（Task 4：雙向 API 串接）─────────────────── */
async function boot() {
  document.getElementById('app').style.display = 'block';

  // ── Step 1：載入 itinerary.json（dining/note 基底）
  var baseItinerary;
  try {
    var r1 = await fetch('./data/itinerary.json');
    var j1 = await r1.json();
    baseItinerary = (j1.itinerary || []).map(function(day) {
      var firstReal = (day.spots || []).filter(function(s){ return s.duration > 0 && s.time; })[0];
      return Object.assign({}, day, {
        date:      dateToYMD(day.date),
        day_start: firstReal ? firstReal.time : '09:00'
      });
    });
  } catch(e) {
    baseItinerary = PLACEHOLDER_DATA.itinerary.map(function(day) {
      var firstReal = (day.spots || []).filter(function(s){ return s.duration > 0 && s.time; })[0];
      return Object.assign({}, day, {
        date:      dateToYMD(day.date),
        day_start: firstReal ? firstReal.time : '09:00'
      });
    });
  }

  // ── Step 2：GAS 快取 + 新資料
  var gasCache = null;
  try {
    var cached = localStorage.getItem('gas_cache');
    if (cached) gasCache = JSON.parse(cached);
  } catch(e) { localStorage.removeItem('gas_cache'); }

  if (gasCache && gasCache.itinerary && gasCache.itinerary.length) {
    // ── 快取路徑：立即用上次 GAS 資料渲染（第二次以後開啟超快）
    var itinerary = mergeGAS(baseItinerary, gasCache);
    if (gasCache.flights) flightsData = gasCache.flights;
    prepareAndRender(itinerary, false);
    fetchWeather(itinerary);
    fetchTodayHeaderWeather();
    setupGeocodeListener();

    // 背景抓新 GAS，到了更新快取並靜默重渲染
    if (API_URL) {
      fetchWithTimeout(API_URL, 6000)
        .then(function(r) { return r.json(); })
        .then(function(fresh) {
          if (fresh.itinerary && fresh.itinerary.length) {
            localStorage.setItem('gas_cache', JSON.stringify(fresh));
            if (fresh.flights && fresh.flights.length) flightsData = fresh.flights;
            prepareAndRender(mergeGAS(baseItinerary, fresh), true);
          }
        })
        .catch(function() {});
    }

  } else {
    // ── 無快取路徑：等待 GAS（第一次開啟，只慢一次）
    var itinerary = baseItinerary;
    if (API_URL) {
      try {
        showToast('載入行程中…');
        var r2    = await fetch(API_URL);
        var json2 = await r2.json();
        if (json2.itinerary && json2.itinerary.length) {
          localStorage.setItem('gas_cache', JSON.stringify(json2));
          if (json2.flights && json2.flights.length) flightsData = json2.flights;
          itinerary = mergeGAS(baseItinerary, json2);
        }
      } catch(e) { /* GAS 失敗，沿用 itinerary.json */ }
    }
    prepareAndRender(itinerary, false);
    fetchWeather(itinerary);
    fetchTodayHeaderWeather();
    setupGeocodeListener();
  }

  // ── 背景：記帳統計
  if (GAS_URL && GAS_URL.indexOf('YOUR_') === -1) {
    fetch(GAS_URL)
      .then(function(r){ return r.json(); })
      .then(function(data){ buildSummary(data); })
      .catch(function(){});
  }
}

/* ─── Countdown ───────────────────────────────────────── */
function buildCountdown(days) {
  var tripStart = parseLocalDate(days[0].date);
  var now = new Date();
  var jst = new Date(now.getTime() + (9 * 60 + now.getTimezoneOffset()) * 60000);
  var todayMid = new Date(jst.getFullYear(), jst.getMonth(), jst.getDate());
  var diff = Math.round((tripStart - todayMid) / 86400000);
  if (diff <= 0) return;
  var el = document.getElementById('countdown');
  el.innerHTML = '距離出發還有 <strong>' + diff + '</strong> 天';
  el.removeAttribute('hidden');
}

/* ─── Smart Tab：偵測 JST 自動切換 ───────────────────── */
function getJSTDateStr() {
  var now = new Date();
  var jst = new Date(now.getTime() + (9 * 60 + now.getTimezoneOffset()) * 60000);
  return jst.toISOString().slice(0, 10);
}

function activateSmartTab(itinerary) {
  var today  = getJSTDateStr();
  var target = itinerary[0].day;
  for (var i = 0; i < itinerary.length; i++) {
    if (itinerary[i].date === today) { target = itinerary[i].day; break; }
  }
  switchDay(target);
}

/* ─── Tab Switcher ────────────────────────────────────── */
var WKDAYS = ['日','一','二','三','四','五','六'];

function switchDay(dayNum) {
  document.querySelectorAll('.day-tab').forEach(function(el){
    el.classList.toggle('active', Number(el.dataset.day) === dayNum);
  });
  document.querySelectorAll('.day-panel').forEach(function(el){
    el.classList.toggle('active', Number(el.dataset.day) === dayNum);
  });
  var active = document.querySelector('.day-tab.active');
  if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

/* ─── Render Tabs ─────────────────────────────────────── */
function renderTabs(itinerary) {
  document.getElementById('day-tabs').innerHTML = itinerary.map(function(d){
    var dt   = parseLocalDate(d.date);
    var mmdd = isNaN(dt) ? d.date : (dt.getMonth()+1) + '/' + dt.getDate();
    var wday = isNaN(dt) ? '' : '（' + WKDAYS[dt.getDay()] + '）';
    return '<button class="day-tab" data-day="' + d.day
      + '" onclick="switchDay(' + d.day + ')">'
      + '<span class="tab-label">Day ' + d.day + '</span>'
      + '<span class="tab-date">' + mmdd + wday + '</span>'
      + '</button>';
  }).join('');
}

/* ─── Render Timeline ─────────────────────────────────── */
function renderItinerary(itinerary) {
  document.getElementById('app-content').innerHTML = itinerary.map(renderDayPanel).join('');
}

function renderDayPanel(dayData) {
  var dt = parseLocalDate(dayData.date);
  var dateLabel = isNaN(dt)
    ? String(dayData.date)
    : dt.getFullYear() + '.'
      + String(dt.getMonth()+1).padStart(2,'0') + '.'
      + String(dt.getDate()).padStart(2,'0')
      + '（' + WKDAYS[dt.getDay()] + '）';
  var rawSpots = dayData.spots || [];
  // 班機 spots 分離，不列入時間軸
  var spots = rawSpots.filter(function(s) {
    return !s.spot_name || (s.spot_name.indexOf('去程') === -1 && s.spot_name.indexOf('回程') === -1);
  });

  var dayStartMins = parseTimeMins(dayData.day_start || '09:00');

  // T3b 時間級聯：第一個景點用 day_start，後續景點 = 前一個結束時間 + 交通時間
  var cascadeTimes = [];
  var runningMins = dayStartMins;
  for (var ci = 0; ci < spots.length; ci++) {
    var cs = spots[ci];
    var csFlight = cs.duration === 0 || !cs.duration;
    if (cs.time) {
      runningMins = parseTimeMins(cs.time);  // 有固定時間的景點（itinerary.json）用固定值
      cascadeTimes.push(cs.time);
    } else if (csFlight) {
      cascadeTimes.push('');
    } else {
      cascadeTimes.push(minsToTime(runningMins));
    }
    if (!csFlight) runningMins += (cs.duration || 60);
    // 加上前往下一個景點的交通時間
    if (ci + 1 < spots.length) {
      var nextS = spots[ci + 1];
      var fallbackKm = (cs.latitude && cs.longitude && nextS.latitude && nextS.longitude)
        ? haversineKm(cs.latitude, cs.longitude, nextS.latitude, nextS.longitude) : 0;
      var tMins = nextS.travel_mins > 0
        ? nextS.travel_mins
        : (fallbackKm > 0 ? Math.max(5, Math.round(fallbackKm * 12.5)) : 15);
      runningMins += tMins;
    }
  }

  var spotsHtml = spots.map(function(spot, i){
    var isFlight = spot.duration === 0 || !spot.duration;
    var timeStr  = cascadeTimes[i];

    var isFirst = i === 0;
    var isLast  = i === spots.length - 1;
    var mapsUrl = (spot.transport && spot.transport.google_maps_url)
      ? spot.transport.google_maps_url
      : buildMapsUrl(spot.spot_name);

    var itemClass = 'timeline-item'
      + (isFirst ? ' timeline-item--first' : '')
      + (isLast  ? ' timeline-item--last'  : '');

    var weatherHtml = (spot.latitude && spot.longitude)
      ? '<div class="weather" id="w-' + dayData.date + '-' + i + '" style="display:none"></div>'
      : '';

    var transportHtml = (spot.transport && spot.transport.method)
      ? '<div class="transport">🚃 ' + spot.transport.method
          + (spot.transport.duration ? '<br><span class="transport-dur">⏱ ' + spot.transport.duration + '</span>' : '')
        + '</div>'
      : '';

    return '<div class="' + itemClass + '">'
      + '<div class="timeline-time">'
        + (timeStr ? '<span class="time-badge">' + timeStr + '</span>' : '')
      + '</div>'
      + '<div class="timeline-dot-col">'
        + '<div class="timeline-dot' + (isFlight ? ' timeline-dot--flight' : '') + '"></div>'
      + '</div>'
      + '<div class="timeline-card-col">'
        + '<div class="spot-card' + (isFlight ? ' spot-card--flight' : '') + '">'
          + (!isFlight
            ? '<button class="btn-del-spot"'
                + ' data-day="' + dayData.day + '"'
                + ' data-name="' + spot.spot_name.replace(/"/g, '&quot;') + '"'
                + ' data-spot-id="' + (spot.spot_id || '') + '"'
                + ' onclick="confirmDeleteSpot(this)" title="移除景點">🗑</button>'
              + (!isFirst
                ? '<button class="btn-move-spot btn-move-up" onclick="moveSpot(' + dayData.day + ',' + i + ',\'up\')" title="往上移">↑</button>'
                : '')
              + (!isLast
                ? '<button class="btn-move-spot btn-move-dn" onclick="moveSpot(' + dayData.day + ',' + i + ',\'down\')" title="往下移">↓</button>'
                : '')
            : '')
          + (spot.region_name ? '<span class="spot-region-tag">' + spot.region_name + '</span>' : '')
          + '<div class="spot-name">' + spot.spot_name + '</div>'
          + weatherHtml
          + (spot.address ? '<div class="spot-address">📍 ' + spot.address + '</div>' : '')
          + (spot.description ? '<div class="spot-desc">' + spot.description + '</div>' : '')
          + (function() {
              if (!spot.opening_hours || !spot.opening_hours.length) return '';
              // Date.getDay(): 0=Sun,1=Mon...6=Sat → Google weekday_text: 0=Mon...6=Sun
              var jsDay     = new Date(dayData.date + 'T00:00:00').getDay();
              var googleDay = (jsDay + 6) % 7;
              var todayStr  = spot.opening_hours[googleDay];
              return todayStr ? '<div class="spot-hours">🕐 ' + todayStr + '</div>' : '';
            })()
          + transportHtml
          + (!isFlight
            ? '<div class="spot-footer">'
                + '<a href="' + mapsUrl + '" class="btn-nav" target="_blank" rel="noopener">'
                  + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">'
                  + '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>'
                  + '<circle cx="12" cy="10" r="3"/></svg> 導航前往'
                + '</a>'
                + (spot.duration ? '<span class="spot-duration">' + spot.duration + ' 分鐘</span>' : '')
              + '</div>'
            : '')
        + '</div>'
      + '</div>'
    + '</div>'
    + (function() {
        if (isLast || isFlight) return '';
        var nextSpot = spots[i + 1];
        if (!nextSpot || nextSpot._isFlight) return '';
        var curr = spots[i];
        var km = (curr.latitude && curr.longitude && nextSpot.latitude && nextSpot.longitude)
          ? haversineKm(curr.latitude, curr.longitude, nextSpot.latitude, nextSpot.longitude) : -1;
        var transMins = nextSpot.travel_mins > 0 ? nextSpot.travel_mins : 0;
        var walkMins  = km > 0 ? Math.max(1, Math.round(km * 12.5)) : 0;
        var label = '';
        if (transMins > 0) {
          label = '🚃 ' + transMins + ' 分';
        } else if (km >= 0 && km < 1) {
          label = walkMins > 0 ? ('🚶 ' + walkMins + ' 分') : '';
        } else if (km >= 1 && km < 2) {
          label = walkMins > 0 ? ('🚶 ' + walkMins + ' 分') : '';
        } else {
          label = '🚃 ─';
        }
        if (!label) return '';
        return '<div class="travel-bridge">'
          + '<div></div>'
          + '<div class="travel-bridge-line"></div>'
          + '<div class="travel-bridge-label">' + label + '</div>'
          + '</div>';
      })();
  }).join('');

  var diningStr  = (dayData.dining && dayData.dining.length) ? buildDiningHTML(dayData.dining) : '';
  var addBtnHtml = '<div class="add-spot-wrap">'
    + '<button class="btn-add-spot" onclick="showAddModal(' + dayData.day + ')">➕ 新增此日景點</button>'
  + '</div>';

  // 班機卡片：GAS flights 優先，fallback 到 itinerary.json 中的去程/回程 spots
  var dayFlights = flightsData.filter(function(f) { return f.day === dayData.day; });
  if (!dayFlights.length) {
    dayFlights = rawSpots.filter(function(s) {
      return s.spot_name && (s.spot_name.indexOf('去程') !== -1 || s.spot_name.indexOf('回程') !== -1);
    }).map(function(s) {
      return { day: dayData.day, spot_name: s.spot_name, description: s.description, transport: s.transport };
    });
  }
  var flightCardHtml = dayFlights.map(buildFlightCard).join('');

  return '<section class="day-panel" data-day="' + dayData.day + '">'
    + '<div class="day-header">'
      + '<div class="day-header-actions">'
      + '<button class="btn-sort-day" onclick="triggerOptimizeDay(' + dayData.day + ')" title="自動排出最短路線">🔀 最佳路線</button>'
      + '<button class="btn-calc-travel" id="btn-calc-' + dayData.day + '" onclick="calcTravelTimes(' + dayData.day + ')" title="查詢精確大眾運輸交通時間">🕐 交通時間</button>'
      + '</div>'
      + '<span class="day-number-badge">DAY ' + dayData.day + '</span>'
      + '<h2 class="day-panel-title">' + dayData.day_title + '</h2>'
      + '<p class="day-panel-date">' + dateLabel + '</p>'
      + '<div class="day-start-wrap">'
        + '<span class="day-start-label">⏰ 出發時間</span>'
        + '<input class="day-start-input" type="time" value="' + (dayData.day_start || '09:00') + '"'
          + ' oninput="storeDayStart(' + dayData.day + ', this.value)"'
          + ' onblur="updateDayStart(' + dayData.day + ', this.value)">'
      + '</div>'
    + '</div>'
    + (flightCardHtml && dayData.day === 1 ? flightCardHtml : '')
    + addBtnHtml
    + '<div class="timeline">' + spotsHtml + '</div>'
    + (flightCardHtml && dayData.day === 6 ? flightCardHtml : '')
    + diningStr
  + '</section>';
}

/* ─── Dining HTML ─────────────────────────────────────── */
function buildDiningHTML(items) {
  var ORDER = ['早餐','午餐','晚餐','咖啡廳'];
  var ICONS  = { '早餐':'☀', '午餐':'🍱', '晚餐':'🌙', '咖啡廳':'☕' };
  var groups = {};
  items.forEach(function(d){
    var cat = d.category || '其他';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(d);
  });

  var cardHTML = function(d) {
    return '<div class="dining-card">'
      + '<div class="dining-card-top">'
        + '<span class="dining-name">' + d.name + '</span>'
        + '<span class="dining-type">' + d.type + '</span>'
      + '</div>'
      + '<div class="dining-desc">' + d.description + '</div>'
      + (d.google_maps_url
        ? '<a href="' + d.google_maps_url + '" target="_blank" rel="noopener" class="dining-nav">'
            + '<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/></svg>'
            + ' 前往導航</a>'
        : '')
    + '</div>';
  };

  var sections = ORDER.filter(function(c){ return groups[c]; }).map(function(c){
    return '<div class="dining-group">'
      + '<div class="dining-group-label">' + (ICONS[c] || '') + ' ' + c + '</div>'
      + groups[c].map(cardHTML).join('')
    + '</div>';
  }).join('');

  return '<div class="dining-section">'
    + '<div class="dining-label">🍽 周邊美食</div>'
    + sections
  + '</div>';
}

/* ─── Header GPS Weather ──────────────────────────────── */
function fetchTodayHeaderWeather() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function(pos) {
    var lat = pos.coords.latitude, lon = pos.coords.longitude;
    var today = getJSTDateStr();
    var wUrl = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon
      + '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max'
      + '&timezone=auto&start_date=' + today + '&end_date=' + today;
    var gUrl = 'https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lon
      + '&format=json&zoom=10';
    Promise.all([
      fetch(wUrl).then(function(r){ return r.json(); }),
      fetch(gUrl, { headers: { 'Accept-Language': 'zh-TW,zh' } }).then(function(r){ return r.json(); })
    ]).then(function(results) {
      var j = results[0], geo = results[1];
      var d = j.daily;
      if (!d || !d.time || !d.time.length) return;
      var tMax = Math.round(d.temperature_2m_max[0]);
      var tMin = Math.round(d.temperature_2m_min[0]);
      var prob = d.precipitation_probability_max[0] || 0;
      var rain = d.precipitation_sum[0] || 0;
      var area = (geo.address || {}).city || (geo.address || {}).town || (geo.address || {}).county || '';
      var el = document.getElementById('hdr-weather');
      if (!el) return;
      var txt = area ? area + ' · ' : '';
      txt += tMax + '°↕' + tMin + '° · ☔' + prob + '%';
      if (rain > 0 || prob > 30) txt += ' · ☂帶傘';
      el.textContent = txt;
    }).catch(function(){});
  }, function(){}, { timeout: 8000 });
}

/* ─── Spot Weather (Open-Meteo) ───────────────────────── */
async function fetchWeather(days) {
  var regionMap = {};
  days.forEach(function(day){
    (day.spots || []).forEach(function(spot){
      if (spot.region_name && spot.latitude && spot.longitude && !regionMap[spot.region_name]) {
        regionMap[spot.region_name] = { lat: spot.latitude, lon: spot.longitude, data: null };
      }
    });
  });

  var startDate = days[0].date, endDate = days[days.length-1].date;

  await Promise.all(Object.keys(regionMap).map(async function(region) {
    var loc = regionMap[region];
    try {
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + loc.lat + '&longitude=' + loc.lon
        + '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max'
        + '&timezone=Asia%2FTokyo&start_date=' + startDate + '&end_date=' + endDate;
      var r = await fetch(url);
      var j = await r.json();
      if (j.daily && j.daily.time && j.daily.time.length) regionMap[region].data = j.daily;
    } catch(e) {}
  }));

  days.forEach(function(day){
    (day.spots || []).forEach(function(spot, si){
      if (!spot.region_name) return;
      var loc = regionMap[spot.region_name];
      if (!loc || !loc.data) return;
      var di = loc.data.time.indexOf(day.date);
      if (di < 0) return;
      var tMax = Math.round(loc.data.temperature_2m_max[di]);
      var tMin = Math.round(loc.data.temperature_2m_min[di]);
      var rain = loc.data.precipitation_sum[di] || 0;
      var prob = loc.data.precipitation_probability_max[di] || 0;
      var el = document.getElementById('w-' + day.date + '-' + si);
      if (!el) return;
      var alerts = [];
      if (rain > 0 || prob > 30) alerts.push('<span class="w-alert">☂ 帶傘</span>');
      if (tMax < 15) alerts.push('<span class="w-alert">🧥 外套</span>');
      el.innerHTML = '<span class="w-temp">' + tMax + '°C</span>'
        + '<span style="color:var(--border)">↕</span>'
        + '<span style="color:var(--text-3)">' + tMin + '°C</span>'
        + '<span style="color:var(--border)">｜</span>'
        + '<span>☔ ' + prob + '%</span>'
        + alerts.join('');
      el.style.display = 'flex';
    });
  });
}

function buildExpForm() {

  var today = getJSTDateStr();

  for (var i = 0; i < tripDays.length; i++) { if (tripDays[i].date === today) { defDate = today; break; } }
  if (!defDate && tripDays.length) defDate = tripDays[0].date;

  var dateOptions = tripDays.map(function(d){
    var dt   = parseLocalDate(d.date);
    var mmdd = isNaN(dt) ? d.date : (dt.getMonth()+1) + '/' + dt.getDate() + '（' + WKDAYS[dt.getDay()] + '）';
    return '<option value="' + d.date + '"' + (d.date === defDate ? ' selected' : '') + '>Day ' + d.day + ' · ' + mmdd + '</option>';
  }).join('');

  wrap.innerHTML = '<form class="exp-form" onsubmit="submitExp(event)">'
    + '<div class="field"><label>日期</label><select id="e-date">' + dateOptions + '</select></div>'
    + '<div class="row">'
      + '<div class="field"><label>分類</label><select id="e-cat">'
        + '<option>餐飲</option><option>交通</option><option>體驗</option>'
        + '<option>購物</option><option>購物-寶寶</option><option>購物-ㄚ鼻</option><option>其他</option>'
      + '</select></div>'
      + '<div class="field"><label>支付方式</label><select id="e-pay">'
        + '<option>現金</option><option>寶寶信用卡</option><option>寶寶中信附卡</option><option>ㄚ鼻中信卡</option>'
      + '</select></div>'
    + '</div>'
    + '<div class="field"><label>項目</label><input type="text" id="e-item" placeholder="例：藏前咖啡" required></div>'
    + '<div class="field"><label>金額（日圓 ¥）</label>'
      + '<input type="number" id="e-jpy" placeholder="0" min="0" step="1" oninput="updTWD()" required>'
      + '<div class="twd" id="twd-preview">≈ TWD —</div>'
    + '</div>'
    + '<button type="submit" class="submit-btn">記帳</button>'
  + '</form>';
}

function updTWD() {
  var jpy = +document.getElementById('e-jpy').value;
  document.getElementById('twd-preview').textContent =
    jpy > 0 ? '≈ TWD ' + Math.round(jpy * JPY_TWD).toLocaleString() : '≈ TWD —';
}

async function submitExp(e) {
  e.preventDefault();
  var payload = {
    date:       document.getElementById('e-date').value,
    item:       document.getElementById('e-item').value,
    category:   document.getElementById('e-cat').value,
    payment:    document.getElementById('e-pay').value,
    amount_jpy: +document.getElementById('e-jpy').value
  };
  try {
    await fetch(GAS_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    showToast('✓ 已記帳，統計更新中…');
    document.getElementById('e-item').value = '';
    document.getElementById('e-jpy').value  = '';
    document.getElementById('twd-preview').textContent = '≈ TWD —';
    setTimeout(function(){
      fetch(GAS_URL)
        .then(function(r){ return r.json(); })
        .then(function(data){ buildSummary(data); showToast('✓ 統計已更新'); })
        .catch(function(){});
    }, 2000);
  } catch(e) { showToast('送出失敗，請確認網路'); }
}

// Places API 景點搜尋
async function searchPlace() {
  document.activeElement.blur(); // 立刻收合虛擬鍵盤（在任何非同步作業前執行）

  var searchBtn = document.getElementById('modal-search-btn');
  try {
    if (!modalMap) { showToast('地圖尚未準備好，請稍後再試'); return; }

    var query = document.getElementById('modal-search-input').value.trim();
    if (!query) return;

    searchBtn.disabled    = true;
    searchBtn.textContent = '搜尋中…';

    // 動態 locationBias：以當天第一個景點為中心往外 10km
    var biasCenter = { lat: 35.6762, lng: 139.6503 }; // 預設：東京市中心
    if (_addTargetDay !== null) {
      var targetDay = itineraryState.filter(function(d){ return d.day === _addTargetDay; })[0];
      if (targetDay && targetDay.spots) {
        var anchor = targetDay.spots.filter(function(s){ return s.latitude && s.longitude; })[0];
        if (anchor) biasCenter = { lat: anchor.latitude, lng: anchor.longitude };
      }
    }

    var { Place } = await google.maps.importLibrary('places');
    var { places } = await Place.searchByText({
      textQuery: query,
      fields: ['id', 'displayName', 'formattedAddress', 'location', 'addressComponents', 'regularOpeningHours', 'editorialSummary'],
      language: 'zh-TW',
      locationBias: { center: biasCenter, radius: 10000 }
    });

    if (!places || !places[0]) {
      showToast('找不到景點，請換個關鍵字');
      return;
    }

    var place = places[0];
    var lat   = place.location.lat();
    var lng   = place.location.lng();
    var name  = place.displayName || '';
    var addr  = place.formattedAddress || '';

    // 放置圖釘、平移地圖
    placeMarkerAt(lat, lng, name, '');
    tempPlaceData.region       = formatRegionFromAddress(addr);
    tempPlaceData.placeId      = place.id || '';
    tempPlaceData.address      = addr;
    tempPlaceData.openingHours = (place.regularOpeningHours && place.regularOpeningHours.weekdayDescriptions)
                                 ? place.regularOpeningHours.weekdayDescriptions : [];
    tempPlaceData.description  = place.editorialSummary || '';

    modalMap.panTo({ lat: lat, lng: lng });
    modalMap.setZoom(16);
    document.getElementById('modal-spot-name').value = name;

    // region 由 reverseGeocodeAddr (language: ja) 負責，searchByText(zh-TW) 的 addressComponents 對日本地址回傳英文無法使用
    // 鎖定確認按鈕，JS Geocoder 反查取得 region 後解鎖
    var confirmBtn = document.getElementById('add-confirm-btn');
    confirmBtn.disabled  = true;
    confirmBtn.innerText = '📍 取得地址中…';

    reverseGeocodeAddr(lat, lng).then(function(components) {
      var region = regionFromComponents(components);
      if (region) tempPlaceData.region = region;
      if (tempPlaceData.region) {
        confirmBtn.disabled  = false;
        confirmBtn.innerText = '💾 加入行程';
        return;
      }
      // Google 全失敗 → Nominatim 保底
      return reverseGeocodeNominatim(lat, lng).then(function(addr) {
        var nr = regionFromNominatim(addr);
        console.log('[region] Nominatim fallback result:', nr);
        if (nr && !tempPlaceData.region) tempPlaceData.region = nr;
        confirmBtn.disabled  = false;
        confirmBtn.innerText = '💾 加入行程';
      });
    }).then(function() {
      confirmBtn.disabled  = false;
      confirmBtn.innerText = '💾 加入行程';
    }).catch(function() {
      confirmBtn.disabled  = false;
      confirmBtn.innerText = '💾 加入行程';
    });

  } catch(err) {
    console.error('[searchPlace] error:', err);
    showToast('搜尋失敗，請換個關鍵字或稍後再試');
  } finally {
    searchBtn.disabled    = false;
    searchBtn.textContent = '🔍 查詢';
    document.activeElement.blur();
  }
}

// formatted_address 解析：直接從 zh-TW 的中文地址字串切出「府縣 町名」
// 例：「〒279-0031 日本千葉縣浦安市舞濱1番地1」→「千葉 舞濱」
//     「〒116-0013 東京都荒川区西日暮里３丁目」→「東京 西日暮里」
// Google Geocoding REST API address_components → 「都道府縣 町名」格式
// isCJK 守護：若 API 回傳英文（"Tokyo"）則回傳 '' 防止顯示英文
function regionFromComponents(components) {
  if (!components || !components.length) return '';
  var isCJK = function(s) { return /[一-鿿぀-ヿ]/.test(s || ''); };
  var find = function(type) {
    for (var i = 0; i < components.length; i++)
      if (components[i].types.indexOf(type) >= 0) return components[i].long_name;
    return '';
  };

  // 縣市（東京都 → 東京）
  var rawPref = find('administrative_area_level_1');
  if (!isCJK(rawPref)) return '';
  var pref = rawPref.replace(/[都道府縣県]$/, '');

  // 行政區 / 城市（目黒区 → 目黒区，川越市 → 川越）：保留 区/區，剝掉 市/郡
  var rawWard = find('locality') || find('administrative_area_level_2');
  var ward = isCJK(rawWard) ? rawWard.replace(/[市郡]$/, '') : '';

  // 街區名（浅草、谷中）：剝掉「町/丁」後不足 2 字則跳過（幸町→幸→跳過）
  var rawSub = find('sublocality_level_1') || find('sublocality_level_2');
  var strippedSub = isCJK(rawSub) ? rawSub.replace(/[町丁]$/, '') : '';
  var sub = strippedSub.length >= 2 ? strippedSub : '';

  var parts = [pref];
  if (ward) parts.push(ward);
  if (sub && sub !== ward) parts.push(sub);
  return parts.join(' ');
}

// formatted_address 字串解析（僅作 fallback，當 address_components 是英文時使用）
function formatRegionFromAddress(addr) {
  if (!addr) return '';
  var s   = addr.replace(/〒[\d-]+\s*/g, '').replace(/日本[,，、]?\s*/g, '').trim();
  var CJK = '\\u4E00-\\u9FFF\\u3040-\\u30FF';
  var prefMatch = s.match(new RegExp('([' + CJK + ']{1,6}[都道府縣県])'));
  if (!prefMatch) return '';
  var pref     = prefMatch[1].replace(/[都道府縣県]$/, '');
  var rest     = s.slice(s.indexOf(prefMatch[1]) + prefMatch[1].length);
  var cityMatch = rest.match(new RegExp('^([' + CJK + ']{1,8}[市区區郡])'));
  var afterCity = cityMatch ? rest.slice(cityMatch[0].length) : rest;
  var cityName  = cityMatch ? cityMatch[1].replace(/[市郡]$/, '') : '';  // 保留 区/區
  var townMatch = afterCity.match(new RegExp('^([' + CJK + ']{1,10})'));
  var town      = (townMatch && townMatch[1]) ? townMatch[1] : cityName;
  return pref + (town ? ' ' + town : '');
}

// 從 Places API 的 formatted_address 字串推斷 region_name
// （鏡像 inferRegionFromAddr 的關鍵字邏輯，但輸入是純字串）
function inferRegionFromPlaceAddress(addr) {
  if (/鎌倉/.test(addr))                                                      return '鎌倉';
  if (/江の島|江ノ島|片瀬|藤沢/.test(addr))                                   return '湘南・江之島';
  if (/逗子|葉山|茅ヶ崎|平塚/.test(addr))                                     return '湘南';
  if (/箱根/.test(addr))                                                       return '箱根';
  if (/川越/.test(addr))                                                       return '川越';
  if (/舞浜|浦安/.test(addr))                                                  return '舞濱・千葉';
  if (/成田/.test(addr))                                                       return '成田';
  if (/千葉/.test(addr))                                                       return '千葉';
  if (/横浜|横濱/.test(addr))                                                  return '橫濱';
  if (/羽田|大田区/.test(addr))                                                return '羽田・東京灣';
  if (/埼玉/.test(addr))                                                       return '埼玉';
  if (/東京|台東|渋谷|新宿|千代田|中央区|港区|品川|目黒|世田谷|杉並|豊島|文京|墨田|江東|荒川|足立|葛飾|江戸川|板橋|練馬|北区|中野/.test(addr)) return '東京市區';
  if (/神奈川/.test(addr))                                                     return '神奈川';
  return '';
}

// 初始化 Google Maps（Modal 開啟時呼叫）
function initModalMap() {
  if (!window.google || !window.google.maps) {
    showToast('地圖載入中，請稍後再試');
    return;
  }
  // 每次開啟 Modal 時清除舊圖釘與暫存資料
  if (currentMarker) { currentMarker.setMap(null); currentMarker = null; }
  tempPlaceData = null;

  if (modalMap) {
    // 地圖已初始化：通知重新計算尺寸（從 hidden 變回可見後必要）
    google.maps.event.trigger(modalMap, 'resize');
    modalMap.panTo({ lat: 35.6762, lng: 139.6503 });
    modalMap.setZoom(13);
    return;
  }

  // 首次初始化
  var placeholder = document.querySelector('.modal-map-placeholder');
  if (placeholder) placeholder.style.display = 'none';

  modalMap = new google.maps.Map(document.getElementById('modal-map'), {
    center: { lat: 35.6762, lng: 139.6503 }, // 東京市中心
    zoom: 13,
    gestureHandling: 'greedy',  // 單指拖曳（全螢幕 Modal 不需雙指鎖定）
    disableDefaultUI: true,
    zoomControl: true
  });

  // 點擊地圖 → 放置圖釘
  // e.placeId 存在表示使用者點了 Google Maps 上的 POI（店家/景點），可直接取完整資料
  modalMap.addListener('click', async function(e) {
    var lat = e.latLng.lat();
    var lng = e.latLng.lng();

    if (e.placeId) {
      try {
        var { Place } = await google.maps.importLibrary('places');
        var place = new Place({ id: e.placeId });
        await place.fetchFields({
          fields: ['id', 'displayName', 'formattedAddress', 'addressComponents', 'location', 'regularOpeningHours', 'editorialSummary']
        });

        var detailLat = place.location.lat();
        var detailLng = place.location.lng();
        var hours = (place.regularOpeningHours && place.regularOpeningHours.weekdayDescriptions)
                    ? place.regularOpeningHours.weekdayDescriptions : [];
        var desc  = place.editorialSummary || '';

        placeMarkerAt(detailLat, detailLng, place.displayName || '', desc);
        tempPlaceData.placeId      = place.id || '';
        tempPlaceData.address      = place.formattedAddress || '';
        tempPlaceData.region       = formatRegionFromAddress(place.formattedAddress || '');
        if (place.addressComponents && place.addressComponents.length) {
          var shimmed = place.addressComponents.map(function(c) {
            return { long_name: c.longText, short_name: c.shortText, types: c.types };
          });
          var r = regionFromComponents(shimmed);
          if (r) tempPlaceData.region = r;
        }
        tempPlaceData.openingHours = hours;

        document.getElementById('modal-spot-name').value = place.displayName || '';

        // JS Geocoder 反查取 zh-TW region（鎖住確認按鈕直到回傳）
        var _confirmBtn = document.getElementById('add-confirm-btn');
        _confirmBtn.disabled  = true;
        _confirmBtn.innerText = '📍 取得地址中…';
        reverseGeocodeAddr(detailLat, detailLng).then(function(components) {
          var region = regionFromComponents(components);
          if (region) tempPlaceData.region = region;
          if (tempPlaceData.region) {
            _confirmBtn.disabled  = false;
            _confirmBtn.innerText = '💾 加入行程';
            return;
          }
          // Google 全失敗 → Nominatim 保底
          return reverseGeocodeNominatim(detailLat, detailLng).then(function(addr) {
            var nr = regionFromNominatim(addr);
            console.log('[region] Nominatim fallback (map click):', nr);
            if (nr && !tempPlaceData.region) tempPlaceData.region = nr;
            _confirmBtn.disabled  = false;
            _confirmBtn.innerText = '💾 加入行程';
          });
        }).then(function() {
          _confirmBtn.disabled  = false;
          _confirmBtn.innerText = '💾 加入行程';
        }).catch(function() {
          _confirmBtn.disabled  = false;
          _confirmBtn.innerText = '💾 加入行程';
        });
      } catch(err) {
        console.error('[map click] fetchFields error:', err);
        placeMarkerAt(lat, lng, null, null);
      }
    } else {
      // 點空白處：只有座標，無店家資訊
      placeMarkerAt(lat, lng, null, null);
    }
  });
}

// 放置唯一圖釘（銷毀舊圖釘、建立新圖釘、暫存座標）
function placeMarkerAt(lat, lng, name, description) {
  if (currentMarker) { currentMarker.setMap(null); currentMarker = null; }

  currentMarker = new google.maps.Marker({
    position: { lat: lat, lng: lng },
    map: modalMap,
    animation: google.maps.Animation.DROP
  });

  tempPlaceData = { lat: lat, lng: lng, name: name || '', description: description || '', region: '' };

  // 地圖點擊路徑（無景點名稱）：用 Google Geocoder 反向地理編碼推斷地區名
  if (!name) {
    reverseGeocodeAddr(lat, lng).then(function(components) {
      if (tempPlaceData) tempPlaceData.region = inferRegionFromAddr(components);
    }).catch(function(){});
  }
}

// 從 Google Maps URL 解析座標
// 優先順序：
//   1. !8m2!3d{lat}!4d{lon}  ← 地點頁精確圖釘座標（最準確）
//   2. !3d{lat}!4d{lon}       ← 其他圖釘格式
//   3. /@lat,lon,zoom          ← 地圖畫面中心（較不精確，差距可達數百公尺）
//   4. ?q=lat,lon / ?ll=lat,lon
function parseGoogleMapsCoords(url) {
  if (!url) return null;
  var s = url.trim();

  // 最優先：地點頁 data 參數中的 !8m2!3d{lat}!4d{lon}（精確圖釘）
  var pin8 = s.match(/!8m2!3d([-\d.]+)!4d([-\d.]+)/);
  if (pin8) return { lat: parseFloat(pin8[1]), lon: parseFloat(pin8[2]) };

  // 次優先：其他 !3d{lat}!4d{lon} 格式
  var pin3 = s.match(/!3d([-\d.]+)!4d([-\d.]+)/);
  if (pin3) return { lat: parseFloat(pin3[1]), lon: parseFloat(pin3[2]) };

  // 地圖中心 /@lat,lon,zoom（精度較低，但比無座標好）
  var center = s.match(/@([-\d.]+),([-\d.]+)[,/z]/);
  if (center) return { lat: parseFloat(center[1]), lon: parseFloat(center[2]) };

  // ?q=lat,lon 或 ?ll=lat,lon
  var q = s.match(/[?&](?:q|ll)=([-\d.]+),([-\d.]+)/);
  if (q) return { lat: parseFloat(q[1]), lon: parseFloat(q[2]) };

  return null;
}

// 短網址展開後再解析（maps.app.goo.gl）
async function expandAndParseGoogleMapsUrl(url) {
  // 先試直接解析（可能已是完整 URL）
  var direct = parseGoogleMapsCoords(url);
  if (direct) return direct;

  // 短網址嘗試展開
  if (/maps\.app\.goo\.gl|goo\.gl/i.test(url)) {
    try {
      // 透過 cors-anywhere 或直接 fetch（某些環境允許）
      var r = await fetch('https://corsproxy.io/?' + encodeURIComponent(url), { redirect: 'follow' });
      var text = await r.text();
      // 從 HTML 找 canonical URL 或 meta refresh
      var mm = text.match(/"(https:\/\/www\.google\.com\/maps\/[^"]+)"/);
      if (mm) {
        var expanded = parseGoogleMapsCoords(mm[1]);
        if (expanded) return expanded;
      }
    } catch(e) {}
  }

  return null;
}

// Google Maps URL 貼入時即時解析
async function onMapsUrlInput(val) {
  var statusEl = document.getElementById('add-url-parse-status');
  if (!val.trim()) { statusEl.textContent = ''; return; }

  statusEl.textContent = '🔍 解析中…';
  var coords = await expandAndParseGoogleMapsUrl(val.trim());

    document.getElementById('add-lat').value = coords.lat;

    document.getElementById('add-manual-coords').style.display = 'block';
  }
}

/* ─── Wikipedia 景點介紹自動生成（繁體中文）─────────── */

// 相關性檢查：「查詢主詞」必須出現在文章標題內
// 規則：取查詢字串的第一個詞（主要景點名），該詞必須被標題包含
// 避免「今半 浅草」→「浅草」這種偷渡（浅草包含在查詢中但不是主詞）
function isWikiRelevant(query, title) {
  var q = query.trim().toLowerCase();
  var t = title.trim().toLowerCase();

  // 1. 標題完全包含查詢詞
  if (t.includes(q)) return true;

  // 2. 查詢詞以標題開頭（標題是查詢主詞的核心，如「今半」⊂「今半 浅草」）
  if (q.startsWith(t) && t.length >= 2) return true;

  // 3. 查詢第一詞（空白前）出現在標題中（長度需 ≥ 2 避免單字亂配）
  var firstWord = q.split(/\s+/)[0];
  if (firstWord.length >= 2 && t.includes(firstWord)) return true;

  return false;
}

// 查詢 Wikipedia，支援 variant=zh-tw 繁體中文轉換
async function queryWikipedia(lang, query, variant) {
  try {
    var vp = variant ? '&variant=' + variant : '';

    // Step 1：搜尋最相關頁面標題
    var searchRes = await fetch(
      'https://' + lang + '.wikipedia.org/w/api.php'
      + '?action=query&list=search&format=json&origin=*&srlimit=3'
      + vp + '&srsearch=' + encodeURIComponent(query)
    );
    var searchJson = await searchRes.json();
    var hits = ((searchJson.query || {}).search) || [];
    if (!hits.length) return null;

    // Step 2：從前 3 筆結果中找第一個標題相關的
    var title = null;
    for (var i = 0; i < hits.length; i++) {
      if (isWikiRelevant(query, hits[i].title)) { title = hits[i].title; break; }
    }
    if (!title) return null; // 全部不相關 → 不顯示錯誤內容

    // Step 3：用 MediaWiki API 取純文字摘要（支援 variant 繁體轉換）
    var extractRes = await fetch(
      'https://' + lang + '.wikipedia.org/w/api.php'
      + '?action=query&prop=extracts&exintro=1&explaintext=1&format=json&origin=*'
      + vp + '&titles=' + encodeURIComponent(title)
    );
    var extractJson = await extractRes.json();
    var pages   = ((extractJson.query || {}).pages) || {};
    var pageKey = Object.keys(pages)[0];
    if (!pageKey || pageKey === '-1') return null;

    var extract = (pages[pageKey].extract || '').trim();
    if (extract.length < 20) return null;

    // 取前 2 句、最多 120 字
    var sentences = extract.split(/(?<=[。！？])|(?<=[.!?])\s+/).filter(Boolean);
    var desc = sentences.slice(0, 2).join('');
    return desc.length > 120 ? desc.slice(0, 117) + '…' : desc;

  } catch(e) { return null; }
}

// 繁體中文優先，找不到再試英文
// locationHint：從座標反查出的地名（如「浅草」「台東区」），加入查詢以精確比對
async function fetchWikiDescription(name, locationHint) {
  var hint = (locationHint || '').trim();

  // 1. 繁中 Wikipedia：景點名稱 + 地名（最精確）
  if (hint) {
    var r1 = await queryWikipedia('zh', name + ' ' + hint, 'zh-tw');
    if (r1) return r1;
  }

  // 2. 繁中 Wikipedia：僅景點名稱
  var r2 = await queryWikipedia('zh', name, 'zh-tw');
  if (r2) return r2;

  // 3. 英文 Wikipedia：景點名稱 + 地名
  if (hint) {
    var r3 = await queryWikipedia('en', name + ' ' + hint, null);
    if (r3) return r3;
  }

  // 4. 英文 Wikipedia：僅景點名稱
  return await queryWikipedia('en', name, null);
}

/* ─── Nominatim 反向地理編碼（保底 fallback，Accept-Language: zh-TW 優先）── */
async function reverseGeocodeNominatim(lat, lon) {
  try {
    var r = await fetch(
      'https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lon + '&zoom=14',
      { headers: { 'Accept-Language': 'zh-TW,zh-Hant;q=0.9,ja;q=0.5' } }
    );
    return ((await r.json()).address) || {};
  } catch(e) { return {}; }
}

function regionFromNominatim(addr) {
  if (!addr) return '';
  var strip = function(s) { return (s || '').replace(/[都道府縣県市区區町村郡]$/, ''); };
  var pref = strip(addr.state || addr.province || '');
  if (!pref) return '';
  var town = strip(addr.suburb || addr.neighbourhood || addr.quarter || addr.city_district || '');
  return pref + (town ? ' ' + town : '');
}

/* ─── 反向地理編碼（Google Maps JS Geocoder，取代 REST API，規避 HTTP referrer 限制）── */
async function reverseGeocodeAddr(lat, lon) {
  try {
    var geocoder = new google.maps.Geocoder();
    var response = await geocoder.geocode({ location: { lat: lat, lng: lon }, language: 'ja' });
    var components = (response.results && response.results[0] && response.results[0].address_components) || [];
    var pref = components.filter(function(c){ return c.types.indexOf('administrative_area_level_1') >= 0; })[0];
    console.log('[region] JS Geocoder pref:', pref && pref.long_name);
    return components;
  } catch(e) { console.log('[region] JS Geocoder error:', e); return []; }
}

// 從 Google Geocoder address_components 推斷地區標籤
function inferRegionFromAddr(components) {
  if (!components || !components.length) return '';
  var find = function(type) {
    for (var i = 0; i < components.length; i++)
      if (components[i].types.indexOf(type) >= 0) return components[i].long_name;
    return '';
  };
  var parts = [
    find('sublocality_level_2'), find('sublocality_level_1'), find('sublocality'),
    find('locality'), find('administrative_area_level_2'), find('administrative_area_level_1')
  ].filter(Boolean).join(' ');

  if (/鎌倉/.test(parts))                                             return '鎌倉';
  if (/江の島|江ノ島|江之島|片瀬|片瀨|藤沢|藤澤/.test(parts))       return '湘南・江之島';
  if (/逗子|葉山|茅ヶ崎|平塚/.test(parts))                           return '湘南';
  if (/箱根/.test(parts))                                             return '箱根';
  if (/川越/.test(parts))                                             return '川越';
  if (/舞浜|舞濱|浦安/.test(parts))                                  return '千葉 舞濱';
  if (/成田/.test(parts))                                             return '成田';
  if (/横浜|橫濱|横濱/.test(parts))                                  return '橫濱';
  if (/羽田|大田区|大田區/.test(parts))                              return '羽田・東京灣';
  if (/埼玉/.test(parts))                                             return '埼玉';
  // 其他地區（含東京各區）直接用 Google API 回傳的繁體中文名稱
  return regionFromComponents(components);
}

// 從 address_components 取最精確的地名（作為 Wikipedia 搜尋補充關鍵字）
function locationHintFromAddr(components) {
  if (!components || !components.length) return '';
  var find = function(type) {
    for (var i = 0; i < components.length; i++)
      if (components[i].types.indexOf(type) >= 0) return components[i].long_name;
    return '';
  };
  return find('sublocality_level_2') || find('sublocality_level_1') ||
         find('sublocality') || find('locality') || '';
}

// 保留向後相容（外部仍可直接呼叫）
async function inferRegionName(lat, lon) {
  return inferRegionFromAddr(await reverseGeocodeAddr(lat, lon));
}

// 單次 Nominatim 查詢
async function nominatimQuery(q) {
  var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&q='
    + encodeURIComponent(q);
  var r    = await fetch(url, { headers: { 'Accept-Language': 'zh-TW,ja,en' } });
  var data = await r.json();
  if (data && data.length > 0) {
    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), display: data[0].display_name };
  }
  return null;
}

// 多層重試地理編碼：
//   1. 原始關鍵字
//   2. 原始關鍵字 + 日本（去除「JAPAN」被誤判為國名的干擾）
//   3. 只保留最後一個空格分隔的詞（通常是地區名，如 Asakusa）
async function geocodeSpotName(name) {
  // 嘗試 1：原始輸入
  var r = await nominatimQuery(name);
  if (r) return r;

  // 嘗試 2：移除開頭的 "JAPAN" / "TOKYO" 等干擾字，讓 Nominatim 不混淆國名
  var cleaned = name.replace(/^(JAPAN|TOKYO|OSAKA)\s+/i, '').trim();
  if (cleaned !== name) {
    r = await nominatimQuery(cleaned);
    if (r) return r;
  }

  // 嘗試 3：只取最後一個空白後的地區詞（如 "Asakusa"、"浅草"）
  var parts = name.trim().split(/\s+/);
  if (parts.length > 1) {
    r = await nominatimQuery(parts[parts.length - 1] + ' 日本');
    if (r) return r;
  }

  return null;
}

// 確認新增（地理編碼 → 加入狀態 → 重排 → 同步 GAS）
function confirmAddSpot() {
  // 驗證：必須先透過搜尋或地圖點擊選取地點
  if (!tempPlaceData || typeof tempPlaceData.lat !== 'number') {
    showToast('請先搜尋景點或在地圖上點選位置');
    return;
  }

  var spotName = document.getElementById('modal-spot-name').value.trim();
  if (!spotName) { showToast('請輸入景點名稱'); return; }

  // 4-1：防連擊鎖定（點擊瞬間立刻 disabled，使用者無法重複提交）
  var btn     = document.getElementById('add-confirm-btn');
  btn.disabled  = true;
  btn.innerText = '⏳ 雲端同步中...';

  var duration     = +document.getElementById('add-duration').value || 60;
  var lat          = tempPlaceData.lat;
  var lng          = tempPlaceData.lng;
  var regionName   = tempPlaceData.region || '';
  var description  = tempPlaceData.description  || '';
  var address      = tempPlaceData.address      || '';
  var openingHours = tempPlaceData.openingHours || [];

  var dayIdx = -1;
  for (var i = 0; i < itineraryState.length; i++) {
    if (itineraryState[i].day === _addTargetDay) { dayIdx = i; break; }
  }
  if (dayIdx < 0) { closeAddModal(); return; }

  var dayData = itineraryState[dayIdx];

  // Places API 路徑：用 destination_place_id 讓 Google Maps 顯示店名而非「已放置圖釘」
  // 地圖點擊路徑（無 place_id）：退回座標版 URL
  var placeId = tempPlaceData.placeId || '';
  var navUrl  = placeId
    ? 'https://www.google.com/maps/dir/?api=1&origin=My+Location'
        + '&destination=' + encodeURIComponent(spotName)
        + '&destination_place_id=' + placeId
        + '&travelmode=transit'
    : buildMapsUrl(regionName ? spotName + ' ' + regionName : spotName);

  var newSpot = {
    spot_name:     spotName,
    duration:      duration,
    region_name:   regionName,
    latitude:      lat,
    longitude:     lng,
    description:   description,
    address:       address,
    opening_hours: openingHours,
    transport:     { google_maps_url: navUrl }
  };

  // 4-2 Layer 1：LocalStorage 立即寫入（GAS 同步前的離線防禦）
  var pendingKey = 'pending_spot_' + Date.now();
  try {
    localStorage.setItem(pendingKey, JSON.stringify({ day: _addTargetDay, spot: newSpot }));
  } catch(e) {}

  // 4-2 Layer 2：立刻更新 UI（使用者體感「秒完成」）
  var merged = dayData.spots.concat([newSpot]);
  itineraryState[dayIdx] = Object.assign({}, dayData, { spots: merged });
  saveDayOrder(_addTargetDay, merged);

  closeAddModal();                               // 同時解鎖 body scroll
  updateDayPanel(itineraryState[dayIdx]);
  showToast('✅ 已新增「' + spotName + '」');

  // 4-2 Layer 3：背景 GAS 同步（不阻擋 UI，網路不穩時 localStorage 保留備份）
  if (API_URL) {
    fetch(API_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action:        'add',
        day:           dayData.day,
        date:          dayData.date,
        day_title:     dayData.day_title,
        spot_name:     spotName,
        duration:      duration,
        region_name:   regionName,
        latitude:      lat,
        longitude:     lng,
        description:   description,
        address:       address,
        opening_hours: JSON.stringify(openingHours),
        sort_order:    dayData.spots.length  // 新景點排在最後
      })
    }).then(function() {
      try { localStorage.removeItem(pendingKey); } catch(e) {}
    }).catch(function() {
      // 同步失敗：localStorage 保留，供日後手動核對
    });
  }
}

// Step 1：顯示確認 Modal（從按鈕的 data attribute 讀取）

  var dayNum   = Number(btn.dataset.day);

  };

// Step 2：實際刪除（優先用 spot_id 查找，解決同名景點問題）
function deleteSpot(dayNum, spotName, spotId) {
  var dayIndex = -1;
  for (var i = 0; i < itineraryState.length; i++) {
    if (itineraryState[i].day === dayNum) { dayIndex = i; break; }
  }
  if (dayIndex < 0) return;

  var dayData  = itineraryState[dayIndex];
  var deleted  = null;

  var remaining = dayData.spots.filter(function(s) {
    if (!deleted) {
      var match = spotId ? s.spot_id === spotId : s.spot_name === spotName;
      if (match) { deleted = s; return false; }
    }
    return true;
  });

  if (!deleted) return;

  itineraryState[dayIndex] = Object.assign({}, dayData, { spots: remaining });
  saveDayOrder(dayNum, remaining);
  updateDayPanel(itineraryState[dayIndex]);
  showToast('✓ 已移除「' + spotName + '」');

  // 背景同步 GAS
  if (API_URL) {
    fetch(API_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'delete', spot_name: spotName, spot_id: spotId || '', day: dayNum })
    }).catch(function(){});
  }
}

/* ─── 景點排序（手動移動 + 最佳路線按鈕）──────────────── */

// 儲存當天景點順序到 localStorage（用 spot_name 陣列記錄）
function saveDayOrder(dayNum, spots) {
  try {
    localStorage.setItem('day_order_' + dayNum, JSON.stringify(
      spots.map(function(s){ return s.spot_id || s.spot_name; })
    ));
  } catch(e) {}
}

// 從 localStorage 讀回儲存的順序並套用
function applyDayOrder(dayNum, spots) {
  var saved = localStorage.getItem('day_order_' + dayNum);
  if (!saved) return spots;
  try {
    var order = JSON.parse(saved);
    var spotMap = {};
    spots.forEach(function(s){ spotMap[s.spot_id || s.spot_name] = s; });
    var reordered = [];
    order.forEach(function(key){ if (spotMap[key]) reordered.push(spotMap[key]); });
    // 新增的景點（不在舊順序中）加到最後
    spots.forEach(function(s){
      if (order.indexOf(s.spot_id || s.spot_name) < 0) reordered.push(s);
    });
    return reordered.length ? reordered : spots;
  } catch(e) { return spots; }
}

// ↑↓ 移動景點
function moveSpot(dayNum, idx, direction) {
  var dayIdx = -1;
  for (var i = 0; i < itineraryState.length; i++) {
    if (itineraryState[i].day === dayNum) { dayIdx = i; break; }
  }
  if (dayIdx < 0) return;
  var spots = itineraryState[dayIdx].spots.slice();
  var target = direction === 'up' ? idx - 1 : idx + 1;
  if (target < 0 || target >= spots.length) return;
  var tmp = spots[idx]; spots[idx] = spots[target]; spots[target] = tmp;
  spots = spots.map(function(s) {
    if (!s.time) return s;
    var copy = Object.assign({}, s);
    delete copy.time;
    return copy;
  });
  itineraryState[dayIdx] = Object.assign({}, itineraryState[dayIdx], { spots: spots });
  saveDayOrder(dayNum, spots);
  updateDayPanel(itineraryState[dayIdx]);
  postOrderToGAS(dayNum, spots);
}
