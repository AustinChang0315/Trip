<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="我的行程">
  <meta name="theme-color" content="#5c6b8a">
  <title>我的行程</title>
  <link rel="manifest" href="manifest.json">
  <script id="google-maps-script" src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA7pEPkce8tZawB7gf9Ae-a4HiCRb5oXww&libraries=places,routes&language=zh-TW&loading=async" defer onerror="handleMapsLoadError()"></script>
  <style>
    /* ── Design Tokens ─────────────────────────────────── */
    :root {
      --bg:           #f4f2ee;
      --surface:      #ffffff;
      --surface-sub:  #fdfcfb;
      --border:       #e5e0d8;
      --border-lt:    #ede9e2;
      --text-1:       #2a2520;
      --text-2:       #6b6560;
      --text-3:       #9c9790;
      --accent:       #5c6b8a;
      --accent-lt:    #edf0f5;
      --accent-bd:    #c8d0de;
      --accent-deep:  #3d4e6a;
      --sage:         #7a8f7e;
      --sage-lt:      #f0f5f1;
      --red:          #b05a5a;
      --gold:         #a07840;
      --gold-lt:      #f7f2e8;
      --tl-line:      #d8d3cc;
      --r:            12px;
      --r-sm:         8px;
      --shadow:       0 1px 4px rgba(42,37,32,.06), 0 4px 16px rgba(42,37,32,.04);
      --font:         -apple-system,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
    }

    /* ── Reset ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-size: 15px; -webkit-text-size-adjust: 100%; }
    body { font-family: var(--font); background: var(--bg); color: var(--text-1); min-height: 100vh; line-height: 1.6; }
    a    { text-decoration: none; }
    button { font-family: var(--font); border: none; cursor: pointer; background: none; }
    input, select, textarea { font: inherit; }

    /* ── Auth Overlay ──────────────────────────────────── */
    #auth-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg);
      display: none; align-items: center; justify-content: center; padding: 32px;
    }
    .auth-card { width: 100%; max-width: 300px; text-align: center; }
    .auth-icon { font-size: 44px; display: block; margin-bottom: 20px; }
    .auth-title { font-size: 1.25rem; font-weight: 700; color: var(--text-1); letter-spacing: .04em; margin-bottom: 4px; }
    .auth-sub   { font-size: .78rem; color: var(--text-3); letter-spacing: .1em; margin-bottom: 44px; }
    #auth-input {
      width: 100%; padding: 16px 24px;
      border: 1.5px solid var(--border); border-radius: var(--r);
      font-size: 1.6rem; letter-spacing: .6em; text-align: center;
      background: var(--surface); color: var(--text-1);
      outline: none; -webkit-appearance: none; transition: border-color .2s; margin-bottom: 10px;
    }
    #auth-input:focus { border-color: var(--accent); }
    #auth-error { font-size: .78rem; color: var(--red); min-height: 20px; }
    .auth-hint  { margin-top: 28px; font-size: .72rem; color: var(--text-3); letter-spacing: .05em; }

    /* ── App Shell ─────────────────────────────────────── */
    #app { display: none; }

    /* ── Header ────────────────────────────────────────── */
    .app-header {
      position: sticky; top: 0; z-index: 100;
      background: var(--accent-deep); border-bottom: 1px solid var(--accent);
      color: #fff;
    }
    .trip-banner {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px 8px;
    }
    .trip-banner-title { font-size: .92rem; font-weight: 600; letter-spacing: .12em; }
    .trip-banner-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .trip-banner-dates { font-size: .68rem; color: rgba(255,255,255,.58); letter-spacing: .06em; }
    #hdr-weather       { font-size: .62rem; color: rgba(255,255,255,.72); letter-spacing: .03em; }
    /* Day Tabs */
    .day-tabs { display: flex; overflow-x: auto; gap: 8px; padding: 0 16px 12px; scrollbar-width: none; -ms-overflow-style: none; }
    .day-tabs::-webkit-scrollbar { display: none; }
    .day-tab {
      flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 7px 14px; border-radius: var(--r-sm);
      border: 1.5px solid rgba(255,255,255,.2);
      background: transparent; color: rgba(255,255,255,.55);
      transition: border-color .18s, background .18s, color .18s;
    }
    .day-tab:active { transform: scale(.97); }
    .day-tab.active { border-color: rgba(255,255,255,.9); background: rgba(255,255,255,.15); color: #fff; }
    .tab-label { font-size: .7rem; font-weight: 700; letter-spacing: .06em; }
    .tab-date  { font-size: .65rem; white-space: nowrap; opacity: .85; }

    /* ── Countdown ─────────────────────────────────────── */
    #countdown {
      background: var(--accent-lt); border-bottom: 1px solid var(--accent-bd);
      text-align: center; padding: 9px 16px;
      font-size: .74rem; color: var(--text-2); letter-spacing: .1em;
    }
    #countdown strong { color: var(--accent); font-size: 1.4rem; font-weight: 300; margin: 0 4px; }

    /* ── Content ───────────────────────────────────────── */
    .app-content { padding-bottom: 0; }
    .day-panel        { display: none; }
    .day-panel.active { display: block; }

    /* Day Header */
    .day-header { padding: 24px 16px 12px; position: relative; }
    .day-header-actions {
      position: absolute; top: 20px; right: 14px;
      display: flex; flex-direction: column; gap: 6px; align-items: stretch;
    }
    .btn-sort-day, .btn-calc-travel {
      font-size: .7rem; font-weight: 600; padding: 5px 10px;
      border-radius: 6px; white-space: nowrap;
      transition: opacity .15s; text-align: center;
    }
    .btn-sort-day {
      border: 1px solid var(--accent-bd);
      color: var(--accent); background: var(--accent-lt);
    }
    .btn-sort-day:active { opacity: .65; }
    .btn-calc-travel {
      border: 1px solid var(--accent-bd);
      color: var(--accent); background: var(--accent-lt);
    }
    .btn-calc-travel:active { opacity: .65; }
    .btn-calc-travel:disabled { opacity: .4; cursor: default; }
    .day-start-wrap { display: flex; align-items: center; gap: 5px; margin-top: 6px; }
    .day-start-label { font-size: .72rem; color: var(--text-3); }
    .day-start-input {
      font-size: .78rem; font-weight: 600; color: var(--text-2);
      border: 1px solid var(--border-lt); border-radius: 5px;
      padding: 3px 7px; background: var(--surface); width: 72px;
    }
    .day-start-confirm {
      font-size: .72rem; font-weight: 600; color: #fff; background: var(--accent);
      border: none; border-radius: 5px; padding: 4px 10px; letter-spacing: .03em;
    }
    .day-number-badge {
      display: inline-block; font-size: .66rem; font-weight: 700; letter-spacing: .1em;
      color: var(--accent); background: var(--accent-lt); padding: 3px 10px; border-radius: 100px; margin-bottom: 8px;
    }
    .day-panel-title { font-size: 1.05rem; font-weight: 700; color: var(--text-1); line-height: 1.4; margin-bottom: 3px; }
    .day-panel-date  { font-size: .75rem; color: var(--text-3); letter-spacing: .04em; }

    /* ── Timeline ──────────────────────────────────────── */
    .timeline { padding: 4px 16px 0; }
    .timeline-item { display: grid; grid-template-columns: 52px 20px 1fr; column-gap: 10px; }
    .timeline-time { display: flex; align-items: flex-start; justify-content: flex-end; padding-top: 19px; }
    .time-badge { font-size: .76rem; font-weight: 600; color: var(--text-2); letter-spacing: .02em; white-space: nowrap; }
    .timeline-dot-col { position: relative; display: flex; justify-content: center; padding-top: 20px; }
    .timeline-dot-col::before {
      content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
      width: 1.5px; background: var(--tl-line); transform: translateX(-50%);
    }
    .timeline-item--first .timeline-dot-col::before { top: 26px; }
    .timeline-item--last  .timeline-dot-col::before { top: 0; bottom: auto; height: 26px; }
    .timeline-item--first.timeline-item--last .timeline-dot-col::before { display: none; }
    .timeline-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--accent); border: 2.5px solid var(--bg);
      box-shadow: 0 0 0 1.5px var(--accent);
      position: relative; z-index: 1; flex-shrink: 0;
    }
    .timeline-dot--flight { background: var(--text-3); box-shadow: 0 0 0 1.5px var(--text-3); }
    .timeline-card-col { padding: 12px 0 20px; }

    /* Travel Bridge（景點間交通時間連接器） */
    .travel-bridge { display: grid; grid-template-columns: 52px 20px 1fr; column-gap: 10px; margin: -6px 0; }
    .travel-bridge-line { position: relative; }
    .travel-bridge-line::before {
      content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
      width: 1.5px; background: var(--tl-line); transform: translateX(-50%);
    }
    .travel-bridge-label { font-size: .7rem; color: var(--text-3); padding: 3px 0; display: flex; align-items: center; gap: 3px; }

    /* Spot Card */
    .spot-card {
      background: var(--surface); border: 1px solid var(--border-lt);
      border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow);
      position: relative;
    }
    .spot-card--flight { background: var(--surface-sub); border-style: dashed; box-shadow: none; }

    /* Flight Info Card（班機獨立卡片） */
    .flight-card {
      position: relative;
      margin: 0 16px 14px; padding: 14px 16px;
      background: var(--surface-sub); border: 1px solid var(--border-lt);
      border-radius: var(--r); box-shadow: var(--shadow);
      display: flex; align-items: flex-start; gap: 10px;
    }
    .flight-card-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 2px; color: var(--text-3); }
    .flight-card-body { flex: 1; min-width: 0; }
    .flight-card-title { font-size: .9rem; font-weight: 700; color: var(--text-1); line-height: 1.35; margin-bottom: 5px; }
    .flight-card-desc  { font-size: .76rem; color: var(--text-2); line-height: 1.7; margin-bottom: 5px; }
    .flight-card-transport { font-size: .78rem; color: var(--text-3); line-height: 1.5; margin-top: 2px; }
    .flight-card--tappable { cursor: pointer; transition: opacity .15s; }
    .flight-card--tappable:active { opacity: .65; }

    /* 出發／抵達對照式版面（結構化班機資料才有）：時間列＋地點列共用同一組 grid 欄寬，兩列左右對齊 */
    .flight-route-top { font-size: .78rem; color: var(--text-3); margin-bottom: 7px; }
    .flight-route {
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; column-gap: 8px; row-gap: 6px;
    }
    .flight-route-time { font-size: 1.6rem; font-weight: 700; color: var(--text-1); line-height: 1.15; white-space: nowrap; }
    .flight-route-time--dep { text-align: left; }
    .flight-route-time--arr { text-align: right; }
    .flight-route-date { font-size: .86rem; color: var(--text-3); text-align: center; white-space: nowrap; }
    .flight-route-place {
      font-size: .86rem; color: var(--text-2); line-height: 1.3; min-width: 0;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; min-height: 1.9em;
    }
    .flight-route-place--dep { text-align: left; }
    .flight-route-place--arr { text-align: right; }
    .flight-route-icon { font-size: 1.05rem; color: var(--accent); text-align: center; }

    /* Delete Button（景點右上角） */
    .btn-del-spot {
      position: absolute; top: 8px; right: 10px;
      font-size: .8rem; color: var(--text-3);
      padding: 3px 5px; border-radius: 5px; line-height: 1;
      background: transparent; transition: color .15s;
    }
    .btn-del-spot:active { color: var(--red); }
    .spot-drag-handle {
      position: absolute; top: 4px; right: 34px;
      padding: 5px 7px; line-height: 1; font-size: .8rem; letter-spacing: -2px;
      color: var(--text-3); opacity: .45; cursor: grab;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    .spot-drag-handle:active { opacity: .9; color: var(--accent); }
    .timeline-item--ghost { opacity: .35; }

    /* Add Spot Button（每天底部） */
    .add-spot-wrap { padding: 12px 16px 4px; display: flex; gap: 8px; }
    .btn-add-spot {
      flex: 1; padding: 10px;
      border: 1.5px dashed var(--accent-bd);
      border-radius: var(--r-sm);
      background: transparent; color: var(--accent);
      font-size: .8rem; letter-spacing: .06em;
      transition: background .15s;
    }
    .btn-add-spot:active { background: var(--accent-lt); }
    .btn-add-spot.btn-refresh {
      flex: 0 0 44px;
      font-size: .95rem; letter-spacing: 0; padding: 10px 0;
    }

    /* Add Spot Modal */
    .geocode-status { font-size: .75rem; color: var(--text-2); min-height: 18px; margin-top: 6px; line-height: 1.5; }
    .modal-subtitle { font-size: .75rem; color: var(--text-3); text-align: center; margin-bottom: 18px; }
    .spot-region-tag {
      display: inline-block; font-size: .63rem; font-weight: 600; letter-spacing: .08em;
      color: var(--sage); background: var(--sage-lt);
      padding: 2px 8px; border-radius: 100px; margin-bottom: 6px;
    }
    .spot-name { font-size: .92rem; font-weight: 700; color: var(--text-1); line-height: 1.35; margin-bottom: 6px; overflow-wrap: anywhere; }
    .spot-card--editable .spot-name { padding-right: 60px; } /* 讓出右上角拖曳把手＋刪除鈕的位置，長名稱才不會被蓋住 */
    .spot-address { font-size: .71rem; color: var(--text-3); line-height: 1.5; margin-bottom: 5px; }
    .spot-hours {
      font-size: .73rem; color: var(--text-2); line-height: 1.5;
      background: var(--accent-lt); border: 1px solid var(--accent-bd);
      border-radius: 6px; padding: 5px 10px; margin-bottom: 8px;
    }
    .spot-desc { font-size: .78rem; color: var(--text-2); line-height: 1.7; margin-bottom: 8px; }

    /* Weather (day-level summary in day-header) */
    .day-weather-summary {
      display: flex; flex-direction: column; gap: 6px;
      margin: 6px 0 0; padding: 6px 10px;
      background: var(--sage-lt); border-radius: 8px;
      font-size: .73rem; border: 1px solid rgba(122,143,126,.2);
    }
    .dw-entry-block {
      display: flex; flex-direction: column; gap: 4px;
      padding-bottom: 6px; border-bottom: 1px solid rgba(122,143,126,.12);
    }
    .dw-entry-block:last-child { padding-bottom: 0; border-bottom: none; }
    .dw-entry  { display: flex; align-items: center; gap: 4px; }
    .dw-region { font-size: .65rem; color: var(--text-3); }
    .w-temp    { font-weight: 600; color: var(--sage); }
    .w-alert   { color: var(--red); }
    .dw-hr-row { display: flex; flex-wrap: wrap; gap: 2px 3px; }
    .dw-hr-item { display: flex; flex-direction: column; align-items: center; gap: 1px; flex: 1; min-width: 0; padding: 2px 1px; border-radius: 3px; }
    .dw-hr-time { font-size: .58rem; color: var(--text-3); }
    .dw-hr-icon { font-size: .8rem; line-height: 1; }
    .dw-hr-prob { font-size: .65rem; font-weight: 600; }

    /* Transport */
    .transport {
      background: var(--accent-lt); border-radius: 7px;
      padding: 7px 11px; margin-bottom: 10px;
      font-size: .74rem; color: var(--text-2); line-height: 1.6;
      border: 1px solid var(--accent-bd);
    }
    .transport-dur { color: var(--text-3); }

    .spot-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .btn-nav {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px; background: var(--accent); color: #fff;
      border-radius: var(--r-sm); font-size: .76rem; font-weight: 600;
      letter-spacing: .03em; transition: opacity .15s;
    }
    .btn-nav:active { opacity: .8; }
    .spot-duration { font-size: .7rem; color: var(--text-3); letter-spacing: .03em; }

    /* ── Divider ────────────────────────────────────────── */
    .divider {
      height: 10px; margin-top: 8px;
      background: repeating-linear-gradient(90deg, var(--border) 0, var(--border) 2px, var(--bg) 2px, var(--bg) 6px);
    }

    /* ── Section ────────────────────────────────────────── */
    .section { padding: 20px 20px; }
    .section-label {
      font-size: .7rem; letter-spacing: .2em; color: var(--text-3);
      margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    }
    .section-label::before { content: '·'; color: var(--accent); font-size: 1.2rem; line-height: 1; }
    .section-label::after  { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── Expense Form ──────────────────────────────────── */
    .exp-form { display: flex; flex-direction: column; gap: 11px; }
    .row      { display: flex; gap: 10px; }
    .field    { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .field label { font-size: .68rem; color: var(--text-3); letter-spacing: .06em; }
    .field input, .field select, .field textarea {
      padding: 10px 12px; border: 1px solid var(--border);
      background: var(--surface); border-radius: var(--r-sm);
      width: 100%; font-size: 16px; outline: none; /* 16px 避免 iOS Safari 聚焦時自動放大畫面 */
      -webkit-appearance: none; appearance: none; color: var(--text-1);
      font-family: inherit; resize: vertical;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px rgba(92,107,138,.08);
    }
    .twd       { font-size: .72rem; color: var(--text-3); text-align: right; margin-top: -6px; min-height: 1em; }
    .currency-toggle { display: flex; gap: 6px; margin-bottom: 2px; }
    .ctoggle-btn {
      padding: 6px 14px; border-radius: 16px;
      font-size: .78rem; font-weight: 500;
      border: 1px solid var(--border);
      background: var(--surface); color: var(--text-3);
    }
    .ctoggle-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .submit-btn {
      padding: 13px; background: var(--accent); color: #fff;
      border-radius: var(--r-sm); font-size: .88rem; letter-spacing: .1em;
    }
    .submit-btn:active { opacity: .85; }
    .setup-hint {
      background: var(--surface-sub); border: 1px solid var(--border);
      border-radius: var(--r-sm); padding: 14px;
      font-size: .78rem; color: var(--text-2); line-height: 1.75;
    }
    .setup-hint code { background: var(--border-lt); padding: 1px 5px; border-radius: 3px; font-size: .72rem; }

    /* ── Expense Summary ───────────────────────────────── */
    .total-box  { text-align: center; margin-bottom: 22px; }
    .total-lbl  { font-size: .68rem; letter-spacing: .15em; color: var(--text-3); margin-bottom: 6px; }
    .total-main    { font-size: 2.1rem; font-weight: 300; letter-spacing: .04em; color: var(--text-1); }
    .total-foreign { font-size: .82rem; color: var(--text-3); margin-top: 2px; min-height: 1.1em; }
    .chart      { display: flex; flex-direction: column; gap: 12px; }
    .chart-row  { display: flex; align-items: center; gap: 10px; }
    .chart-lbl  { flex: 0 0 68px; font-size: .7rem; color: var(--text-2); text-align: right; }
    .chart-bar-bg { flex: 1; background: var(--border-lt); border-radius: 4px; height: 7px; overflow: hidden; }
    .chart-bar  { height: 100%; background: var(--accent); border-radius: 4px; transition: width .5s ease; }
    .chart-amt  { flex: 0 0 66px; font-size: .7rem; color: var(--text-2); text-align: right; }
    .synced-at  { font-size: .66rem; color: var(--text-3); text-align: center; margin-top: 14px; }
    .panel-empty { text-align: center; padding: 40px 0; font-size: .82rem; color: var(--text-3); letter-spacing: .05em; }

    /* ── Expense Detail ────────────────────────────────── */
    .detail-section { margin-top: 22px; }
    .detail-header {
      font-size: .7rem; letter-spacing: .2em; color: var(--text-3);
      margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    .detail-header::before { content: '·'; color: var(--accent); font-size: 1.2rem; line-height: 1; }
    .detail-header::after  { content: ''; flex: 1; height: 1px; background: var(--border); }
    .detail-tabs {
      display: flex; gap: 6px; overflow-x: auto;
      scrollbar-width: none; margin-bottom: 12px; padding-bottom: 2px;
    }
    .detail-tabs::-webkit-scrollbar { display: none; }
    .detail-tab {
      flex: 0 0 auto; padding: 6px 13px; border-radius: 16px;
      font-size: .7rem; font-weight: 500;
      border: 1px solid var(--border);
      background: var(--surface); color: var(--text-3);
      white-space: nowrap; line-height: 1.3; text-align: center;
    }
    .detail-tab span { display: block; font-size: .6rem; color: var(--text-3); margin-top: 1px; font-weight: 400; }
    .detail-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .detail-tab.active span { color: rgba(255,255,255,.7); }
    .record-list    { display: flex; flex-direction: column; gap: 8px; }
    .record-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 13px; background: var(--surface);
      border: 1px solid var(--border-lt); border-left: 3px solid var(--accent-bd);

/* ─── 記帳幣別：輸入永遠是 TWD，用即時匯率估算當地幣別 ──── */
// 顯示名稱/符號（純文字，不需要即時更新）
var CURRENCY_LABELS = {
  TWD: '新台幣 NT$', JPY: '日圓 ¥',   EUR: '歐元 €',   USD: '美金 $',
  GBP: '英鎊 £',     KRW: '韓元 ₩',   THB: '泰銖 ฿',   CNY: '人民幣 ¥',
  AUD: '澳幣 A$',    CZK: '克朗 Kč',  HUF: '福林 Ft'
};
// 備援匯率（1 TWD ≈ 多少外幣），只有完全抓不到即時匯率時才會用到
var FALLBACK_CURRENCY_RATES = {
  TWD: 1, JPY: 4.65, EUR: 0.029, USD: 0.031, GBP: 0.024,
  KRW: 43, THB: 0.95, CNY: 0.21, AUD: 0.044, CZK: 0.67, HUF: 10
};
var CURRENCY_RATES_CACHE_KEY = 'currency_rates_cache'; // 全域快取，不分行程
var CURRENCY_RATES_TTL       = 12 * 3600 * 1000;        // 12 小時內沿用快取
var liveCurrencyRates        = null; // { jpy: 4.65, eur: 0.029, ... }（key 為小寫）

// 進到行程時背景抓一次即時匯率（比照 fetchWeather 的背景更新模式），
// 快取未過期就直接沿用，不用每次開 App 都打 API
function fetchCurrencyRates() {
  try {
    var cached = JSON.parse(localStorage.getItem(CURRENCY_RATES_CACHE_KEY) || 'null');
    if (cached && cached.rates && (Date.now() - cached.t) < CURRENCY_RATES_TTL) {
      liveCurrencyRates = cached.rates;
      return;
    }
  } catch(e) {}

  fetchWithTimeout('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/twd.json', 6000)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.twd) {
        liveCurrencyRates = data.twd;
        try { localStorage.setItem(CURRENCY_RATES_CACHE_KEY, JSON.stringify({ rates: data.twd, t: Date.now() })); } catch(e) {}
      }
    })
    .catch(function() { /* 抓不到就沿用備援匯率表，不影響記帳功能本身 */ });
}

// TWD 金額 → 估算外幣金額（currency 用大寫如 'EUR'，內部匯率表 key 是小寫）
function twdToForeign(twd, currency) {
  if (!currency || !(twd >= 0)) return null;
  var key = String(currency).toLowerCase();
  var rate = (liveCurrencyRates && liveCurrencyRates[key] !== undefined)
    ? liveCurrencyRates[key]
    : FALLBACK_CURRENCY_RATES[String(currency).toUpperCase()];
  return (rate !== undefined && rate !== null) ? twd * rate : null;
}

// 外幣金額 → 估算 TWD 金額（跟 twdToForeign 方向相反，換算時記帳表單用）
function foreignToTwd(amount, currency) {
  if (!currency || !(amount >= 0)) return null;
  var key = String(currency).toLowerCase();
  var rate = (liveCurrencyRates && liveCurrencyRates[key] !== undefined)
    ? liveCurrencyRates[key]
    : FALLBACK_CURRENCY_RATES[String(currency).toUpperCase()];
  return (rate) ? amount / rate : null;
}

/* ─── 寫入後端：依序送出、有結果可看、失敗會重試與提示 ─────────
   所有寫入共用一條佇列（先送的先完成，避免兩個請求同時改同一份資料互相蓋掉）。
   idempotent=true 的動作（更新／刪除）失敗會自動重試；新增類動作不重試，避免網路只是回應慢卻已經寫入、重試造成重複。 */
// 景點 id 由前端產生、後端直接採用（格式與後端舊的自動產生格式相同）
function newSpotId() {
  return 'sid_' + Date.now() + '_' + Math.floor(Math.random() * 9999);
}

var _writeChain = Promise.resolve();
var _pendingWrites = 0;
var _writeSeq = 0;           // 每送出一筆寫入就加 1，用來判斷「抓資料期間有沒有新的寫入」
var _lastLocalWriteAt = 0;   // 最近一次本機送出寫入的時間
var _needReconcile = false;  // 有行程寫入失敗：佇列清空後要用雲端資料還原畫面

function _sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

var WRITE_TIMEOUT_MS = 20000; // 訊號不穩時 fetch 可能一直不回，逾時才不會卡住後面所有寫入與重新整理

async function _sendOnce(url, body) {
  var ctrl  = new AbortController();
  var timer = setTimeout(function() { ctrl.abort(); }, WRITE_TIMEOUT_MS);
  try {
    var r = await fetch(url, {
      method: 'POST', keepalive: true, signal: ctrl.signal,
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(body)
    });
    return await r.json();
  } finally {
    clearTimeout(timer);
  }
}

// 回傳 true／false，不會 throw；label 用在失敗提示（例如「景點順序」）
function queueWrite(url, body, label, idempotent) {
  _pendingWrites++;
  _writeSeq++;
  _lastLocalWriteAt = Date.now();
  var run = _writeChain.then(async function() {
    var delays = idempotent ? [0, 1000, 3000] : [0];
    var lastErr = '';
    for (var i = 0; i < delays.length; i++) {
      if (delays[i]) await _sleep(delays[i]);
      try {
        var json = await _sendOnce(url, body);
        if (json && json.success) return true;
        var msg = (json && json.error) || '後端回報失敗';
        // 重試時若回「找不到」，代表上一次其實已經成功（例如刪除），視為完成
        if (i > 0 && /找不到/.test(msg)) return true;
        lastErr = msg;
      } catch (e) { lastErr = String(e); }
    }
    console.error('[queueWrite]', label, lastErr);
    return false;
  });
  _writeChain = run.catch(function() {});
  return run.then(function(ok) {
    _pendingWrites--;
    if (!ok) {
      if (url.indexOf(API_URL) === 0) {
        // 行程類寫入失敗：畫面已先改了，等佇列清空後改回雲端上的內容，避免畫面和試算表不一致
        _needReconcile = true;
        showToast('⚠ ' + label + '沒有存成功，畫面將還原成雲端上的內容');
      } else {
        showToast('⚠ ' + label + '沒有存成功，重新整理後可能會看到舊資料');
      }
    }
    if (_needReconcile && _pendingWrites === 0) { _needReconcile = false; reconcileFromServer(); }
    return ok;
  });
}

function isAuthed() {
  try {
    var s = localStorage.getItem(AUTH_KEY);
    return s ? Date.now() < JSON.parse(s).expiry : false;
  } catch(e) { return false; }
}

function saveAuth() {
  localStorage.setItem(AUTH_KEY, JSON.stringify({ expiry: Date.now() + AUTH_DAYS * 86400000 }));
}

function initAuth() {
  if (isAuthed()) { showTripList(); return; }

  var overlay = document.getElementById('auth-overlay');
  var input   = document.getElementById('auth-input');
  var errEl   = document.getElementById('auth-error');
  overlay.style.display = 'flex';
  setTimeout(function(){ input.focus(); }, 120);

  function tryLogin() {
    if (input.value === PASS_CODE) {
      saveAuth();
      overlay.style.display = 'none';
      showTripList();
    } else {
      errEl.textContent = '密碼錯誤，請再試一次';
      input.value = '';
      input.focus();
      setTimeout(function(){ errEl.textContent = ''; }, 2000);
    }
  }

  input.addEventListener('input',   function(){ if (input.value.length === 4) tryLogin(); });
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') tryLogin(); });
}

function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];

}

// 從行程清單算出去重、由新到舊排序的年份陣列；一定包含「今年」，即使今年還沒有行程
function getTripYears(trips) {
  var years = {};
  years[String(new Date().getFullYear())] = true;
  (trips || []).forEach(function(t) {
    var y = String(t.start_date || '').slice(0, 4);
    if (/^\d{4}$/.test(y)) years[y] = true;
  });
  return Object.keys(years).sort(function(a, b) { return b - a; });
}

function renderYearFilter(trips) {
  var wrap = document.getElementById('trip-year-filter');
  if (!wrap) return;
  var years = getTripYears(trips);
  var pills = ['<button class="year-pill' + (_tripYearFilter === 'all' ? ' active' : '') + '" onclick="selectTripYear(\'all\')">全部</button>'];
  years.forEach(function(y) {
    pills.push('<button class="year-pill' + (_tripYearFilter === y ? ' active' : '') + '" onclick="selectTripYear(\'' + y + '\')">' + y + '</button>');
  });
  wrap.innerHTML = pills.join('');
}

function selectTripYear(year) {
  _tripYearFilter = year;
  renderTripList(tripRegistryCache); // renderTripList() 內部會一併重繪年份篩選列
}

function loadTripList() {
  var wrap = document.getElementById('trip-list-wrap');
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem('trip_registry_cache') || 'null'); } catch(e) {}

  if (cached && cached.trips && cached.trips.length) {
    tripRegistryCache = cached.trips;
    renderTripList(tripRegistryCache);
  } else {
    wrap.innerHTML = '<div class="panel-empty">載入行程中…</div>';
  }

  if (!API_URL) {
    if (!tripRegistryCache.length) { tripRegistryCache = PLACEHOLDER_TRIPS; renderTripList(tripRegistryCache); }
    return;
  }

  fetchWithTimeout(API_URL + '?resource=trips', 8000)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var trips = data.trips || [];
      if (trips.length) {
        tripRegistryCache = trips;
        try { localStorage.setItem('trip_registry_cache', JSON.stringify({ trips: trips })); } catch(e) {}
        renderTripList(trips);
      } else if (!tripRegistryCache.length) {
        tripRegistryCache = PLACEHOLDER_TRIPS;
        renderTripList(tripRegistryCache);
      }
    })
    .catch(function() {
      if (!tripRegistryCache.length) {
        tripRegistryCache = PLACEHOLDER_TRIPS;
        renderTripList(tripRegistryCache);
      }
    });
}

function formatTripDates(start, end) {
  function short(d) { return d ? d.replace(/^\d{4}-/, '').replace(/-/g, '.') : ''; }
  if (!start && !end) return '';
  if (start && end) return start.slice(0, 4) + '.' + short(start) + ' — ' + short(end);
  return start || end;
}

function renderTripList(trips) {
  var wrap = document.getElementById('trip-list-wrap');
  renderYearFilter(trips);

  if (!trips || !trips.length) {
    wrap.innerHTML = '<div class="panel-empty">尚無行程，點右下角新增第一個行程吧</div>';
    return;
  }

  var filtered = _tripYearFilter === 'all'
    ? trips
    : trips.filter(function(t) { return String(t.start_date || '').slice(0, 4) === _tripYearFilter; });

  if (!filtered.length) {
    wrap.innerHTML = '<div class="panel-empty">此年度尚無行程</div>';
    return;
  }

  var sorted = filtered.slice().sort(function(a, b) {
    return String(b.start_date || '').localeCompare(String(a.start_date || ''));
  });
  wrap.innerHTML = sorted.map(function(t) {
    // 卡片一律只顯示行程名稱 + 日期兩行，不額外顯示目的地，維持所有行程外觀一致
    return '<div class="trip-card">'
      + '<button class="trip-card-main" onclick="enterTrip(\'' + escHtml(t.trip_id) + '\')">'
        + '<div class="trip-card-title">' + escHtml(t.title || t.trip_id) + '</div>'
        + '<div class="trip-card-dates">' + escHtml(formatTripDates(t.start_date, t.end_date)) + '</div>'
      + '</button>'
      + '<button class="trip-card-edit" onclick="event.stopPropagation(); openEditTripModal(\'' + escHtml(t.trip_id) + '\')" title="編輯行程">✎</button>'
    + '</div>';
  }).join('');
}

function enterTrip(tripId) {
  var trip = tripRegistryCache.filter(function(t) { return t.trip_id === tripId; })[0];
  if (!trip) return;
  document.getElementById('trip-list-view').style.display = 'none';

function slugify(s) {
  var base = String(s || '').trim().toLowerCase()
    .replace(/[^\w一-鿿]+/g, '-')
    .replace(/^-+|-+$/g, '');
  return base || 'trip';
}

// 展開連續日期區間為 YYYY-MM-DD 字串陣列（含頭尾）
function datesInRange(startStr, endStr) {
  var start = parseLocalDate(startStr);
  var end   = parseLocalDate(endStr);
  var out   = [];
  if (isNaN(start.getTime()) || isNaN(end.getTime()) || start > end) return out;
  var cursor = new Date(start.getTime());
  while (cursor <= end) {
    out.push(dateToYMD(cursor));
    cursor.setDate(cursor.getDate() + 1);
  }
  return out;
}

// 出發地/目的地欄位的機場搜尋：重用既有 searchPlace() 的 Places API 呼叫方式（language: 'zh-TW'），
// 但只需要 displayName、且限定 includedType: 'airport'，讓使用者輸入代號（TPE）或中文地名（桃園）都能查到。
// 單打城市名（例如「布拉格」）時，Google 排出來的第一批結果常常是景點/飯店，加上 includedType 篩選後反而變成查無結果，
// 所以幫「非代號」的查詢字串補上「機場」關鍵字偏向機場；三字代號（例如 VIE）本身已經是明確的機場識別碼，
// 混進中文「機場」反而可能讓文字搜尋比對不到，所以代號不加這個字尾。多層都查不到才放棄。
async function searchAirport(inputEl, btnEl) {
  var query = inputEl.value.trim();
  if (!query) return;

  var originalText = btnEl.textContent;
  btnEl.disabled = true;
  btnEl.textContent = '…';

  try {
    var { Place } = await google.maps.importLibrary('places');
    var isCode = /^[A-Za-z]{3}$/.test(query);
    var hasAirportWord = /機場|airport/i.test(query);
    var airportQuery = (isCode || hasAirportWord) ? query : query + ' 機場';

    var places = null;

    // 第一層：加上機場關鍵字（或代號原樣）+ 限定 type
    try {
      var typed = await Place.searchByText({
        textQuery: airportQuery,
        fields: ['displayName'],
        language: 'zh-TW',
        includedType: 'airport'
      });
      places = typed.places;
    } catch (e1) { /* includedType 不支援時往下retry */ }

    // 第二層：同樣的查詢字串，不限制 type
    if (!places || !places[0]) {
      try {
        var broad = await Place.searchByText({
          textQuery: airportQuery,
          fields: ['displayName'],
          language: 'zh-TW'
        });
        places = broad.places;
      } catch (e2) {}
    }

    // 第三層：如果有加過「機場」字尾，改用使用者原始輸入（不加字尾）再試一次，
    // 避免補字反而讓查詢變得不精準
    if ((!places || !places[0]) && airportQuery !== query) {
      var raw = await Place.searchByText({
        textQuery: query,
        fields: ['displayName'],
        language: 'zh-TW'
      });
      places = raw.places;
    }

    if (!places || !places[0]) {
      showToast('找不到機場，請換個關鍵字');
      return;
    }

    inputEl.value = places[0].displayName || query;
  } catch (err) {
    console.error('[searchAirport]', err);
    showToast('搜尋失敗，請稍後再試');
  } finally {
    btnEl.disabled = false;
    btnEl.textContent = originalText;
  }
}

// 找出 flightsData 裡符合「編輯中那筆」的判斷式：有 flight_id 就比對 id，
// 沒有（改版前舊資料）就比對開 modal 當下記下的舊天數＋舊標題
function _flightMatchesEditing(f) {
  return _editingFlightId ? f.flight_id === _editingFlightId
    : (f.day === _editingFlightOldDay && f.spot_name === _editingFlightOldName);
}

// YYYY-MM-DD → M/D，供班機說明文字使用
function formatFlightDate(dateStr) {
  var dt = parseLocalDate(dateStr);
  return isNaN(dt) ? '' : (dt.getMonth() + 1) + '/' + dt.getDate();
}

// 班機卡片中間的日期欄：出發/抵達同一天只顯示一個日期，跨夜班機（隔天抵達）緊湊顯示兩個日期
function formatFlightDateRange(depDate, arrDate) {
  var dep = formatFlightDate(depDate);
  var arr = formatFlightDate(arrDate);
  if (!dep) return arr;
  if (!arr || arr === dep) return dep;
  return dep + '→' + arr;
}

// 重繪受影響的那幾天（編輯時天數可能改變，舊/新天數都要重繪）
function rerenderFlightDays() {
  var days = {};
  for (var i = 0; i < arguments.length; i++) {
    if (arguments[i] !== null && arguments[i] !== undefined) days[arguments[i]] = true;
  }
  Object.keys(days).forEach(function(d) {
    var dayData = itineraryState.filter(function(x) { return x.day === Number(d); })[0];
    if (dayData) updateDayPanel(dayData);
  });
}

// 依起訖日期合成空白的每日行程骨架，讓新行程一開始就有正確天數的分頁
function buildEmptyItinerary(trip) {
  var dates = datesInRange(trip.start_date, trip.end_date);
  if (!dates.length) {
    return [{ day: 1, date: trip.start_date || '', day_title: '', day_start: '09:00', spots: [] }];
  }
  return dates.map(function(d, i) {
    return {
      day:       i + 1,
      date:      d,
      day_title: '',
      day_start: '09:00',
      spots:     []
    };
  });
}

// 清掉某行程跟「天數」相關的 localStorage 快取（編輯日期後天數編號會變，避免舊快取對錯天）
function clearTripDayCaches(tripId, maxOldDayCount) {
  try {
    localStorage.removeItem(tripId + '__gas_cache');
    localStorage.removeItem(tripId + '__transit_mins_cache');
    for (var i = 1; i <= maxOldDayCount; i++) {
      localStorage.removeItem(tripId + '__day_order_' + i);
      localStorage.removeItem(tripId + '__day_start_' + i);
      localStorage.removeItem(tripId + '__day_mutated_' + i);
    }
  } catch(e) {}
}

function confirmTripModal() {
  if (_editingTripId) { confirmEditTrip(); return; }

  var destInput  = document.getElementById('trip-dest-input');
  var startInput = document.getElementById('trip-start-input');
  var endInput   = document.getElementById('trip-end-input');
  var errEl      = document.getElementById('trip-add-error');

  var dest  = destInput.value.trim();
  var start = startInput.value;
  var end   = endInput.value;

  if (!dest) { errEl.textContent = '請輸入目的地／國家'; return; }
  if (!start || !end) { errEl.textContent = '請選擇出發與結束日期'; return; }
  if (start > end) { errEl.textContent = '結束日期必須晚於出發日期'; return; }

  var tripId = slugify(dest) + '-' + start.slice(0, 7);

    trip_id: tripId,

    country_or_destination: dest,

  };

  if (API_URL) {
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },

    }).catch(function() {});

  closeAddTripModal();

// 編輯行程：算出日期差集，若會刪資料先跳確認框，確認後才真的送出
function confirmEditTrip() {
  var tripId  = _editingTripId;
  var oldTrip = tripRegistryCache.filter(function(t) { return t.trip_id === tripId; })[0];
  if (!oldTrip) { closeAddTripModal(); return; }

  var destInput  = document.getElementById('trip-dest-input');
  var startInput = document.getElementById('trip-start-input');
  var endInput   = document.getElementById('trip-end-input');
  var errEl      = document.getElementById('trip-add-error');

  var dest  = destInput.value.trim();
  var start = startInput.value;
  var end   = endInput.value;

  if (!dest) { errEl.textContent = '請輸入目的地／國家'; return; }
  if (!start || !end) { errEl.textContent = '請選擇出發與結束日期'; return; }
  if (start > end) { errEl.textContent = '結束日期必須晚於出發日期'; return; }

  var currency = document.getElementById('trip-currency-input').value || 'JPY';

  var oldDates   = datesInRange(oldTrip.start_date, oldTrip.end_date);
  var newDateSet = {};
  datesInRange(start, end).forEach(function(d) { newDateSet[d] = true; });
  var removedDates = oldDates.filter(function(d) { return !newDateSet[d]; });

  function proceed() {
    saveTripEdit(tripId, dest, start, end, currency, removedDates, oldDates.length);
  }

  if (removedDates.length > 0) {
    var label = removedDates.map(function(d) {
      var dt = parseLocalDate(d);
      return (dt.getMonth() + 1) + '/' + dt.getDate() + '（' + WKDAYS[dt.getDay()] + '）';
    }).join('、');
    closeAddTripModal(); // 先關掉編輯 modal，避免兩個 modal 疊在一起、確認框被蓋住
    document.querySelector('#confirm-modal .modal-title').textContent = '確認調整日期';
    document.getElementById('modal-msg').textContent =
      '這個調整會刪除以下日期的行程與記帳資料：' + label + '。確定要繼續嗎？';
    document.getElementById('modal-confirm-btn').textContent = '確定';
    document.getElementById('modal-confirm-btn').onclick = function() {
      closeModal();
      proceed();
    };
    document.getElementById('confirm-modal').classList.remove('hidden');
  } else {
    proceed();
  }
}

// 真正送出編輯：更新後端 trips 資料 + 依差集刪除景點/記帳，再重新整理畫面
async function saveTripEdit(tripId, dest, start, end, currency, removedDates, oldDayCount) {
  closeAddTripModal();
  showToast('儲存中…');

  clearTripDayCaches(tripId, oldDayCount);

  var updatedTrip = {
    trip_id: tripId,
    title: dest,
    country_or_destination: dest,
    start_date: start,
    end_date: end,
    currency: currency
  };

  try {
    if (API_URL) {
      await fetch(API_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(Object.assign({ action: 'update_trip' }, updatedTrip))
      });
    }
    if (removedDates.length > 0 && GAS_URL) {
      await fetch(GAS_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'delete_by_dates', trip_id: tripId, dates: removedDates })
      });
    }
  } catch(e) { /* 忽略網路錯誤，仍以樂觀更新後的本地狀態為主 */ }

  tripRegistryCache = tripRegistryCache.map(function(t) {
    return t.trip_id === tripId ? updatedTrip : t;
  });
  try { localStorage.setItem('trip_registry_cache', JSON.stringify({ trips: tripRegistryCache })); } catch(e) {}

  showToast(removedDates.length > 0 ? ('✓ 已更新，刪除 ' + removedDates.length + ' 天資料') : '✓ 行程已更新');

  if (currentTrip && currentTrip.trip_id === tripId) {
    boot(updatedTrip); // 正在瀏覽這個行程：重新載入以反映新的天數/日期
  } else if (document.getElementById('trip-list-view').style.display !== 'none') {
    renderTripList(tripRegistryCache);
  }
}

/* ─── Boot Helpers ───────────────────────────────── */

// fetch 加逾時保護（GAS 慢時不讓畫面永遠等待）
function fetchWithTimeout(url, ms) {
  var ctrl  = new AbortController();
  var timer = setTimeout(function() { ctrl.abort(); }, ms);
  return fetch(url, { signal: ctrl.signal })
    .finally(function() { clearTimeout(timer); });
}

// Step 3 + Step 4 + 渲染 — 可重複呼叫（第一次 & GAS 更新都用）
function prepareAndRender(itinerary, isUpdate) {
  var prepared = itinerary;
  tripDays = prepared;
  itineraryState = prepared.map(function(d) {
    if (isUpdate && isDayMutated(d.day)) {
      var prevDay = (itineraryState || []).filter(function(ps) { return ps.day === d.day; })[0];
      if (prevDay) return prevDay;
    }
    var prevSpotsMap = {};
    (itineraryState || []).forEach(function(ps) {
      if (ps.day === d.day) ps.spots.forEach(function(s) {
        if (s.spot_id && s.travel_mins > 0) prevSpotsMap[s.spot_id] = s.travel_mins;
      });
    });
    // 景點順序、出發時間、交通時間一律以後端（Google Sheet）為準，不再用各裝置 localStorage 的版本覆蓋
    var spots = (d.spots || []).slice().map(function(s) {
      var withId = s.spot_id ? s : Object.assign({}, s, { spot_id: stableSpotKey(s, d.day) });
      // 後端交通時間是 0 時，保留這個畫面本次已算出的非零值（只在記憶體，不跨裝置）
      if (!(withId.travel_mins > 0) && withId.spot_id && prevSpotsMap[withId.spot_id] > 0) {
        return Object.assign({}, withId, { travel_mins: prevSpotsMap[withId.spot_id] });
      }
      return withId;
    });
    return Object.assign({}, d, {
      spots:     spots,
      day_start: d._gas_day_start || d.day_start
    });
  });
  // 更新前記錄目前 active 的 day（更新後恢復，避免景點消失）
  var activeDayNum = null;
  if (isUpdate) {
    var activePanel = document.querySelector('.day-panel.active');
    if (activePanel) activeDayNum = Number(activePanel.dataset.day);
  }

  var weatherSnap = {};
  if (isUpdate) {
    document.querySelectorAll('.day-weather-summary').forEach(function(el) {
      if (el.style.display !== 'none' && el.innerHTML) {
        weatherSnap[el.id] = { html: el.innerHTML, disp: el.style.display };
      }
    });
  }

  renderItinerary(itineraryState);

  if (isUpdate) {
    Object.keys(weatherSnap).forEach(function(id) {
      var el = document.getElementById(id);
      if (el) { el.innerHTML = weatherSnap[id].html; el.style.display = weatherSnap[id].disp; }
    });
  }

  if (!isUpdate) {
    buildCountdown(prepared);
    renderTabs(prepared);
    buildExpForm();
    activateSmartTab(prepared);
  } else {
    var dayToActivate = activeDayNum || (prepared[0] && prepared[0].day);
    if (dayToActivate) {
      var panel = document.querySelector('.day-panel[data-day="' + dayToActivate + '"]');
      if (panel) panel.classList.add('active');
    }
  }
}

// 雲端回應有效：沒有 error，且有景點或有班機（只有班機、還沒有景點的行程也算有效）
function hasCloudData(d) {
  return !!d && !d.error && !!((d.itinerary && d.itinerary.length) || (d.flights && d.flights.length));
}

// GAS 資料合併到每天的空白骨架（日期來自行程起訖日，景點／標題／出發時間來自雲端）
function mergeGAS(baseItinerary, gasData) {
  var gasMap = {};
  (gasData.itinerary || []).forEach(function(d) { gasMap[d.day] = d; });
  return baseItinerary.map(function(day) {
    var gas = gasMap[day.day];
    // 雲端已有這個行程的資料、卻沒有這一天 = 這天的景點都被刪光了，這天就是空的
    if (!gas) return Object.assign({}, day, { spots: [], _gas_day_start: '' });
    var fixedSpots = (gas.spots || []).map(function(s) {
      return Object.assign({}, s, s.latitude && s.longitude ? {
        transport: Object.assign({}, s.transport, {
          google_maps_url: buildNavUrl(s.latitude, s.longitude, s.spot_name)
        })
      } : {});
    });
    var hasSortOrder = fixedSpots.some(function(s) { return s.sort_order !== undefined; });
    if (hasSortOrder) fixedSpots.sort(function(a, b) { return (a.sort_order||0)-(b.sort_order||0); });
    var gasDayStart = normalizeHHMM(gas.day_start);
    return Object.assign({}, day, {
      spots:          fixedSpots,
      day_title:      gas.day_title || day.day_title,
      date:           dateToYMD(gas.date) || day.date,
      day_start:      gasDayStart || day.day_start,
      _gas_day_start: gasDayStart
    });
  });
}

// Maps API load 後背景修正籠統地區名（once）
function setupGeocodeListener() {
  window.addEventListener('load', function() {
    if (!window.google || !window.google.maps) return;
    (async function() {
      var changed = {};
      for (var i = 0; i < itineraryState.length; i++) {
        var day = itineraryState[i];
        for (var j = 0; j < day.spots.length; j++) {
          var s = day.spots[j];
          if (s.region_name === '東京市區' && s.latitude && s.longitude) {
            var comps = await reverseGeocodeAddr(s.latitude, s.longitude);
            var region = inferRegionFromAddr(comps);
            if (region) {
              day.spots[j] = Object.assign({}, s, { region_name: region });
              changed[day.day] = day;
            }
          }
        }
      }
      Object.keys(changed).forEach(function(d) { updateDayPanel(changed[+d]); });
    })();
  }, { once: true });
}

/* ─── Boot（Task 4：雙向 API 串接，多行程版）───────── */
async function boot(trip) {
  currentTrip = trip;
  flightsData = []; // 重設，避免切換行程時殘留上一個行程的班機資料
  _lastSyncedAt = null; // 切換行程時重設；第一次抓到雲端資料才會顯示同步時間
  renderSyncStatus();
  setTripHeader(trip);
  document.getElementById('app').style.display = 'block';
  fetchCurrencyRates(); // 背景抓即時匯率，供記帳「估算外幣」使用

  // ── Step 1：用行程起訖日期合成每天的空白骨架。景點一律來自雲端（或上次成功抓到的手機快取），
  //           不再有任何寫死的靜態內容——連不上又沒有快取時寧可空白，也不顯示過期的錯誤資訊
  var baseItinerary = buildEmptyItinerary(trip);
  _baseItinerary = baseItinerary;

  // ── Step 2：GAS 快取 + 新資料
  var gasCache = null;
  try {
    var cached = localStorage.getItem(tripKey('gas_cache'));
    if (cached) gasCache = JSON.parse(cached);
  } catch(e) { localStorage.removeItem(tripKey('gas_cache')); }

  if (hasCloudData(gasCache)) {
    // ── 快取路徑：立即用上次 GAS 資料渲染（第二次以後開啟超快）
    var itinerary = mergeGAS(baseItinerary, gasCache);
    if (gasCache.flights) flightsData = gasCache.flights;
    prepareAndRender(itinerary, false);
    fetchWeather(itinerary);
    fetchTodayHeaderWeather();
    setupGeocodeListener();

    // 背景抓新 GAS，到了更新快取並靜默重渲染
    if (API_URL) {
      fetchWithTimeout(apiUrlFor(trip.trip_id), 6000)
        .then(function(r) { return r.json(); })
        .then(function(fresh) {
          // 抓的期間使用者已切換到別的行程：這份資料不屬於目前畫面，丟掉
          if (!currentTrip || currentTrip.trip_id !== trip.trip_id) return;
          if (hasCloudData(fresh)) {
            localStorage.setItem(tripKey('gas_cache'), JSON.stringify(fresh));
            if (Array.isArray(fresh.flights)) flightsData = fresh.flights;
            var updated = mergeGAS(baseItinerary, fresh);
            prepareAndRender(updated, true);
            fetchWeather(updated);
            markSynced();
          }
        })
        .catch(function() {});
    }

  } else {
    // ── 無快取路徑：等待 GAS（第一次開啟，只慢一次）
    var itinerary = baseItinerary;
    if (API_URL) {
      try {
        showToast('載入行程中…');
        var r2    = await fetchWithTimeout(apiUrlFor(trip.trip_id), 15000);
        var json2 = await r2.json();
        if (hasCloudData(json2)) {
          localStorage.setItem(tripKey('gas_cache'), JSON.stringify(json2));
          if (Array.isArray(json2.flights)) flightsData = json2.flights;
          itinerary = mergeGAS(baseItinerary, json2);
          markSynced();
        }
      } catch(e) {
        // 連不上雲端、手機也沒有快取：維持空白，並明確告知，不顯示任何舊資料
        showToast('無法連線，目前沒有行程資料，連上網路後按 ↺');
      }
    }
    prepareAndRender(itinerary, false);
    fetchWeather(itinerary);
    fetchTodayHeaderWeather();
    setupGeocodeListener();
  }

  // ── 背景：記帳統計（先重設，避免切換行程時殘留上一個行程的統計畫面）
  var summaryWrap = document.getElementById('summary-wrap');
  if (summaryWrap) summaryWrap.innerHTML = '<div class="panel-empty">尚未同步資料</div>';
  if (GAS_URL && GAS_URL.indexOf('YOUR_') === -1) {
    fetch(gasUrlFor(trip.trip_id))
      .then(function(r){ return r.json(); })
      .then(function(data){ buildSummary(data); })
      .catch(function(){});
  }
}

/* ─── 手動刷新 ────────────────────────────────────────── */
async function manualRefresh() {
  checkForAppUpdate(); // ↺ 只重抓資料；順便檢查程式有沒有新版，有的話會自動換版
  var btns = document.querySelectorAll('.btn-refresh');
  btns.forEach(function(b) { b.disabled = true; b.style.opacity = '0.4'; });
  showToast('重新整理中…');
  try {
    if (!API_URL || !_baseItinerary || !currentTrip) { location.reload(); return; }
    // 先等本機送出的寫入完成（最多等 8 秒），才不會抓到還沒寫進去的舊資料；
    // 等太久就不再等，避免某筆寫入卡住時按鈕一直轉
    var settled = await Promise.race([
      _writeChain.then(function() { return true; }),
      _sleep(8000).then(function() { return false; })
    ]);
    var tripId = currentTrip.trip_id;
    var r      = await fetchWithTimeout(apiUrlFor(tripId), 10000);
    var fresh  = await r.json();
    if (!currentTrip || currentTrip.trip_id !== tripId) return;
    if (hasCloudData(fresh)) {
      var cached = null;
      try { cached = localStorage.getItem(tripKey('gas_cache')); } catch(e2) {}
      var unchanged = JSON.stringify(fresh) === cached;
      // 還有本機寫入沒送完時不強制覆蓋剛改過的那幾天，免得畫面倒退
      applyFreshItinerary(fresh, settled);
      if (!settled) showToast('已更新，但還有 ' + _pendingWrites + ' 筆修改在送出，稍後請再按一次');
      else showToast(unchanged ? '✓ 已是最新' : '✓ 行程已更新');
    } else {
      showToast('行程資料異常，保留現有資料');
    }
    syncExpenseSummary();
  } catch(e) {
    showToast('無法連線，使用本機資料');
  } finally {
    btns.forEach(function(b) { b.disabled = false; b.style.opacity = ''; });
  }
}

/* ─── 與雲端同步（回到前景／寫入失敗後還原）───────────── */

// 套用伺服器資料並重畫；force=true 時不保護「剛在本機改過的天數」（寫入失敗後要以雲端為準）
function applyFreshItinerary(fresh, force) {
  try { localStorage.setItem(tripKey('gas_cache'), JSON.stringify(fresh)); } catch(e) {}
  if (Array.isArray(fresh.flights)) flightsData = fresh.flights;
  if (force) _dayMutatedAt = {};
  var updated = mergeGAS(_baseItinerary, fresh);
  prepareAndRender(updated, true);
  fetchWeather(updated);
  markSynced();
}

// 畫面底部顯示「版本 · 上次同步時間」，讓使用者看得出這台是不是舊版、有沒有同步到
var _lastSyncedAt = null; // APP_VERSION 來自 version.js
function renderSyncStatus() {
  var el = document.getElementById('sync-status');
  if (!el) return;
  var t = _lastSyncedAt
    ? ' · 上次同步 ' + String(_lastSyncedAt.getHours()).padStart(2, '0') + ':' + String(_lastSyncedAt.getMinutes()).padStart(2, '0')
    : '';
  el.textContent = '版本 ' + APP_VERSION + t;
}
function markSynced() { _lastSyncedAt = new Date(); renderSyncStatus(); }

// 記帳統計同步：內容有變才重畫（last_synced 每次都不同，不列入比較）；有視窗開著時不動，避免刪除的列號過期
function syncExpenseSummary() {
  if (!GAS_URL || GAS_URL.indexOf('YOUR_') !== -1 || !currentTrip || _pendingWrites > 0) return;
  var tripId = currentTrip.trip_id;
  fetch(gasUrlFor(tripId))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!currentTrip || currentTrip.trip_id !== tripId || _pendingWrites > 0) return;
      if (data.error || typeof data.total_twd !== 'number') return;
      if (document.querySelector('.modal:not(.hidden)')) return;
      var sig = function(d) { return d ? JSON.stringify([d.total_twd, d.categories, d.records]) : ''; };
      if (sig(data) === sig(window._expData)) return;
      buildSummary(data);
    })
    .catch(function() {});
}

// 畫面上有東西正在操作（開著視窗、拖曳中、輸入中）時不要重畫
function isUserBusy() {
  if (document.querySelector('.modal:not(.hidden)')) return true;
  if (document.querySelector('.sortable-chosen')) return true;
  var ae = document.activeElement;
  return !!ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
}

// 寫入失敗後：等佇列清空，抓雲端資料覆蓋畫面
async function reconcileFromServer() {
  if (!API_URL || !_baseItinerary || !currentTrip) return;
  var tripId = currentTrip.trip_id, seq = _writeSeq;
  try {
    var r = await fetchWithTimeout(apiUrlFor(tripId), 10000);
    var fresh = await r.json();
    if (!hasCloudData(fresh)) { _needReconcile = true; return; }
    if (!currentTrip || currentTrip.trip_id !== tripId) return;
    // 抓的期間又有新的寫入：這份資料可能已過時，等下一次佇列清空再還原
    if (seq !== _writeSeq || _pendingWrites > 0) { _needReconcile = true; return; }
    applyFreshItinerary(fresh, true);
    showToast('已還原成雲端上的行程');
  } catch(e) {
    showToast('無法連線，畫面可能與雲端不一致，請稍後按重新整理');
  }
}

// 回到前景（從背景切回 App、解鎖手機）時靜默抓一次最新行程，太太改的內容不用手動重新整理就會出現
var _lastForegroundSync = 0;
var _foregroundSyncing  = false;
async function syncWhenForegrounded() {
  if (document.visibilityState !== 'visible' || _foregroundSyncing) return;
  if (!API_URL || !_baseItinerary || !currentTrip) return;
  var app = document.getElementById('app');
  if (!app || app.style.display === 'none') return;
  if (Date.now() - _lastForegroundSync < 30000) return;
  if (_pendingWrites > 0 || isUserBusy()) return;

  _foregroundSyncing = true;
  _lastForegroundSync = Date.now();
  var tripId = currentTrip.trip_id, seq = _writeSeq;
  try {
    var r = await fetchWithTimeout(apiUrlFor(tripId), 8000);
    var fresh = await r.json();
    if (!hasCloudData(fresh)) return;
    // 抓的期間切換了行程、有新寫入或開始操作：放棄這份資料，不蓋掉畫面
    if (!currentTrip || currentTrip.trip_id !== tripId) return;
    if (seq !== _writeSeq || _pendingWrites > 0 || isUserBusy()) return;
    var text = JSON.stringify(fresh), cached = null;
    try { cached = localStorage.getItem(tripKey('gas_cache')); } catch(e) {}
    if (text === cached) { markSynced(); return; } // 跟上次一樣，不用重畫
    applyFreshItinerary(fresh, false);
    // 剛送出自己的修改後抓到的「變動」多半就是自己那筆，不必提示
    if (Date.now() - _lastLocalWriteAt > 120000) showToast('已同步最新行程');
  } catch(e) { /* 沒訊號就維持目前畫面 */ }
  finally { _foregroundSyncing = false; }
}

// 切回前景／視窗取得焦點／頁面從背景恢復：行程 + 記帳統計都同步一次
function onForeground() {
  checkForAppUpdate();
  syncWhenForegrounded();
  syncExpenseSummary();
}
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'visible') onForeground();
});
window.addEventListener('focus', onForeground);
window.addEventListener('pageshow', onForeground);
// 畫面開著不動時（例如電腦上一直放著的分頁）每分鐘檢查一次行程；分頁在背景時 syncWhenForegrounded 會自己略過
setInterval(function() {
  if (document.visibilityState !== 'visible') return;
  checkForAppUpdate();
  syncWhenForegrounded();
}, 60000);

/* ─── Countdown ───────────────────────────────────────── */
function buildCountdown(days) {
  var el = document.getElementById('countdown');
  var tripStart = parseLocalDate(days[0].date);
  var now = new Date();
  var jst = new Date(now.getTime() + (9 * 60 + now.getTimezoneOffset()) * 60000);
  var todayMid = new Date(jst.getFullYear(), jst.getMonth(), jst.getDate());
  var diff = Math.round((tripStart - todayMid) / 86400000);
  if (diff <= 0) { el.setAttribute('hidden', ''); return; } // 切換行程時重設，避免殘留上一個行程的倒數
  el.innerHTML = '距離出發還有 <strong>' + diff + '</strong> 天';
  el.removeAttribute('hidden');
}

/* ─── Smart Tab：偵測 JST 自動切換 ───────────────────── */
function getJSTDateStr() {
  var now = new Date();
  var jst = new Date(now.getTime() + (9 * 60 + now.getTimezoneOffset()) * 60000);
  return jst.toISOString().slice(0, 10);
}

function activateSmartTab(itinerary) {
  var today  = getJSTDateStr();
  var target = itinerary[0].day;
  for (var i = 0; i < itinerary.length; i++) {
    if (itinerary[i].date === today) { target = itinerary[i].day; break; }
  }
  switchDay(target);
}

/* ─── Tab Switcher ────────────────────────────────────── */
var WKDAYS = ['日','一','二','三','四','五','六'];

function switchDay(dayNum) {
  document.querySelectorAll('.day-tab').forEach(function(el){
    el.classList.toggle('active', Number(el.dataset.day) === dayNum);
  });
  document.querySelectorAll('.day-panel').forEach(function(el){
    el.classList.toggle('active', Number(el.dataset.day) === dayNum);
  });
  var active = document.querySelector('.day-tab.active');
  if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

/* ─── Render Tabs ─────────────────────────────────────── */
function renderTabs(itinerary) {
  document.getElementById('day-tabs').innerHTML = itinerary.map(function(d){
    var dt   = parseLocalDate(d.date);
    var mmdd = isNaN(dt) ? d.date : (dt.getMonth()+1) + '/' + dt.getDate();
    var wday = isNaN(dt) ? '' : '（' + WKDAYS[dt.getDay()] + '）';
    return '<button class="day-tab" data-day="' + d.day
      + '" onclick="switchDay(' + d.day + ')">'
      + '<span class="tab-label">Day ' + d.day + '</span>'
      + '<span class="tab-date">' + mmdd + wday + '</span>'
      + '</button>';
  }).join('');
}

/* ─── Render Timeline ─────────────────────────────────── */
function renderItinerary(itinerary) {
  document.getElementById('app-content').innerHTML = itinerary.map(renderDayPanel).join('');
  initSpotSorting(document.getElementById('app-content'));
}

// 是否列入時間軸（去程／回程班機 spot 不列入，另外用班機卡片顯示）
function isTimelineSpot(s) {
  return !s.spot_name || (s.spot_name.indexOf('去程') === -1 && s.spot_name.indexOf('回程') === -1);
}

function renderDayPanel(dayData) {
  var dt = parseLocalDate(dayData.date);
  var dateLabel = isNaN(dt)
    ? String(dayData.date)
    : dt.getFullYear() + '.'
      + String(dt.getMonth()+1).padStart(2,'0') + '.'
      + String(dt.getDate()).padStart(2,'0')
      + '（' + WKDAYS[dt.getDay()] + '）';
  var rawSpots = dayData.spots || [];
  // 班機 spots 分離，不列入時間軸
  var spots = rawSpots.filter(isTimelineSpot);

  var dayStartMins = parseTimeMins(dayData.day_start || '09:00');

  // T3b 時間級聯：第一個景點用 day_start，後續景點 = 前一個結束時間 + 交通時間
  var cascadeTimes = [];
  var runningMins = dayStartMins;
  for (var ci = 0; ci < spots.length; ci++) {
    var cs = spots[ci];
    var csFlight = cs.duration === 0 || !cs.duration;
    if (cs.time) {
      runningMins = parseTimeMins(cs.time);  // 有固定時間的景點用固定值
      cascadeTimes.push(cs.time);
    } else if (csFlight) {
      cascadeTimes.push('');
    } else {
      cascadeTimes.push(minsToTime(runningMins));
    }
    if (!csFlight) runningMins += (cs.duration || 60);
    // 加上前往下一個景點的交通時間
    if (ci + 1 < spots.length) {
      var nextS = spots[ci + 1];
      var fallbackKm = (cs.latitude && cs.longitude && nextS.latitude && nextS.longitude)
        ? haversineKm(cs.latitude, cs.longitude, nextS.latitude, nextS.longitude) : 0;
      var tMins = nextS.travel_mins > 0
        ? nextS.travel_mins
        : (fallbackKm > 0 ? Math.max(5, Math.round(fallbackKm * 12.5)) : 15);
      runningMins += tMins;
    }
  }

  var spotsHtml = spots.map(function(spot, i){
    var isFlight = spot.duration === 0 || !spot.duration;
    var timeStr  = cascadeTimes[i];

    var isFirst = i === 0;
    var isLast  = i === spots.length - 1;
    var mapsUrl = (spot.transport && spot.transport.google_maps_url)
      ? spot.transport.google_maps_url
      : buildMapsUrl(spot.spot_name);

    var itemClass = 'timeline-item'
      + (isFirst ? ' timeline-item--first' : '')
      + (isLast  ? ' timeline-item--last'  : '');

    var transportHtml = (spot.transport && spot.transport.method)
      ? '<div class="transport">🚃 ' + spot.transport.method
          + (spot.transport.duration ? '<br><span class="transport-dur">⏱ ' + spot.transport.duration + '</span>' : '')
        + '</div>'
      : '';

    return '<div class="' + itemClass + '" data-vidx="' + i + '">'
      + '<div class="timeline-time">'
        + (timeStr ? '<span class="time-badge">' + timeStr + '</span>' : '')
      + '</div>'
      + '<div class="timeline-dot-col">'
        + '<div class="timeline-dot' + (isFlight ? ' timeline-dot--flight' : '') + '"></div>'
      + '</div>'
      + '<div class="timeline-card-col">'
        + '<div class="spot-card' + (isFlight ? ' spot-card--flight' : ' spot-card--editable') + '"'
          + (!isFlight
            ? ' data-day="' + dayData.day + '"'
              + ' data-name="' + escHtml(spot.spot_name || '') + '"'
              + ' data-spot-id="' + escHtml(spot.spot_id || '') + '"'
              + ' onclick="onSpotCardClick(event, this)"'
            : '')
        + '>'
          + (!isFlight
            ? '<button class="btn-del-spot"'
                + ' data-day="' + dayData.day + '"'
                + ' data-name="' + escHtml(spot.spot_name || '') + '"'
                + ' data-spot-id="' + (spot.spot_id || '') + '"'
                + ' onclick="confirmDeleteSpot(this)" title="移除景點">🗑</button>'
              + (spots.length > 1 ? '<span class="spot-drag-handle" title="拖曳排序">⋮⋮</span>' : '')
            : '')
          + (spot.region_name ? '<span class="spot-region-tag">' + spot.region_name + '</span>' : '')
          + '<div class="spot-name">' + escHtml(spot.spot_name) + '</div>'
          + (spot.address ? '<div class="spot-address">📍 ' + spot.address + '</div>' : '')
          + (spot.description ? '<div class="spot-desc">' + spot.description + '</div>' : '')
          + (function() {
              if (!spot.opening_hours || !spot.opening_hours.length) return '';
              // Date.getDay(): 0=Sun,1=Mon...6=Sat → Google weekday_text: 0=Mon...6=Sun
              var jsDay     = new Date(dayData.date + 'T00:00:00').getDay();
              var googleDay = (jsDay + 6) % 7;
              var todayStr  = spot.opening_hours[googleDay];
              return todayStr ? '<div class="spot-hours">🕐 ' + todayStr + '</div>' : '';
            })()
          + transportHtml
          + (!isFlight
            ? '<div class="spot-footer">'
                + '<a href="' + mapsUrl + '" class="btn-nav" target="_blank" rel="noopener">'
                  + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">'
                  + '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>'
                  + '<circle cx="12" cy="10" r="3"/></svg> 導航前往'
                + '</a>'
                + (spot.duration ? '<span class="spot-duration">' + spot.duration + ' 分鐘</span>' : '')
              + '</div>'
            : '')
        + '</div>'
      + '</div>'
    + '</div>'
    + (function() {
        if (isLast || isFlight) return '';
        var nextSpot = spots[i + 1];
        if (!nextSpot || nextSpot._isFlight) return '';
        var curr = spots[i];
        var km = (curr.latitude && curr.longitude && nextSpot.latitude && nextSpot.longitude)
          ? haversineKm(curr.latitude, curr.longitude, nextSpot.latitude, nextSpot.longitude) : -1;
        var transMins = nextSpot.travel_mins > 0 ? nextSpot.travel_mins : 0;
        var walkMins  = km > 0 ? Math.max(1, Math.round(km * 12.5)) : 0;
        var label = '';
        if (transMins > 0) {
          label = '🚃 ' + transMins + ' 分';
        } else if (km >= 0 && km < 1) {
          label = walkMins > 0 ? ('🚶 ' + walkMins + ' 分') : '';
        } else if (km >= 1 && km < 2) {
          label = walkMins > 0 ? ('🚶 ' + walkMins + ' 分') : '';
        } else {
          label = '🚃 ─';
        }
        if (!label) return '';
        return '<div class="travel-bridge">'
          + '<div></div>'
          + '<div class="travel-bridge-line"></div>'
          + '<div class="travel-bridge-label">' + label + '</div>'
          + '</div>';
      })();
  }).join('');

  var addBtnHtml = '<div class="add-spot-wrap">'
    + '<button class="btn-add-spot" onclick="openAddFlightModal(' + dayData.day + ')">✈ 新增班機</button>'
    + '<button class="btn-add-spot" onclick="showAddModal(' + dayData.day + ')">➕ 新增景點</button>'
    + '<button class="btn-add-spot btn-refresh" onclick="manualRefresh()" title="重新整理">↺</button>'
  + '</div>';

  // 班機卡片：只顯示用「✈ 新增班機」表單建立的班機（試算表 flights 頁籤、欄位齊全），可點擊編輯
  var dayFlights = flightsData.filter(function(f) { return f.day === dayData.day && isStructuredFlight(f); })
    .map(function(f) { return Object.assign({ _editable: true }, f); });
  var flightCardHtml = dayFlights.map(buildFlightCard).join('');

  // 顯示位置不寫死 day===1/6（原本東京 6 天行程遺留的假設），改用這個行程實際的第一天／最後一天：
  // 最後一天放在 timeline 之後（探索完再出發），其餘所有天（含中途才有的班機）放在 timeline 之前（先抵達再探索）
  var tripDayNums = itineraryState.map(function(d) { return d.day; });
  var lastDay = tripDayNums.length ? Math.max.apply(null, tripDayNums) : dayData.day;

  return '<section class="day-panel" data-day="' + dayData.day + '">'
    + '<div class="day-header">'
      + '<div class="day-header-actions">'
      + '<button class="btn-sort-day" onclick="confirmAction(\'最佳路線\', \'要重新排列 Day ' + dayData.day + ' 的景點順序嗎？目前的順序會被改掉。\', triggerOptimizeDay, ' + dayData.day + ')" title="自動排出最短路線">🔀 最佳路線</button>'
      + '<button class="btn-calc-travel" id="btn-calc-' + dayData.day + '" onclick="confirmAction(\'查詢交通時間\', \'要查詢 Day ' + dayData.day + ' 各景點之間的交通時間嗎？\', calcTravelTimes, ' + dayData.day + ')" title="查詢精確大眾運輸交通時間">🕐 交通時間</button>'
      + '</div>'
      + '<span class="day-number-badge">DAY ' + dayData.day + '</span>'
      + '<h2 class="day-panel-title">' + dayData.day_title + '</h2>'
      + '<p class="day-panel-date">' + dateLabel + '</p>'
      + '<div class="day-start-wrap">'
        + '<span class="day-start-label">⏰ 出發時間</span>'
        + '<input class="day-start-input" type="time" value="' + (dayData.day_start || '09:00') + '"'
          + ' data-day="' + dayData.day + '"'
          + ' oninput="onDayStartInput(this)"'
          + ' onblur="onDayStartBlur(event, this)"'
          + ' onkeydown="if (event.key === \'Enter\') this.blur()">'
        + '<button type="button" class="day-start-confirm" hidden onclick="confirmDayStart(this)">✓ 確定</button>'
      + '</div>'

/* ─── Header GPS Weather ──────────────────────────────── */
function fetchTodayHeaderWeather() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function(pos) {
    var lat = pos.coords.latitude, lon = pos.coords.longitude;
    var today = getJSTDateStr();
    var wUrl = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon
      + '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max'
      + '&timezone=auto&start_date=' + today + '&end_date=' + today;
    var gUrl = 'https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lon
      + '&format=json&zoom=10';
    Promise.all([
      fetch(wUrl).then(function(r){ return r.json(); }),
      fetch(gUrl, { headers: { 'Accept-Language': 'zh-TW,zh' } }).then(function(r){ return r.json(); })
    ]).then(function(results) {
      var j = results[0], geo = results[1];
      var d = j.daily;
      if (!d || !d.time || !d.time.length) return;
      var tMax = Math.round(d.temperature_2m_max[0]);
      var tMin = Math.round(d.temperature_2m_min[0]);
      var prob = d.precipitation_probability_max[0] || 0;
      var rain = d.precipitation_sum[0] || 0;
      var area = (geo.address || {}).city || (geo.address || {}).town || (geo.address || {}).county || '';
      var el = document.getElementById('hdr-weather');
      if (!el) return;
      var txt = area ? area + ' · ' : '';
      txt += tMax + '°↕' + tMin + '° · ☔' + prob + '%';
      if (rain > 0 || prob > 30) txt += ' · ☂帶傘';
      el.textContent = txt;
    }).catch(function(){});
  }, function(){}, { timeout: 8000 });
}

/* ─── Spot Weather (Open-Meteo) ───────────────────────── */
async function fetchWeather(days) {
  var regionMap = {};
  days.forEach(function(day){
    (day.spots || []).forEach(function(spot){
      if (spot.region_name && spot.latitude && spot.longitude && !regionMap[spot.region_name]) {
        regionMap[spot.region_name] = { lat: spot.latitude, lon: spot.longitude, data: null };
      }
    });
  });

  await Promise.all(Object.keys(regionMap).map(async function(region) {
    var loc = regionMap[region];
    try {
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + loc.lat + '&longitude=' + loc.lon
        + '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max'
        + '&hourly=precipitation_probability,weathercode'
        + '&timezone=Asia%2FTokyo&forecast_days=16';
      var r = await fetch(url);
      var j = await r.json();
      if (j.daily && j.daily.time && j.daily.time.length) regionMap[region].data = j.daily;
      if (j.hourly && j.hourly.time && j.hourly.time.length) regionMap[region].hourly = j.hourly;
    } catch(e) {}
  }));

  days.forEach(function(day) {
    var seen = {};
    var entries = [];
    (day.spots || []).forEach(function(spot) {
      if (!spot.region_name) return;
      var loc = regionMap[spot.region_name];
      if (!loc || !loc.data) return;
      var di = loc.data.time.indexOf(day.date);
      if (di < 0) return;
      var tMax = Math.round(loc.data.temperature_2m_max[di]);
      var tMin = Math.round(loc.data.temperature_2m_min[di]);
      var rain = loc.data.precipitation_sum[di] || 0;
      var prob = loc.data.precipitation_probability_max[di] || 0;
      var key  = tMax + '|' + tMin + '|' + prob;
      if (!seen[key]) {
        seen[key] = true;
        entries.push({ tMax: tMax, tMin: tMin, rain: rain, prob: prob, region: spot.region_name });
      }
    });
    if (!entries.length) return;
    var el = document.getElementById('dw-' + day.date);
    if (!el) return;
    var showRegion = entries.length > 1;
    var blocksHtml = entries.map(function(e) {
      var loc = regionMap[e.region];
      var alerts = [];
      if (e.rain > 0 || e.prob > 30) alerts.push('<span class="w-alert">☂ 帶傘</span>');
      if (e.tMax < 15) alerts.push('<span class="w-alert">🧥 外套</span>');
      var summaryHtml = '<div class="dw-entry">'
        + (showRegion ? '<span class="dw-region">' + e.region + '</span><span style="color:var(--border)">·</span>' : '')
        + '<span class="w-temp">' + e.tMax + '°C</span>'
        + '<span style="color:var(--border)">↕</span>'
        + '<span style="color:var(--text-3)">' + e.tMin + '°C</span>'
        + '<span style="color:var(--border)">｜</span>'
        + '<span>☔ ' + e.prob + '%</span>'
        + alerts.join('')
        + '</div>';
      var hourlyHtml = '';
      if (loc && loc.hourly) {
        var items = '';
        for (var h = 10; h <= 20; h++) {
          var hkey  = day.date + 'T' + (h < 10 ? '0' : '') + h + ':00';
          var hidx  = loc.hourly.time.indexOf(hkey);
          var hprob = hidx >= 0 ? (loc.hourly.precipitation_probability[hidx] || 0) : 0;
          hprob = Math.round(hprob / 5) * 5;
          var wcode = (loc.hourly.weathercode && hidx >= 0) ? (loc.hourly.weathercode[hidx] || 0) : -1;
          var icon  = wcode >= 0 ? getWeatherIcon(wcode, hprob) : '';
          var hcolor = hprob >= 60 ? 'var(--red)' : hprob >= 30 ? 'var(--gold)' : 'var(--text-3)';
          items += '<span class="dw-hr-item">'
            + '<span class="dw-hr-time">' + h + '</span>'
            + (icon ? '<span class="dw-hr-icon">' + icon + '</span>' : '')
            + '<span class="dw-hr-prob" style="color:' + hcolor + '">' + hprob + '%</span>'
            + '</span>';
        }
        hourlyHtml = '<div class="dw-hr-row">' + items + '</div>';
      }
      return '<div class="dw-entry-block">' + summaryHtml + hourlyHtml + '</div>';
    }).join('');
    el.innerHTML = blocksHtml;
    el.style.display = 'flex';
  });
}

function getWeatherIcon(code, prob) {
  if (prob >= 60) return '🌧️';
  if (prob >= 30) return '🌦️';
  if (code === 0)                 return '☀️';
  if (code === 1)                 return '🌤️';
  if (code === 2)                 return '⛅';
  if (code === 3)                 return '☁️';
  if (code === 45 || code === 48) return '🌫️';
  if (code >= 51 && code <= 55)   return '🌦️';
  if (code >= 61 && code <= 65)   return '🌧️';
  if (code >= 71 && code <= 75)   return '❄️';
  if (code >= 80 && code <= 82)   return '🌦️';
  if (code >= 95)                 return '⛈️';
  return '⛅';
}

// 手動切換記帳表單金額欄位代表的幣別（TWD 或當地幣別），純手動觸發，不受支付方式影響
function setAmountCurrency(currency) {
  _amountCurrency = currency;
  document.querySelectorAll('#amt-currency-toggle .ctoggle-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.cur === currency);
  });
  updForeignEstimate();
}

function updForeignEstimate() {
  var val = +document.getElementById('e-amt').value;
  var tripCurrency = currentTrip ? currentTrip.currency : '';
  var previewEl = document.getElementById('foreign-preview');
  if (!val || val <= 0) { previewEl.textContent = ''; return; }

  if (_amountCurrency === 'TWD') {
    var est = twdToForeign(val, tripCurrency);
    previewEl.textContent = est !== null ? ('≈ ' + CURRENCY_LABELS[tripCurrency] + ' ' + est.toLocaleString(undefined, { maximumFractionDigits: 1 })) : '';
  } else {
    var twd = foreignToTwd(val, _amountCurrency);
    previewEl.textContent = twd !== null ? ('≈ ' + CURRENCY_LABELS.TWD + ' ' + Math.round(twd).toLocaleString()) : '';
  }
}

async function submitExp(e) {
  e.preventDefault();
  var rawVal = +document.getElementById('e-amt').value;
  if (!rawVal || rawVal <= 0 || isNaN(rawVal)) { showToast('請輸入有效金額'); return; }
  var amount = _amountCurrency === 'TWD' ? rawVal : foreignToTwd(rawVal, _amountCurrency);
  if (amount === null || !(amount > 0)) { showToast('目前無法取得匯率，請改用新台幣輸入'); return; }
  amount = Math.round(amount);
  var item = document.getElementById('e-item').value.trim();
  if (!item) { showToast('請輸入項目名稱'); return; }
  var payload = {
    date:       document.getElementById('e-date').value,
    item:       item,
    category:   document.getElementById('e-cat').value,
    payment:    document.getElementById('e-pay').value,
    amount_twd: amount,
    trip_id:    currentTrip ? currentTrip.trip_id : ''
  };
  // 先清表單、先在畫面上加一筆，背景再寫入；寫完（或失敗）後以試算表資料為準重畫
  document.getElementById('e-item').value = '';
  document.getElementById('e-amt').value  = '';
  document.getElementById('foreign-preview').textContent = '';
  applyLocalExpense(payload);
  showToast('✓ 已記帳');
  queueWrite(GAS_URL, payload, '記帳「' + item + '」', false)
    .then(refreshExpenseSummaryWhenIdle);
}

// rowIndex 為 0 代表還沒寫進試算表（同步中）
function applyLocalExpense(rec) {
  var base = window._expData;
  if (!base) return;
  var data = Object.assign({}, base);
  var cats = (base.categories || []).map(function(c) { return Object.assign({}, c); });
  var hit = cats.filter(function(c) { return c.name === rec.category; })[0];
  if (hit) hit.twd += rec.amount_twd; else cats.push({ name: rec.category, twd: rec.amount_twd });
  data.categories = cats;
  data.total_twd  = (base.total_twd || 0) + rec.amount_twd;
  data.records    = (base.records || []).concat([{
    rowIndex: 0, date: rec.date, item: rec.item, category: rec.category,
    amount_twd: rec.amount_twd, payment: rec.payment
  }]);
  buildSummary(data);
}

function refreshExpenseSummaryWhenIdle() {
  if (_pendingWrites > 0 || !currentTrip) return;
  fetch(gasUrlFor(currentTrip.trip_id))
    .then(function(r) { return r.json(); })
    .then(function(data) { if (_pendingWrites === 0) buildSummary(data); })
    .catch(function() { showToast('統計更新失敗，請手動重整'); });
}
