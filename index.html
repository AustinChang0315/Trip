// T4：POST 景點順序和交通時間到 GAS
function postOrderToGAS(dayNum, spots) {
  if (!API_URL) return;
  var payload = spots.map(function(s, i) {
    var tMins = 0;
    if (i > 0) {
      var prev = spots[i - 1];
      tMins = s.travel_mins > 0 ? s.travel_mins : 0;
    }
    return { spot_name: s.spot_name, spot_id: s.spot_id || '', sort_order: i, travel_mins: tMins };
  });
  fetch(API_URL, {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'update_order', day: dayNum, spots: payload })
  }).catch(function(){});
}

function getTransitDepartureTime() {
  var now = new Date();
  var h = now.getHours();
  if (h < 7 || h >= 23) {
    var dep = new Date(now);
    dep.setHours(9, 0, 0, 0);
    if (dep <= now) dep.setDate(dep.getDate() + 1);
    return dep;
  }
  return now;
}

async function getTransitDurationMinutes(originLatLng, destinationLatLng) {
  if (!originLatLng || !destinationLatLng || originLatLng === destinationLatLng) return 0;
  try {
    var RouteMatrix = (await google.maps.importLibrary('routes')).RouteMatrix;
    var op = originLatLng.split(',').map(Number);
    var dp = destinationLatLng.split(',').map(Number);
    var matrix = await RouteMatrix.computeRouteMatrix({
      origins:      [new google.maps.LatLng(op[0], op[1])],
      destinations: [new google.maps.LatLng(dp[0], dp[1])],
      travelMode:   'TRANSIT',
      fields:       ['*']
    });
    var el0 = matrix && matrix[0];
    showToast('📦 matrix長度:' + (matrix ? matrix.length : 'null') + ' | el0:' + JSON.stringify(el0).slice(0, 120));
    if (el0) {
      var d = el0.duration;
      if (d != null) {
        var secs = typeof d === 'object' ? (d.seconds || 0) : parseInt(String(d), 10);
        if (secs > 0) return Math.ceil(secs / 60);
      }
    }
    return 0;
  } catch(e) {
    console.error('[Routes API]', e);
    return 0;
  }
}

// 🕐 Routes API — 一次查整天所有路段的精確大眾運輸交通時間
async function calcTravelTimes(dayNum) {
  var dayIdx = -1;
  for (var i = 0; i < itineraryState.length; i++) {
    if (itineraryState[i].day === dayNum) { dayIdx = i; break; }
  }
  if (dayIdx < 0) return;

  var btn = document.getElementById('btn-calc-' + dayNum);
  if (btn) { btn.disabled = true; btn.textContent = '計算中…'; }

  var spots = itineraryState[dayIdx].spots;

  // 只取有座標的非航班景點（不限 duration，飯店/起點也需計入）
  var validIdxs = [];
  spots.forEach(function(s, i) {
    if (s.latitude && s.longitude && !s._isFlight) validIdxs.push(i);
  });

  if (validIdxs.length < 2) {
    showToast('景點不足，無法計算交通時間');
    if (btn) { btn.disabled = false; btn.textContent = '🕐 交通時間'; }
    return;
  }

  try {
    var segPromises = [];
    for (var k = 0; k < validIdxs.length - 1; k++) {
      var s1 = spots[validIdxs[k]], s2 = spots[validIdxs[k + 1]];
      segPromises.push(getTransitDurationMinutes(
        s1.latitude + ',' + s1.longitude,
        s2.latitude + ',' + s2.longitude
      ));
    }
    var segMins = await Promise.all(segPromises);

    var updatedSpots = spots.slice();
    for (var k = 0; k < segMins.length; k++) {
      if (segMins[k] > 0) {
        var spotIdx = validIdxs[k + 1];
        updatedSpots[spotIdx] = Object.assign({}, updatedSpots[spotIdx], { travel_mins: segMins[k] });
      }
    }

    itineraryState[dayIdx] = Object.assign({}, itineraryState[dayIdx], { spots: updatedSpots });
    saveDayOrder(dayNum, updatedSpots);
    // 將新算好的 transit 時間存進 localStorage cache（優先級高於 GAS 返回值，防止 race condition）
    var tCache = {};
    try { tCache = JSON.parse(localStorage.getItem('transit_mins_cache') || '{}'); } catch(e) {}
    updatedSpots.forEach(function(s) {
      if (s.spot_id && s.travel_mins > 0) tCache[s.spot_id] = { m: s.travel_mins, t: Date.now() };
    });
    try { localStorage.setItem('transit_mins_cache', JSON.stringify(tCache)); } catch(e) {}
    updateDayPanel(itineraryState[dayIdx]);
    postOrderToGAS(dayNum, updatedSpots);
    showToast('🕐 交通時間已更新');

  } catch(err) {
    console.error('[calcTravelTimes]', err);
    showToast('交通時間計算失敗，請稍後再試');
  } finally {
    var b = document.getElementById('btn-calc-' + dayNum);
    if (b) { b.disabled = false; b.textContent = '🕐 交通時間'; }
  }
}

/* ─── Expense Summary ─────────────────────────────────── */
function buildSummary(data) {
  var wrap = document.getElementById('summary-wrap');
  if (!data || !data.total_jpy) return;

  var cats   = (data.categories || []).filter(function(c){ return c.jpy > 0; });
  var maxJpy = Math.max.apply(null, cats.map(function(c){ return c.jpy; }).concat([1]));

  var bars = cats.map(function(c){
    return '<div class="chart-row">'
      + '<div class="chart-lbl">' + c.name + '</div>'
      + '<div class="chart-bar-bg"><div class="chart-bar" style="width:' + (c.jpy/maxJpy*100).toFixed(1) + '%"></div></div>'
      + '<div class="chart-amt">¥' + c.jpy.toLocaleString() + '</div>'
    + '</div>';
  }).join('');

  var syncedDate = data.last_synced ? new Date(data.last_synced) : null;
  var synced = (syncedDate && !isNaN(syncedDate))
    ? '上次同步：' + syncedDate.toLocaleString('zh-TW', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
    : '';

  window._expRecords = data.records || [];

  var today = getJSTDateStr();
  var defDetailDate = '';
  for (var i = 0; i < tripDays.length; i++) { if (tripDays[i].date === today) { defDetailDate = today; break; } }
  if (!defDetailDate && tripDays.length) defDetailDate = tripDays[0].date;

  var detailTabs = tripDays.map(function(d){
    var dt   = parseLocalDate(d.date);
    var mmdd = isNaN(dt) ? d.date : (dt.getMonth()+1) + '/' + dt.getDate();
    var wday = isNaN(dt) ? '' : '（' + WKDAYS[dt.getDay()] + '）';
    return '<button type="button" class="detail-tab' + (d.date === defDetailDate ? ' active' : '') + '"'
      + ' onclick="switchDetailDay(this,\'' + d.date + '\')">'
      + 'Day ' + d.day + '<span>' + mmdd + wday + '</span></button>';
  }).join('');

  wrap.innerHTML = '<div class="total-box">'
    + '<div class="total-lbl">旅遊總花費</div>'
    + '<div class="total-jpy">¥ ' + data.total_jpy.toLocaleString() + '</div>'
    + '<div class="total-twd">≈ TWD ' + data.total_twd.toLocaleString() + '</div>'
  + '</div>'
  + '<div class="chart">' + bars + '</div>'
  + '<div class="synced-at">' + synced + '</div>'
  + '<div class="detail-section">'
    + '<div class="detail-header">消費明細</div>'
    + '<div class="detail-tabs">' + detailTabs + '</div>'
    + '<div id="detail-list"></div>'
  + '</div>';

  renderDetailRecords(defDetailDate);
}

function switchDetailDay(btn, date) {
  document.querySelectorAll('.detail-tab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderDetailRecords(date);
}

function normalizeDate(s) {
  if (!s) return '';
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0, 10);
  var MON = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
  var m = s.match(/([A-Z][a-z]{2})\s+(\d{1,2})/);
  if (m && MON[m[1]]) {
    var yr = new Date().getFullYear();
    return yr + '-' + String(MON[m[1]]).padStart(2,'0') + '-' + String(m[2]).padStart(2,'0');
  }
  return s;
}

function renderDetailRecords(date) {
  var list = document.getElementById('detail-list');
  if (!list) return;
  var recs = (window._expRecords || []).filter(function(r){ return normalizeDate(r.date) === date; });
  if (!recs.length) { list.innerHTML = '<div class="record-empty">此日無消費記錄</div>'; return; }

  var subtotal = recs.reduce(function(s,r){ return s + r.amount_jpy; }, 0);
  list.innerHTML = '<div class="record-list">'
    + recs.map(function(r){
      return '<div class="record-item">'
        + '<div style="flex:1;min-width:0">'
          + '<div class="record-name">' + r.item + '</div>'
          + '<div class="record-meta">' + r.category + ' · ' + r.payment + '</div>'
        + '</div>'
        + '<div class="record-amount">¥' + r.amount_jpy.toLocaleString() + '</div>'
        + '<button class="record-del" data-row="' + r.rowIndex + '" data-name="' + r.item.replace(/"/g,'&quot;') + '">✕</button>'
      + '</div>';
    }).join('')
  + '</div>'
  + '<div class="record-subtotal">小計 ¥' + subtotal.toLocaleString() + ' ≈ TWD ' + Math.round(subtotal * JPY_TWD).toLocaleString() + '</div>';

  list.querySelectorAll('.record-del').forEach(function(btn){
    btn.addEventListener('click', function(){ showDeleteConfirm(+btn.dataset.row, btn.dataset.name); });
  });
}

/* ─── Delete Record ───────────────────────────────────── */

  if (!rowIndex) { showToast('請先重新部署 GAS 才能使用刪除功能'); return; }
  document.getElementById('modal-msg').textContent = '確定要刪除「' + itemName + '」這筆記錄嗎？';
  document.getElementById('modal-confirm-btn').onclick = function() {
    closeModal(); doDeleteRecord(rowIndex);
  };
  document.getElementById('confirm-modal').classList.remove('hidden');

function closeModal() {
  document.getElementById('confirm-modal').classList.add('hidden');
}

async function doDeleteRecord(rowIndex) {
  try {
    await fetch(GAS_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'delete', rowIndex: rowIndex })
    });
    showToast('✓ 已刪除');
    setTimeout(function(){
      fetch(GAS_URL).then(function(r){ return r.json(); }).then(buildSummary).catch(function(){});
    }, 1500);
  } catch(e) { showToast('刪除失敗，請確認網路'); }
}

/* ─── Toast ───────────────────────────────────────────── */
var _toastTimer;
function showToast(msg) {
  clearTimeout(_toastTimer);
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  _toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

/* ─── Helpers ─────────────────────────────────────────── */
function minsToTime(m) {
  return String(Math.floor(m/60)%24).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
}

// 任何日期值 → YYYY-MM-DD 字串（一次性正規化用）
function dateToYMD(val) {
  if (!val) return '';
  var s = String(val).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  var d = new Date(s);
  if (isNaN(d.getTime())) return s;
  return d.getFullYear() + '-'
    + String(d.getMonth()+1).padStart(2,'0') + '-'
    + String(d.getDate()).padStart(2,'0');
}

// 強健日期解析：接受 YYYY-MM-DD 或 GAS 回傳的完整 Date 字串
// YYYY-MM-DD → 本地時間（避免 UTC 偏移跨日）
// 其他格式   → 直接餵給 Date 建構子
function parseLocalDate(val) {
  if (!val) return new Date(NaN);
  var s = String(val).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(s + 'T00:00:00');
  return new Date(s);
}

/* ─── Task 3：最短路由排序演算法 ────────────────────── */

// Haversine 大圓距離公式（回傳公里）
function haversineKm(lat1, lon1, lat2, lon2) {
  var R   = 6371;
  var d2r = Math.PI / 180;
  var dLat = (lat2 - lat1) * d2r;
  var dLon = (lon2 - lon1) * d2r;
  var a = Math.sin(dLat/2) * Math.sin(dLat/2)
        + Math.cos(lat1 * d2r) * Math.cos(lat2 * d2r)
        * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}


// 計算一組景點順序的總移動距離
function routeTotalKm(arr) {
  var total = 0;
  for (var i = 0; i < arr.length - 1; i++) {
    total += haversineKm(
      arr[i].latitude, arr[i].longitude,
      arr[i+1].latitude, arr[i+1].longitude
    );
  }
  return total;
}

// 全排列產生器（N ≤ 8 時暴力搜最短）
function allPermutations(arr) {
  if (arr.length <= 1) return [arr.slice()];
  var out = [];
  for (var i = 0; i < arr.length; i++) {
    var rest = arr.filter(function(_, j){ return j !== i; });
    allPermutations(rest).forEach(function(p){
      out.push([arr[i]].concat(p));
    });
  }
  return out;
}

// 最近鄰貪婪法（N > 8 的 fallback）
function nearestNeighborSort(arr) {
  var rem    = arr.slice();
  var sorted = [rem.shift()];
  while (rem.length) {
    var last = sorted[sorted.length - 1];
    var bestIdx = 0, bestDist = Infinity;
    for (var i = 0; i < rem.length; i++) {
      var d = haversineKm(last.latitude, last.longitude, rem[i].latitude, rem[i].longitude);
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    }
    sorted.push(rem.splice(bestIdx, 1)[0]);
  }
  return sorted;
}

// 有起終點的貪婪最近鄰：從 startSpot 出發，依序選最近未訪的中間景點
function nearestNeighborSortBetween(arr, startSpot, endSpot) {
  var remaining = arr.slice();
  var sorted = [];
  var current = startSpot;
  while (remaining.length) {
    var minDist = Infinity, minIdx = 0;
    remaining.forEach(function(s, i) {
      var d = haversineKm(current.latitude, current.longitude, s.latitude, s.longitude);
      if (d < minDist) { minDist = d; minIdx = i; }
    });
    current = remaining[minIdx];
    sorted.push(current);
    remaining.splice(minIdx, 1);
  }
  return sorted;
}

// 核心排序：分離航班節點，只對有座標的正常景點排序
function sortSpotsOptimal(spots) {
  if (!spots || spots.length <= 2) return spots;

  var first  = spots[0];
  var last   = spots[spots.length - 1];
  var middle = spots.slice(1, spots.length - 1);

  var heads = [], tails = [], sortable = [];
  var mid = middle.length / 2;

  middle.forEach(function(s, i) {
    var canSort = s.latitude && s.longitude && s.duration > 0;
    if (!canSort) {
      if (i < mid) heads.push(s); else tails.push(s);
    } else {
      sortable.push(s);
    }
  });

  // 中間景點不足：回退完整排序（含首尾一起找最優）
  if (sortable.length <= 1) {
    var allSortable = spots.filter(function(s){ return s.latitude && s.longitude && s.duration > 0; });
    if (allSortable.length <= 1) return spots;
    var allMidLine = spots.length / 2;
    var aHeads = spots.filter(function(s,i){ return !(s.latitude && s.longitude && s.duration > 0) && i < allMidLine; });
    var aTails  = spots.filter(function(s,i){ return !(s.latitude && s.longitude && s.duration > 0) && i >= allMidLine; });
    var bFull; var bdFull = Infinity;
    allPermutations(allSortable).forEach(function(p){ var d=routeTotalKm(p); if(d<bdFull){bdFull=d;bFull=p;} });
    return aHeads.concat(bFull).concat(aTails);
  }

  var best;
  if (sortable.length <= 8) {
    // 計算時把首尾也納入，找真正連接端點成本最低的中間排列
    var bestDist = Infinity;
    allPermutations(sortable).forEach(function(perm) {
      var d = routeTotalKm([first].concat(perm).concat([last]));
      if (d < bestDist) { bestDist = d; best = perm; }
    });
  } else {
    // 從 first 出發的貪婪最近鄰
    best = nearestNeighborSortBetween(sortable, first, last);
  }

  return [first].concat(heads).concat(best).concat(tails).concat([last]);
}

// 時間重算：從 startMins（預設 09:00 = 540 分）往後累加 duration
function reindexTimes(spots, startMins) {
  var mins = (startMins !== undefined) ? startMins : 9 * 60;
  return spots.map(function(s) {
    var copy = Object.assign({}, s);
    if (copy.duration > 0) {
      copy.time = minsToTime(mins);
      mins += copy.duration;
    }
    return copy;
  });
}

// 正規化 GAS 回傳的 day_start 值（可能是 HH:MM 字串、Sheets 時間小數、或 Date 字串）
function normalizeHHMM(val) {
  if (!val && val !== 0) return '';
  var s = String(val).trim();
  if (/^\d{1,2}:\d{2}$/.test(s)) return s;           // 已是 HH:MM
  var n = parseFloat(s);
  if (!isNaN(n) && n > 0 && n < 1) {                  // Sheets 時間小數（如 0.5625 = 13:30）
    var totalMins = Math.round(n * 24 * 60);
    var h = Math.floor(totalMins / 60);
    var m = totalMins % 60;
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  }
  var dm = s.match(/\b(\d{1,2}):(\d{2}):\d{2}\b/);   // Date 物件字串（如 "...13:30:00..."）
  if (dm) return String(parseInt(dm[1],10)).padStart(2,'0') + ':' + dm[2];
  return '';
}

// 解析 "HH:MM" 字串為分鐘數，無法解析則回傳 540（09:00）
function parseTimeMins(t) {
  if (!t) return 540;
  var parts = String(t).split(':');
  if (parts.length < 2) return 540;
  var h = parseInt(parts[0], 10);
  var m = parseInt(parts[1], 10);
  return (!isNaN(h) && !isNaN(m)) ? h * 60 + m : 540;
}

// 對外介面：排序 + 重算時間
// startTime：可傳入 "HH:MM" 字串（day_start），預設 "09:00"
function optimizeDayRoute(spots, startTime) {
  if (!spots || spots.length <= 1) return spots;
  return reindexTimes(sortSpotsOptimal(spots), parseTimeMins(startTime));
}
