// 完全找不到任何既有景點座標時的中性地圖視角（不偏向任何特定國家/城市）
var NEUTRAL_MAP_CENTER = { lat: 20, lng: 0 };

// 新增景點時要用哪個座標當「參考中心」（地圖畫面置中、搜尋結果偏向）。
// 沒有寫死任何特定城市：先看當天景點，再由近到遠找「時間軸上」最接近的其他天
// （同距離優先看前一天，符合「剛從哪裡來」的直覺——避免多城市長行程時
// 隨便抓到陣列裡第一筆資料、卻是地理上很遠的那一天），
// 整個行程都還沒加過任何景點才回傳 null，交給呼叫端決定怎麼處理。
function getTripAnchorCenter(targetDay) {
  function firstSpotOnDay(dayNum) {
    var d = itineraryState.filter(function(x){ return x.day === dayNum; })[0];
    if (!d || !d.spots) return null;
    return d.spots.filter(function(s){ return s.latitude && s.longitude; })[0] || null;
  }

  if (targetDay !== null && targetDay !== undefined) {
    var sameDay = firstSpotOnDay(targetDay);
    if (sameDay) return { lat: sameDay.latitude, lng: sameDay.longitude };

    if (itineraryState.length) {
      var allDays = itineraryState.map(function(d){ return d.day; });
      var maxDist = Math.max.apply(null, allDays.map(function(d){ return Math.abs(d - targetDay); }).concat([0]));
      for (var dist = 1; dist <= maxDist; dist++) {
        var prevSpot = firstSpotOnDay(targetDay - dist);
        if (prevSpot) return { lat: prevSpot.latitude, lng: prevSpot.longitude };
        var nextSpot = firstSpotOnDay(targetDay + dist);
        if (nextSpot) return { lat: nextSpot.latitude, lng: nextSpot.longitude };
      }
    }
  }

  // 保底：targetDay 未知時（理論上不會發生），掃描整個行程抓任一個有座標的景點
  for (var i = 0; i < itineraryState.length; i++) {
    var anySpot = (itineraryState[i].spots || []).filter(function(s){ return s.latitude && s.longitude; })[0];
    if (anySpot) return { lat: anySpot.latitude, lng: anySpot.longitude };
  }
  return null;
}

// Places API 景點搜尋
async function searchPlace() {
  document.activeElement.blur(); // 立刻收合虛擬鍵盤（在任何非同步作業前執行）

  var searchBtn = document.getElementById('modal-search-btn');
  try {
    if (!modalMap) { showToast('地圖尚未準備好，請稍後再試'); return; }

    var query = document.getElementById('modal-search-input').value.trim();
    if (!query) return;

    searchBtn.disabled    = true;
    searchBtn.textContent = '搜尋中…';

    // 動態 locationBias：以既有景點為中心往外 10km；行程還沒有任何景點時不帶 bias，讓搜尋不受地理位置限制
    var biasCenter = getTripAnchorCenter(_addTargetDay);

    var searchRequest = {
      textQuery: query,
      fields: ['id', 'displayName', 'formattedAddress', 'location', 'addressComponents', 'regularOpeningHours', 'editorialSummary'],
      language: 'zh-TW'
    };
    if (biasCenter) searchRequest.locationBias = { center: biasCenter, radius: 10000 };

    var { Place } = await google.maps.importLibrary('places');
    var { places } = await Place.searchByText(searchRequest);

    if (!places || !places[0]) {
      showToast('找不到景點，請換個關鍵字');
      return;
    }

    var place = places[0];
    var lat   = place.location.lat();
    var lng   = place.location.lng();
    var name  = place.displayName || '';
    var addr  = place.formattedAddress || '';

    // 放置圖釘、平移地圖
    placeMarkerAt(lat, lng, name, '');
    tempPlaceData.region       = formatRegionFromAddress(addr);
    tempPlaceData.placeId      = place.id || '';
    tempPlaceData.address      = addr;
    tempPlaceData.openingHours = (place.regularOpeningHours && place.regularOpeningHours.weekdayDescriptions)
                                 ? place.regularOpeningHours.weekdayDescriptions : [];
    tempPlaceData.description  = place.editorialSummary || '';

    modalMap.panTo({ lat: lat, lng: lng });
    modalMap.setZoom(16);
    document.getElementById('modal-spot-name').value = name;

    // region 由 reverseGeocodeAddr (language: ja) 負責，searchByText(zh-TW) 的 addressComponents 對日本地址回傳英文無法使用
    // 鎖定確認按鈕，JS Geocoder 反查取得 region 後解鎖
    var confirmBtn = document.getElementById('add-confirm-btn');
    confirmBtn.disabled  = true;
    confirmBtn.innerText = '📍 取得地址中…';

    reverseGeocodeAddr(lat, lng).then(function(components) {
      var region = regionFromComponents(components);
      if (region) tempPlaceData.region = region;
      if (tempPlaceData.region) {
        confirmBtn.disabled  = false;
        confirmBtn.innerText = '💾 加入行程';
        return;
      }
      // Google 全失敗 → Nominatim 保底
      return reverseGeocodeNominatim(lat, lng).then(function(addr) {
        var nr = regionFromNominatim(addr);
        console.log('[region] Nominatim fallback result:', nr);
        if (nr && !tempPlaceData.region) tempPlaceData.region = nr;
        confirmBtn.disabled  = false;
        confirmBtn.innerText = '💾 加入行程';
      });
    }).then(function() {
      confirmBtn.disabled  = false;
      confirmBtn.innerText = '💾 加入行程';
    }).catch(function() {
      confirmBtn.disabled  = false;
      confirmBtn.innerText = '💾 加入行程';
    });

  } catch(err) {
    console.error('[searchPlace] error:', err);
    showToast('搜尋失敗，請換個關鍵字或稍後再試');
  } finally {
    searchBtn.disabled    = false;
    searchBtn.textContent = '🔍 查詢';
    document.activeElement.blur();
  }
}

// formatted_address 解析：直接從 zh-TW 的中文地址字串切出「府縣 町名」
// 例：「〒279-0031 日本千葉縣浦安市舞濱1番地1」→「千葉 舞濱」
//     「〒116-0013 東京都荒川区西日暮里３丁目」→「東京 西日暮里」
// Google Geocoding REST API address_components → 「都道府縣 町名」格式
// isCJK 守護：若 API 回傳英文（"Tokyo"）則回傳 '' 防止顯示英文
function regionFromComponents(components) {
  if (!components || !components.length) return '';
  var isCJK = function(s) { return /[一-鿿぀-ヿ]/.test(s || ''); };
  var find = function(type) {
    for (var i = 0; i < components.length; i++)
      if (components[i].types.indexOf(type) >= 0) return components[i].long_name;
    return '';
  };

  // 縣市（東京都 → 東京）
  var rawPref = find('administrative_area_level_1');
  if (!isCJK(rawPref)) return '';
  var pref = rawPref.replace(/[都道府縣県]$/, '');

  // 行政區 / 城市（目黒区 → 目黒区，川越市 → 川越）：保留 区/區，剝掉 市/郡
  var rawWard = find('locality') || find('administrative_area_level_2');
  var ward = isCJK(rawWard) ? rawWard.replace(/[市郡]$/, '') : '';

  // 街區名（浅草、谷中）：剝掉「町/丁」後不足 2 字則跳過（幸町→幸→跳過）
  var rawSub = find('sublocality_level_1') || find('sublocality_level_2');
  var strippedSub = isCJK(rawSub) ? rawSub.replace(/[町丁]$/, '') : '';
  var sub = strippedSub.length >= 2 ? strippedSub : '';

  var parts = [pref];
  if (ward) parts.push(ward);
  if (sub && sub !== ward) parts.push(sub);
  return parts.join(' ');
}

// formatted_address 字串解析（僅作 fallback，當 address_components 是英文時使用）
function formatRegionFromAddress(addr) {
  if (!addr) return '';
  var s   = addr.replace(/〒[\d-]+\s*/g, '').replace(/日本[,，、]?\s*/g, '').trim();
  var CJK = '\\u4E00-\\u9FFF\\u3040-\\u30FF';
  var prefMatch = s.match(new RegExp('([' + CJK + ']{1,6}[都道府縣県])'));
  if (!prefMatch) return '';
  var pref     = prefMatch[1].replace(/[都道府縣県]$/, '');
  var rest     = s.slice(s.indexOf(prefMatch[1]) + prefMatch[1].length);
  var cityMatch = rest.match(new RegExp('^([' + CJK + ']{1,8}[市区區郡])'));
  var afterCity = cityMatch ? rest.slice(cityMatch[0].length) : rest;
  var cityName  = cityMatch ? cityMatch[1].replace(/[市郡]$/, '') : '';  // 保留 区/區
  var townMatch = afterCity.match(new RegExp('^([' + CJK + ']{1,10})'));
  var town      = (townMatch && townMatch[1]) ? townMatch[1] : cityName;
  return pref + (town ? ' ' + town : '');
}

// 從 Places API 的 formatted_address 字串推斷 region_name
// （鏡像 inferRegionFromAddr 的關鍵字邏輯，但輸入是純字串）
function inferRegionFromPlaceAddress(addr) {
  if (/鎌倉/.test(addr))                                                      return '鎌倉';
  if (/江の島|江ノ島|片瀬|藤沢/.test(addr))                                   return '湘南・江之島';
  if (/逗子|葉山|茅ヶ崎|平塚/.test(addr))                                     return '湘南';
  if (/箱根/.test(addr))                                                       return '箱根';
  if (/川越/.test(addr))                                                       return '川越';
  if (/舞浜|浦安/.test(addr))                                                  return '舞濱・千葉';
  if (/成田/.test(addr))                                                       return '成田';
  if (/千葉/.test(addr))                                                       return '千葉';
  if (/横浜|横濱/.test(addr))                                                  return '橫濱';
  if (/羽田|大田区/.test(addr))                                                return '羽田・東京灣';
  if (/埼玉/.test(addr))                                                       return '埼玉';
  if (/東京|台東|渋谷|新宿|千代田|中央区|港区|品川|目黒|世田谷|杉並|豊島|文京|墨田|江東|荒川|足立|葛飾|江戸川|板橋|練馬|北区|中野/.test(addr)) return '東京市區';
  if (/神奈川/.test(addr))                                                     return '神奈川';
  return '';
}

// 初始化 Google Maps（Modal 開啟時呼叫）
function initModalMap() {
  if (!window.google || !window.google.maps) {
    handleMapsLoadError();
    showToast('地圖載入失敗，請確認 API Key 來源限制設定');
    return;
  }
  // 每次開啟 Modal 時清除舊圖釘與暫存資料
  if (currentMarker) { currentMarker.setMap(null); currentMarker = null; }
  tempPlaceData = null;

  // 地圖畫面預設位置：有既有景點就以既有景點為準，完全沒有就顯示中性世界視角（不寫死任何特定城市）
  var anchor = getTripAnchorCenter(_addTargetDay);
  var center = anchor || NEUTRAL_MAP_CENTER;
  var zoom   = anchor ? 13 : 2;

  if (modalMap) {
    // 地圖已初始化：通知重新計算尺寸（從 hidden 變回可見後必要）
    google.maps.event.trigger(modalMap, 'resize');
    modalMap.panTo(center);
    modalMap.setZoom(zoom);
    return;
  }

  // 首次初始化
  var placeholder = document.querySelector('.modal-map-placeholder');
  if (placeholder) placeholder.style.display = 'none';

  modalMap = new google.maps.Map(document.getElementById('modal-map'), {
    center: center,
    zoom: zoom,
    gestureHandling: 'greedy',  // 單指拖曳（全螢幕 Modal 不需雙指鎖定）
    disableDefaultUI: true,
    zoomControl: true
  });

  // 點擊地圖 → 放置圖釘
  // e.placeId 存在表示使用者點了 Google Maps 上的 POI（店家/景點），可直接取完整資料
  modalMap.addListener('click', async function(e) {
    var lat = e.latLng.lat();
    var lng = e.latLng.lng();

    if (e.placeId) {
      try {
        var { Place } = await google.maps.importLibrary('places');
        var place = new Place({ id: e.placeId });
        await place.fetchFields({
          fields: ['id', 'displayName', 'formattedAddress', 'addressComponents', 'location', 'regularOpeningHours', 'editorialSummary']
        });

        var detailLat = place.location.lat();
        var detailLng = place.location.lng();
        var hours = (place.regularOpeningHours && place.regularOpeningHours.weekdayDescriptions)
                    ? place.regularOpeningHours.weekdayDescriptions : [];
        var desc  = place.editorialSummary || '';

        placeMarkerAt(detailLat, detailLng, place.displayName || '', desc);
        tempPlaceData.placeId      = place.id || '';
        tempPlaceData.address      = place.formattedAddress || '';
        tempPlaceData.region       = formatRegionFromAddress(place.formattedAddress || '');
        if (place.addressComponents && place.addressComponents.length) {
          var shimmed = place.addressComponents.map(function(c) {
            return { long_name: c.longText, short_name: c.shortText, types: c.types };
          });
          var r = regionFromComponents(shimmed);
          if (r) tempPlaceData.region = r;
        }
        tempPlaceData.openingHours = hours;

        document.getElementById('modal-spot-name').value = place.displayName || '';

        // JS Geocoder 反查取 zh-TW region（鎖住確認按鈕直到回傳）
        var _confirmBtn = document.getElementById('add-confirm-btn');
        _confirmBtn.disabled  = true;
        _confirmBtn.innerText = '📍 取得地址中…';
        reverseGeocodeAddr(detailLat, detailLng).then(function(components) {
          var region = regionFromComponents(components);
          if (region) tempPlaceData.region = region;
          if (tempPlaceData.region) {
            _confirmBtn.disabled  = false;
            _confirmBtn.innerText = '💾 加入行程';
            return;
          }
          // Google 全失敗 → Nominatim 保底
          return reverseGeocodeNominatim(detailLat, detailLng).then(function(addr) {
            var nr = regionFromNominatim(addr);
            console.log('[region] Nominatim fallback (map click):', nr);
            if (nr && !tempPlaceData.region) tempPlaceData.region = nr;
            _confirmBtn.disabled  = false;
            _confirmBtn.innerText = '💾 加入行程';
          });
        }).then(function() {
          _confirmBtn.disabled  = false;
          _confirmBtn.innerText = '💾 加入行程';
        }).catch(function() {
          _confirmBtn.disabled  = false;
          _confirmBtn.innerText = '💾 加入行程';
        });
      } catch(err) {
        console.error('[map click] fetchFields error:', err);
        placeMarkerAt(lat, lng, null, null);
      }
    } else {
      // 點空白處：只有座標，無店家資訊
      placeMarkerAt(lat, lng, null, null);
    }
  });
}

// 放置唯一圖釘（銷毀舊圖釘、建立新圖釘、暫存座標）
function placeMarkerAt(lat, lng, name, description) {
  if (currentMarker) { currentMarker.setMap(null); currentMarker = null; }

  currentMarker = new google.maps.Marker({
    position: { lat: lat, lng: lng },
    map: modalMap,
    animation: google.maps.Animation.DROP
  });

  tempPlaceData = { lat: lat, lng: lng, name: name || '', description: description || '', region: '' };

  // 地圖點擊路徑（無景點名稱）：用 Google Geocoder 反向地理編碼推斷地區名
  if (!name) {
    reverseGeocodeAddr(lat, lng).then(function(components) {
      if (tempPlaceData) tempPlaceData.region = inferRegionFromAddr(components);
    }).catch(function(){});
  }
}

// 從 Google Maps URL 解析座標
// 優先順序：
//   1. !8m2!3d{lat}!4d{lon}  ← 地點頁精確圖釘座標（最準確）
//   2. !3d{lat}!4d{lon}       ← 其他圖釘格式
//   3. /@lat,lon,zoom          ← 地圖畫面中心（較不精確，差距可達數百公尺）
//   4. ?q=lat,lon / ?ll=lat,lon
function parseGoogleMapsCoords(url) {
  if (!url) return null;
  var s = url.trim();

  // 最優先：地點頁 data 參數中的 !8m2!3d{lat}!4d{lon}（精確圖釘）
  var pin8 = s.match(/!8m2!3d([-\d.]+)!4d([-\d.]+)/);
  if (pin8) return { lat: parseFloat(pin8[1]), lon: parseFloat(pin8[2]) };

  // 次優先：其他 !3d{lat}!4d{lon} 格式
  var pin3 = s.match(/!3d([-\d.]+)!4d([-\d.]+)/);
  if (pin3) return { lat: parseFloat(pin3[1]), lon: parseFloat(pin3[2]) };

  // 地圖中心 /@lat,lon,zoom（精度較低，但比無座標好）
  var center = s.match(/@([-\d.]+),([-\d.]+)[,/z]/);
  if (center) return { lat: parseFloat(center[1]), lon: parseFloat(center[2]) };

  // ?q=lat,lon 或 ?ll=lat,lon
  var q = s.match(/[?&](?:q|ll)=([-\d.]+),([-\d.]+)/);
  if (q) return { lat: parseFloat(q[1]), lon: parseFloat(q[2]) };

  return null;
}

// 短網址展開後再解析（maps.app.goo.gl）
async function expandAndParseGoogleMapsUrl(url) {
  // 先試直接解析（可能已是完整 URL）
  var direct = parseGoogleMapsCoords(url);
  if (direct) return direct;

  // 短網址嘗試展開
  if (/maps\.app\.goo\.gl|goo\.gl/i.test(url)) {
    try {
      // 透過 cors-anywhere 或直接 fetch（某些環境允許）
      var r = await fetch('https://corsproxy.io/?' + encodeURIComponent(url), { redirect: 'follow' });
      var text = await r.text();
      // 從 HTML 找 canonical URL 或 meta refresh
      var mm = text.match(/"(https:\/\/www\.google\.com\/maps\/[^"]+)"/);
      if (mm) {
        var expanded = parseGoogleMapsCoords(mm[1]);
        if (expanded) return expanded;
      }
    } catch(e) {}
  }

  return null;
}

// Google Maps URL 貼入時即時解析
async function onMapsUrlInput(val) {
  var statusEl = document.getElementById('add-url-parse-status');
  if (!val.trim()) { statusEl.textContent = ''; return; }

  statusEl.textContent = '🔍 解析中…';
  var coords = await expandAndParseGoogleMapsUrl(val.trim());

    document.getElementById('add-manual-coords').style.display = 'block';
  }
}

/* ─── Wikipedia 景點介紹自動生成（繁體中文）─────────── */

// 相關性檢查：「查詢主詞」必須出現在文章標題內
// 規則：取查詢字串的第一個詞（主要景點名），該詞必須被標題包含
// 避免「今半 浅草」→「浅草」這種偷渡（浅草包含在查詢中但不是主詞）
function isWikiRelevant(query, title) {
  var q = query.trim().toLowerCase();
  var t = title.trim().toLowerCase();

  // 1. 標題完全包含查詢詞
  if (t.includes(q)) return true;

  // 2. 查詢詞以標題開頭（標題是查詢主詞的核心，如「今半」⊂「今半 浅草」）
  if (q.startsWith(t) && t.length >= 2) return true;

  // 3. 查詢第一詞（空白前）出現在標題中（長度需 ≥ 2 避免單字亂配）
  var firstWord = q.split(/\s+/)[0];
  if (firstWord.length >= 2 && t.includes(firstWord)) return true;

  return false;
}

// 查詢 Wikipedia，支援 variant=zh-tw 繁體中文轉換
async function queryWikipedia(lang, query, variant) {
  try {
    var vp = variant ? '&variant=' + variant : '';

    // Step 1：搜尋最相關頁面標題
    var searchRes = await fetch(
      'https://' + lang + '.wikipedia.org/w/api.php'
      + '?action=query&list=search&format=json&origin=*&srlimit=3'
      + vp + '&srsearch=' + encodeURIComponent(query)
    );
    var searchJson = await searchRes.json();
    var hits = ((searchJson.query || {}).search) || [];
    if (!hits.length) return null;

    // Step 2：從前 3 筆結果中找第一個標題相關的
    var title = null;
    for (var i = 0; i < hits.length; i++) {
      if (isWikiRelevant(query, hits[i].title)) { title = hits[i].title; break; }
    }
    if (!title) return null; // 全部不相關 → 不顯示錯誤內容

    // Step 3：用 MediaWiki API 取純文字摘要（支援 variant 繁體轉換）
    var extractRes = await fetch(
      'https://' + lang + '.wikipedia.org/w/api.php'
      + '?action=query&prop=extracts&exintro=1&explaintext=1&format=json&origin=*'
      + vp + '&titles=' + encodeURIComponent(title)
    );
    var extractJson = await extractRes.json();
    var pages   = ((extractJson.query || {}).pages) || {};
    var pageKey = Object.keys(pages)[0];
    if (!pageKey || pageKey === '-1') return null;

    var extract = (pages[pageKey].extract || '').trim();
    if (extract.length < 20) return null;

    // 取前 2 句、最多 120 字
    var sentences = extract.split(/(?<=[。！？])|(?<=[.!?])\s+/).filter(Boolean);
    var desc = sentences.slice(0, 2).join('');
    return desc.length > 120 ? desc.slice(0, 117) + '…' : desc;

  } catch(e) { return null; }
}

// 繁體中文優先，找不到再試英文
// locationHint：從座標反查出的地名（如「浅草」「台東区」），加入查詢以精確比對
async function fetchWikiDescription(name, locationHint) {
  var hint = (locationHint || '').trim();

  // 1. 繁中 Wikipedia：景點名稱 + 地名（最精確）
  if (hint) {
    var r1 = await queryWikipedia('zh', name + ' ' + hint, 'zh-tw');
    if (r1) return r1;
  }

  // 2. 繁中 Wikipedia：僅景點名稱
  var r2 = await queryWikipedia('zh', name, 'zh-tw');
  if (r2) return r2;

  // 3. 英文 Wikipedia：景點名稱 + 地名
  if (hint) {
    var r3 = await queryWikipedia('en', name + ' ' + hint, null);
    if (r3) return r3;
  }

  // 4. 英文 Wikipedia：僅景點名稱
  return await queryWikipedia('en', name, null);
}

/* ─── Nominatim 反向地理編碼（保底 fallback，Accept-Language: zh-TW 優先）── */
async function reverseGeocodeNominatim(lat, lon) {
  try {
    var r = await fetch(
      'https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lon + '&zoom=14',
      { headers: { 'Accept-Language': 'zh-TW,zh-Hant;q=0.9,ja;q=0.5' } }
    );
    return ((await r.json()).address) || {};
  } catch(e) { return {}; }
}

function regionFromNominatim(addr) {
  if (!addr) return '';
  var strip = function(s) { return (s || '').replace(/[都道府縣県市区區町村郡]$/, ''); };
  var pref = strip(addr.state || addr.province || '');
  if (!pref) return '';
  var town = strip(addr.suburb || addr.neighbourhood || addr.quarter || addr.city_district || '');
  return pref + (town ? ' ' + town : '');
}

/* ─── 反向地理編碼（Google Maps JS Geocoder，取代 REST API，規避 HTTP referrer 限制）── */
async function reverseGeocodeAddr(lat, lon) {
  try {
    var geocoder = new google.maps.Geocoder();
    var response = await geocoder.geocode({ location: { lat: lat, lng: lon }, language: 'ja' });
    var components = (response.results && response.results[0] && response.results[0].address_components) || [];
    var pref = components.filter(function(c){ return c.types.indexOf('administrative_area_level_1') >= 0; })[0];
    console.log('[region] JS Geocoder pref:', pref && pref.long_name);
    return components;
  } catch(e) { console.log('[region] JS Geocoder error:', e); return []; }
}

// 從 Google Geocoder address_components 推斷地區標籤
function inferRegionFromAddr(components) {
  if (!components || !components.length) return '';
  var find = function(type) {
    for (var i = 0; i < components.length; i++)
      if (components[i].types.indexOf(type) >= 0) return components[i].long_name;
    return '';
  };
  var parts = [
    find('sublocality_level_2'), find('sublocality_level_1'), find('sublocality'),
    find('locality'), find('administrative_area_level_2'), find('administrative_area_level_1')
  ].filter(Boolean).join(' ');

  if (/鎌倉/.test(parts))                                             return '鎌倉';
  if (/江の島|江ノ島|江之島|片瀬|片瀨|藤沢|藤澤/.test(parts))       return '湘南・江之島';
  if (/逗子|葉山|茅ヶ崎|平塚/.test(parts))                           return '湘南';
  if (/箱根/.test(parts))                                             return '箱根';
  if (/川越/.test(parts))                                             return '川越';
  if (/舞浜|舞濱|浦安/.test(parts))                                  return '千葉 舞濱';
  if (/成田/.test(parts))                                             return '成田';
  if (/横浜|橫濱|横濱/.test(parts))                                  return '橫濱';
  if (/羽田|大田区|大田區/.test(parts))                              return '羽田・東京灣';
  if (/埼玉/.test(parts))                                             return '埼玉';
  // 其他地區（含東京各區）直接用 Google API 回傳的繁體中文名稱
  return regionFromComponents(components);
}

// 從 address_components 取最精確的地名（作為 Wikipedia 搜尋補充關鍵字）
function locationHintFromAddr(components) {
  if (!components || !components.length) return '';
  var find = function(type) {
    for (var i = 0; i < components.length; i++)
      if (components[i].types.indexOf(type) >= 0) return components[i].long_name;
    return '';
  };
  return find('sublocality_level_2') || find('sublocality_level_1') ||
         find('sublocality') || find('locality') || '';
}

// 保留向後相容（外部仍可直接呼叫）
async function inferRegionName(lat, lon) {
  return inferRegionFromAddr(await reverseGeocodeAddr(lat, lon));
}

// 單次 Nominatim 查詢
async function nominatimQuery(q) {
  var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&q='
    + encodeURIComponent(q);
  var r    = await fetch(url, { headers: { 'Accept-Language': 'zh-TW,ja,en' } });
  var data = await r.json();
  if (data && data.length > 0) {
    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), display: data[0].display_name };
  }
  return null;
}

// 多層重試地理編碼：
//   1. 原始關鍵字
//   2. 原始關鍵字 + 日本（去除「JAPAN」被誤判為國名的干擾）
//   3. 只保留最後一個空格分隔的詞（通常是地區名，如 Asakusa）
async function geocodeSpotName(name) {
  // 嘗試 1：原始輸入
  var r = await nominatimQuery(name);
  if (r) return r;

  // 嘗試 2：移除開頭的 "JAPAN" / "TOKYO" 等干擾字，讓 Nominatim 不混淆國名
  var cleaned = name.replace(/^(JAPAN|TOKYO|OSAKA)\s+/i, '').trim();
  if (cleaned !== name) {
    r = await nominatimQuery(cleaned);
    if (r) return r;
  }

  // 嘗試 3：只取最後一個空白後的地區詞（如 "Asakusa"、"浅草"）
  var parts = name.trim().split(/\s+/);
  if (parts.length > 1) {
    r = await nominatimQuery(parts[parts.length - 1] + ' 日本');
    if (r) return r;
  }

  return null;
}

// 確認新增（地理編碼 → 加入狀態 → 重排 → 同步 GAS）
function confirmAddSpot() {
  // 驗證：必須先透過搜尋或地圖點擊選取地點
  if (!tempPlaceData || typeof tempPlaceData.lat !== 'number') {
    showToast('請先搜尋景點或在地圖上點選位置');
    return;
  }

  var spotName = document.getElementById('modal-spot-name').value.trim();
  if (!spotName) { showToast('請輸入景點名稱'); return; }

  // 4-1：防連擊鎖定（點擊瞬間立刻 disabled，使用者無法重複提交）
  var btn     = document.getElementById('add-confirm-btn');
  btn.disabled  = true;
  btn.innerText = '⏳ 雲端同步中...';

  var duration     = +document.getElementById('add-duration').value || 60;
  var lat          = tempPlaceData.lat;
  var lng          = tempPlaceData.lng;
  var regionName   = tempPlaceData.region || '';
  var description  = tempPlaceData.description  || '';
  var address      = tempPlaceData.address      || '';
  var openingHours = tempPlaceData.openingHours || [];

  var dayIdx = -1;
  for (var i = 0; i < itineraryState.length; i++) {
    if (itineraryState[i].day === _addTargetDay) { dayIdx = i; break; }
  }
  if (dayIdx < 0) { closeAddModal(); return; }

  var dayData = itineraryState[dayIdx];

  // Places API 路徑：用 destination_place_id 讓 Google Maps 顯示店名而非「已放置圖釘」
  // 地圖點擊路徑（無 place_id）：退回座標版 URL
  var placeId = tempPlaceData.placeId || '';
  var navUrl  = placeId
    ? 'https://www.google.com/maps/dir/?api=1&origin=My+Location'
        + '&destination=' + encodeURIComponent(spotName)
        + '&destination_place_id=' + placeId
        + '&travelmode=transit'
    : buildMapsUrl(regionName ? spotName + ' ' + regionName : spotName);

  var newSpot = {
    spot_id:       newSpotId(),
    spot_name:     spotName,
    duration:      duration,
    region_name:   regionName,
    latitude:      lat,
    longitude:     lng,
    description:   description,
    address:       address,
    opening_hours: openingHours,
    transport:     { google_maps_url: navUrl }
  };

  // 立刻更新畫面（使用者體感「秒完成」），再依序送到後端；失敗會跳提示
  var merged = dayData.spots.concat([newSpot]);
  itineraryState[dayIdx] = Object.assign({}, dayData, { spots: merged });
  markDayMutated(_addTargetDay);

  closeAddModal();                               // 同時解鎖 body scroll
  updateDayPanel(itineraryState[dayIdx]);
  showToast('✅ 已新增「' + spotName + '」');

  if (API_URL && currentTrip) {
    queueWrite(apiUrlFor(currentTrip.trip_id), {
      action:        'add',
      trip_id:       currentTrip.trip_id,
      spot_id:       newSpot.spot_id,   // 後端直接採用，畫面與試算表從一開始就是同一個 id
      day:           dayData.day,
      date:          dayData.date,
      day_title:     dayData.day_title,
      spot_name:     spotName,
      duration:      duration,
      region_name:   regionName,
      latitude:      lat,
      longitude:     lng,
      description:   description,
      address:       address,
      opening_hours: JSON.stringify(openingHours)
      // sort_order 由後端在鎖內算（當天最大值 + 1），新景點一定排在最後
    }, '新增景點「' + spotName + '」', true); // 後端以 spot_id 去重，重試不會重複新增
  }
}

// Step 1：顯示確認 Modal（從按鈕的 data attribute 讀取）

  };

// Step 2：實際刪除（優先用 spot_id 查找，解決同名景點問題）
function deleteSpot(dayNum, spotName, spotId) {
  var dayIndex = -1;
  for (var i = 0; i < itineraryState.length; i++) {
    if (itineraryState[i].day === dayNum) { dayIndex = i; break; }
  }
  if (dayIndex < 0) return;

  var dayData  = itineraryState[dayIndex];
  var deleted  = null;

  var remaining = dayData.spots.filter(function(s) {
    if (!deleted) {
      var match = spotId ? s.spot_id === spotId : s.spot_name === spotName;
      if (match) { deleted = s; return false; }
    }
    return true;
  });

  if (!deleted) return;

  itineraryState[dayIndex] = Object.assign({}, dayData, { spots: remaining });
  markDayMutated(dayNum);
  updateDayPanel(itineraryState[dayIndex]);
  showToast('✓ 已移除「' + spotName + '」');

  if (API_URL && currentTrip) {
    queueWrite(apiUrlFor(currentTrip.trip_id),
      { action: 'delete', trip_id: currentTrip.trip_id, spot_name: spotName, spot_id: spotId || '', day: dayNum },
      '刪除景點「' + spotName + '」', true);
  }
}

/* ─── 編輯景點（點景點卡片修改名稱／停留時間）─────────── */
var _editingSpot = null; // { day, spotId, oldName }

// 點卡片本體開啟編輯；點到導航連結、刪除、上下移動等按鈕時不觸發
function onSpotCardClick(ev, card) {
  if (ev.target.closest('button, a, .spot-drag-handle')) return;
  openEditSpotModal(Number(card.dataset.day), card.dataset.spotId || '', card.dataset.name || '');
}

function openEditSpotModal(dayNum, spotId, spotName) {
  var dayData = itineraryState.filter(function(d) { return d.day === dayNum; })[0];
  if (!dayData) return;
  var spot = dayData.spots.filter(function(s) {
    return spotId ? s.spot_id === spotId : s.spot_name === spotName;
  })[0];
  if (!spot) return;

  _editingSpot = { day: dayNum, spotId: spot.spot_id || '', oldName: spot.spot_name || '' };
  document.getElementById('spot-edit-name-input').value = spot.spot_name || '';
  document.getElementById('spot-edit-duration-input').value = spot.duration || 60;
  document.getElementById('spot-edit-error').textContent = '';
  document.getElementById('spot-edit-modal').classList.remove('hidden');
}

function closeEditSpotModal() {
  document.getElementById('spot-edit-modal').classList.add('hidden');
}

function confirmEditSpot() {
  if (!_editingSpot) return;
  var newName     = document.getElementById('spot-edit-name-input').value.trim();
  var newDuration = Math.round(Number(document.getElementById('spot-edit-duration-input').value));
  var errEl       = document.getElementById('spot-edit-error');

  if (!newName) { errEl.textContent = '請輸入景點名稱'; return; }
  if (!(newDuration > 0)) { errEl.textContent = '停留時間必須大於 0 分鐘'; return; }

  var dayIdx = -1;
  for (var i = 0; i < itineraryState.length; i++) {
    if (itineraryState[i].day === _editingSpot.day) { dayIdx = i; break; }
  }
  if (dayIdx < 0) { closeEditSpotModal(); return; }

  var target = _editingSpot;
  var matched = false;
  var updatedSpots = itineraryState[dayIdx].spots.map(function(s) {
    if (matched) return s;
    var hit = target.spotId ? s.spot_id === target.spotId : s.spot_name === target.oldName;
    if (!hit) return s;
    matched = true;
    return Object.assign({}, s, { spot_name: newName, duration: newDuration });
  });
  if (!matched) { closeEditSpotModal(); return; }

  itineraryState[dayIdx] = Object.assign({}, itineraryState[dayIdx], { spots: updatedSpots });
  markDayMutated(target.day);
  closeEditSpotModal();
  updateDayPanel(itineraryState[dayIdx]);
  showToast('✓ 已更新「' + newName + '」');

  if (API_URL && currentTrip) {
    queueWrite(apiUrlFor(currentTrip.trip_id), {
      action: 'update_spot', trip_id: currentTrip.trip_id, day: target.day,
      spot_id: target.spotId, old_name: target.oldName,
      spot_name: newName, duration: newDuration
    }, '修改景點「' + newName + '」', true);
  }
}

/* ─── 景點排序（手動移動 + 最佳路線按鈕）──────────────── */

// 拖曳排序：只有按住卡片角落的 ⋮⋮ 把手才會開始拖，點卡片本身仍是編輯、長按仍可選取文字
function initSpotSorting(root) {
  if (typeof Sortable === 'undefined' || !root) return;
  root.querySelectorAll('.timeline').forEach(function(tl) {
    if (tl._sortable) return;
    tl._sortable = Sortable.create(tl, {
      handle: '.spot-drag-handle',
      draggable: '.timeline-item',
      animation: 150,
      ghostClass: 'timeline-item--ghost',
      onEnd: onSpotDragEnd
    });
  });
}

function onSpotDragEnd(evt) {
  var panel = evt.from.closest('.day-panel');
  if (!panel) return;
  var order = Array.prototype.map.call(evt.from.querySelectorAll('.timeline-item'), function(el) {
    return Number(el.dataset.vidx);
  });
  reorderDaySpots(Number(panel.dataset.day), order);
}

// order：拖曳後各景點原本在時間軸上的位置（data-vidx），依新順序排列
function reorderDaySpots(dayNum, order) {
  var dayIdx = -1;
  for (var i = 0; i < itineraryState.length; i++) {
    if (itineraryState[i].day === dayNum) { dayIdx = i; break; }
  }
  if (dayIdx < 0) return;
  var spots = itineraryState[dayIdx].spots;
  var slots = [];
  spots.forEach(function(s, idx) { if (isTimelineSpot(s)) slots.push(idx); });
  if (order.length !== slots.length) { updateDayPanel(itineraryState[dayIdx]); return; }
  if (order.every(function(v, k) { return v === k; })) return; // 放回原位

  var rebuilt = spots.slice();
  slots.forEach(function(slotIdx, k) {
    var s = spots[slots[order[k]]];
    if (order[k] !== k && s.time) { s = Object.assign({}, s); delete s.time; }
    rebuilt[slotIdx] = s;
  });
  itineraryState[dayIdx] = Object.assign({}, itineraryState[dayIdx], { spots: rebuilt });
  markDayMutated(dayNum);
  updateDayPanel(itineraryState[dayIdx]);
  postOrderToGAS(dayNum, rebuilt);
}

// ⏰ 出發時間：輸入中只存值、不重繪（手機選時間時避免提前關閉選擇器），並在值有變動時顯示「✓ 確定」。
// input.defaultValue 是渲染當下已儲存的值，和目前輸入值不同才算「有改動」
function storeDayStart(dayNum, timeStr) {
  var dayIdx = -1;
  for (var i = 0; i < itineraryState.length; i++) {
    if (itineraryState[i].day === dayNum) { dayIdx = i; break; }
  }
  if (dayIdx < 0) return;
  itineraryState[dayIdx] = Object.assign({}, itineraryState[dayIdx], { day_start: timeStr });
}

function onDayStartInput(input) {
  storeDayStart(Number(input.dataset.day), input.value);
  var btn = input.parentNode.querySelector('.day-start-confirm');
  if (btn) btn.hidden = (input.value === input.defaultValue);
}

// 離開輸入框：有改動就提交（保留原本點別處即生效的行為）；焦點移到「確定」按鈕時由按鈕處理，避免重複提交
function onDayStartBlur(ev, input) {
  var rt = ev.relatedTarget;
  if (rt && rt.classList && rt.classList.contains('day-start-confirm')) return;
  commitDayStart(input);
}

function confirmDayStart(btn) {
  commitDayStart(btn.parentNode.querySelector('.day-start-input'));
}

function commitDayStart(input) {
  if (!input || input.value === input.defaultValue) return; // 沒改動：不重畫、不寫入
  if (input.dataset.committed) return;                       // 重畫時舊輸入框可能再觸發一次 blur，不重複提交
  input.dataset.committed = '1';
  updateDayStart(Number(input.dataset.day), input.value);
  showToast('✓ 出發時間已更新');
}

// ⏰ 提交出發時間：重繪當天（整天時間依出發時間重新推算）+ 同步雲端
function updateDayStart(dayNum, timeStr) {
  var dayIdx = -1;
  for (var i = 0; i < itineraryState.length; i++) {
    if (itineraryState[i].day === dayNum) { dayIdx = i; break; }
  }
  if (dayIdx < 0) return;
  // 景點若自帶固定 time，畫面會優先用它而不跟著出發時間走；先移除，讓整天時間一律由「出發時間＋停留＋交通」推算
  var spots = itineraryState[dayIdx].spots.map(function(s) {
    if (s.time === undefined) return s;
    var copy = Object.assign({}, s);
    delete copy.time;
    return copy;
  });
  itineraryState[dayIdx] = Object.assign({}, itineraryState[dayIdx], { day_start: timeStr, spots: spots });
  markDayMutated(dayNum);
  updateDayPanel(itineraryState[dayIdx]);
  if (API_URL && currentTrip) {
    queueWrite(apiUrlFor(currentTrip.trip_id),
      { action: 'update_day_start', trip_id: currentTrip.trip_id, day: dayNum, day_start: timeStr },
      '出發時間', true);
  }
}

// 🔀 最佳路線按鈕：手動觸發自動排列
function triggerOptimizeDay(dayNum) {
  var dayIdx = -1;
  for (var i = 0; i < itineraryState.length; i++) {
    if (itineraryState[i].day === dayNum) { dayIdx = i; break; }
  }
  if (dayIdx < 0) return;
  var dayData = itineraryState[dayIdx];
  var optimized = optimizeDayRoute(dayData.spots, dayData.day_start);
  itineraryState[dayIdx] = Object.assign({}, dayData, { spots: optimized });
  markDayMutated(dayNum);
  updateDayPanel(itineraryState[dayIdx]);
  postOrderToGAS(dayNum, optimized);
  showToast('🔀 路線已優化');
}

// T4：POST 景點順序和交通時間到 GAS
function postOrderToGAS(dayNum, spots) {
  if (!API_URL || !currentTrip) return;
  var payload = spots.map(function(s, i) {
    var tMins = 0;
    if (i > 0) {
      var prev = spots[i - 1];
      if (prev.latitude && prev.longitude && s.latitude && s.longitude) {
        tMins = estimateMinsByDistance(
          haversineMeters(prev.latitude, prev.longitude, s.latitude, s.longitude)
        );
      } else if (s.travel_mins > 0) {
        tMins = s.travel_mins;
      }
    }
    return { spot_name: s.spot_name, spot_id: s.spot_id || '', sort_order: i, travel_mins: tMins };
  });
  queueWrite(apiUrlFor(currentTrip.trip_id),
    { action: 'update_order', trip_id: currentTrip.trip_id, day: dayNum, spots: payload },
    '景點順序', true);
}

async function getTransitDurationMinutes(originLatLng, destinationLatLng) {
  if (originLatLng === destinationLatLng) return 0;
  const [oLat, oLng] = originLatLng.split(',').map(Number);
  const [dLat, dLng] = destinationLatLng.split(',').map(Number);
  const meters = haversineMeters(oLat, oLng, dLat, dLng);
  const mins = estimateMinsByDistance(meters);
  console.log(`📏 ${Math.round(meters)}m → ${mins} 分鐘`);
  return mins;
}

// 🕐 Routes API — 一次查整天所有路段的精確大眾運輸交通時間
async function calcTravelTimes(dayNum) {
  var dayIdx = -1;
  for (var i = 0; i < itineraryState.length; i++) {
    if (itineraryState[i].day === dayNum) { dayIdx = i; break; }
  }
  if (dayIdx < 0) return;

  var btn = document.getElementById('btn-calc-' + dayNum);
  if (btn) { btn.disabled = true; btn.textContent = '計算中…'; }

  var spots = itineraryState[dayIdx].spots;

  // 只取有座標的非航班景點（不限 duration，飯店/起點也需計入）
  var validIdxs = [];
  spots.forEach(function(s, i) {
    if (s.latitude && s.longitude && !s._isFlight) validIdxs.push(i);
  });

  if (validIdxs.length < 2) {
    showToast('景點不足，無法計算交通時間');
    if (btn) { btn.disabled = false; btn.textContent = '🕐 交通時間'; }
    return;
  }

  try {
    var segPromises = [];
    var dayDate = itineraryState[dayIdx].date;
    for (var k = 0; k < validIdxs.length - 1; k++) {
      var s1 = spots[validIdxs[k]], s2 = spots[validIdxs[k + 1]];
      segPromises.push(getTransitDurationMinutes(
        s1.latitude + ',' + s1.longitude,
        s2.latitude + ',' + s2.longitude,
        s1.time ? dayDate + 'T' + s1.time + ':00' : null
      ));
    }
    var segMins = await Promise.all(segPromises);

    var updatedSpots = spots.slice();
    for (var k = 0; k < segMins.length; k++) {
      if (segMins[k] > 0) {
        var spotIdx = validIdxs[k + 1];
        updatedSpots[spotIdx] = Object.assign({}, updatedSpots[spotIdx], { travel_mins: segMins[k] });
      }
    }

    itineraryState[dayIdx] = Object.assign({}, itineraryState[dayIdx], { spots: updatedSpots });
    markDayMutated(dayNum);
    updateDayPanel(itineraryState[dayIdx]);
    postOrderToGAS(dayNum, updatedSpots);
    showToast('🕐 交通時間已更新');

  } catch(err) {
    console.error('[calcTravelTimes]', err);
    showToast('交通時間計算失敗，請稍後再試');
  } finally {
    var b = document.getElementById('btn-calc-' + dayNum);
    if (b) { b.disabled = false; b.textContent = '🕐 交通時間'; }
  }
}

/* ─── Expense Summary ─────────────────────────────────── */
function buildSummary(data) {
  var wrap = document.getElementById('summary-wrap');
  if (!data) return;

  var currency = currentTrip ? currentTrip.currency : '';
  var cats   = (data.categories || []).filter(function(c){ return c.twd > 0; });
  var maxTwd = Math.max.apply(null, cats.map(function(c){ return c.twd; }).concat([1]));

  var bars = cats.map(function(c){
    return '<div class="chart-row">'
      + '<div class="chart-lbl">' + c.name + '</div>'
      + '<div class="chart-bar-bg"><div class="chart-bar" style="width:' + (c.twd/maxTwd*100).toFixed(1) + '%"></div></div>'
      + '<div class="chart-amt">NT$' + c.twd.toLocaleString() + '</div>'
    + '</div>';
  }).join('');

  var syncedDate = data.last_synced ? new Date(data.last_synced) : null;
  var synced = (syncedDate && !isNaN(syncedDate))
    ? '上次同步：' + syncedDate.toLocaleString('zh-TW', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
    : '';

  window._expData = data;
  window._expRecords = data.records || [];

  var today = getJSTDateStr();
  var defDetailDate = '';
  for (var i = 0; i < tripDays.length; i++) { if (tripDays[i].date === today) { defDetailDate = today; break; } }
  if (!defDetailDate && tripDays.length) defDetailDate = tripDays[0].date;

  var detailTabs = tripDays.map(function(d){
    var dt   = parseLocalDate(d.date);
    var mmdd = isNaN(dt) ? d.date : (dt.getMonth()+1) + '/' + dt.getDate();
    var wday = isNaN(dt) ? '' : '（' + WKDAYS[dt.getDay()] + '）';
    return '<button type="button" class="detail-tab' + (d.date === defDetailDate ? ' active' : '') + '"'
      + ' onclick="switchDetailDay(this,\'' + d.date + '\')">'
      + 'Day ' + d.day + '<span>' + mmdd + wday + '</span></button>';
  }).join('');

  var totalEst = twdToForeign(data.total_twd, currency);
  wrap.innerHTML = '<div class="total-box">'
    + '<div class="total-lbl">旅遊總花費</div>'
    + '<div class="total-main">NT$ ' + data.total_twd.toLocaleString() + '</div>'
    + '<div class="total-foreign">' + (totalEst !== null ? '≈ ' + CURRENCY_LABELS[currency] + ' ' + totalEst.toLocaleString(undefined, { maximumFractionDigits: 0 }) : '') + '</div>'
  + '</div>'
  + '<div class="chart">' + bars + '</div>'
  + '<div class="synced-at">' + synced + '</div>'
  + '<div class="detail-section">'
    + '<div class="detail-header">消費明細</div>'
    + '<div class="detail-tabs">' + detailTabs + '</div>'
    + '<div id="detail-list"></div>'
  + '</div>';

  renderDetailRecords(defDetailDate);
}

function switchDetailDay(btn, date) {
  document.querySelectorAll('.detail-tab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderDetailRecords(date);
}

function renderDetailRecords(date) {
  var list = document.getElementById('detail-list');
  if (!list) return;
  var recs = (window._expRecords || []).filter(function(r){ return normalizeDate(r.date) === date; });
  if (!recs.length) { list.innerHTML = '<div class="record-empty">此日無消費記錄</div>'; return; }

  var currency = currentTrip ? currentTrip.currency : '';
  var subtotal = recs.reduce(function(s,r){ return s + (+(r.amount_twd) || 0); }, 0);
  list.innerHTML = '<div class="record-list">'
    + recs.map(function(r){
      var amt  = +(r.amount_twd) || 0;
      var name = escHtml(r.item     || '—');
      var cat  = escHtml(r.category || '—');
      var pay  = escHtml(r.payment  || '—');
      var est  = twdToForeign(amt, currency);
      return '<div class="record-item">'
        + '<div style="flex:1;min-width:0">'
          + '<div class="record-name">' + name + '</div>'
          + '<div class="record-meta">' + cat + ' · ' + pay + '</div>'
        + '</div>'
        + '<div class="record-amount">NT$' + amt.toLocaleString()
          + (est !== null ? '<div class="record-foreign">≈ ' + CURRENCY_LABELS[currency] + ' ' + est.toLocaleString(undefined, { maximumFractionDigits: 1 }) + '</div>' : '')
        + '</div>'
        + '<button class="record-del" data-row="' + (r.rowIndex || '') + '" data-name="' + name + '">✕</button>'
      + '</div>';
    }).join('')
  + '</div>'
  + '<div class="record-subtotal">小計 NT$' + subtotal.toLocaleString()
    + (twdToForeign(subtotal, currency) !== null ? ' ≈ ' + CURRENCY_LABELS[currency] + ' ' + twdToForeign(subtotal, currency).toLocaleString(undefined, { maximumFractionDigits: 0 }) : '')
    + '</div>';

  list.querySelectorAll('.record-del').forEach(function(btn){
    btn.addEventListener('click', function(){ showDeleteConfirm(+btn.dataset.row, btn.dataset.name); });
  });
}

/* ─── Delete Record ───────────────────────────────────── */
function showDeleteConfirm(rowIndex, itemName) {
  if (!rowIndex) { showToast('這筆還在同步中，稍後再刪除'); return; }
  document.querySelector('#confirm-modal .modal-title').textContent = '確認刪除';
  document.getElementById('modal-msg').textContent = '確定要刪除「' + itemName + '」這筆記錄嗎？';
  document.getElementById('modal-confirm-btn').textContent = '刪除';
  document.getElementById('modal-confirm-btn').onclick = function() {
    closeModal(); doDeleteRecord(rowIndex);
  };
  document.getElementById('confirm-modal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('confirm-modal').classList.add('hidden');
}

function doDeleteRecord(rowIndex) {
  // 先在畫面上移除；試算表刪列後下方的列號會往上移，所以本機資料同步調整，連續刪除才不會刪錯列
  var base = window._expData;
  if (base) {
    var gone = (base.records || []).filter(function(r) { return r.rowIndex === rowIndex; })[0];
    var data = Object.assign({}, base);
    data.records = (base.records || []).filter(function(r) { return r.rowIndex !== rowIndex; }).map(function(r) {
      return r.rowIndex > rowIndex ? Object.assign({}, r, { rowIndex: r.rowIndex - 1 }) : r;
    });
    if (gone) {
      var amt = +(gone.amount_twd) || 0;
      data.total_twd  = Math.max(0, (base.total_twd || 0) - amt);
      data.categories = (base.categories || []).map(function(c) {
        return c.name === gone.category ? Object.assign({}, c, { twd: Math.max(0, c.twd - amt) }) : c;
      });
    }
    buildSummary(data);
  }
  showToast('✓ 已刪除');
  queueWrite(GAS_URL, { action: 'delete', rowIndex: rowIndex }, '刪除記帳', false)
    .then(refreshExpenseSummaryWhenIdle);
}

/* ─── Google Maps 載入失敗處理 ────────────────────────── */
function handleMapsLoadError() {
  var el = document.getElementById('modal-map');
  if (el) {
    el.style.display = 'flex';
    el.style.alignItems = 'center';
    el.style.justifyContent = 'center';
    el.style.background = '#f4f2ee';
    el.style.color = '#999';
    el.style.fontSize = '13px';
    el.style.textAlign = 'center';
    el.innerHTML = '地圖無法載入<br><small>請至 Google Cloud Console<br>確認 API Key 已加入此網站的來源限制</small>';
  }
}

/* ─── Toast ───────────────────────────────────────────── */
var _toastTimer;
function showToast(msg) {
  clearTimeout(_toastTimer);
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  _toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

/* ─── Helpers ─────────────────────────────────────────── */

function buildMapsUrl(name) {
  return 'https://www.google.com/maps/dir/?api=1&origin=My+Location&destination='
    + encodeURIComponent(name) + '&travelmode=transit';
}

function buildNavUrl(lat, lon, name) {
  return buildMapsUrl(name);
}

/* ─── Service Worker ──────────────────────────────────── */
var _swReg = null;
var _reloadScheduled = false;

// 新版本啟用後重新載入——但要等到沒有待送出的寫入、沒開著視窗、沒在輸入、記帳表單沒寫到一半，才不會把使用者手上的東西弄丟
function reloadWhenIdle() {
  if (_reloadScheduled) return;
  _reloadScheduled = true;
  showToast('有新版本，更新中…');
  var timer = setInterval(function() {
    var typing = (document.getElementById('e-item') || {}).value || (document.getElementById('e-amt') || {}).value;
    if (_pendingWrites > 0 || isUserBusy() || typing) return;
    clearInterval(timer);
    window.location.reload();
  }, 2000);
}

// 主動問瀏覽器有沒有新版（比對 sw.js 與 version.js），不用等到下次開啟 App
function checkForAppUpdate() {
  if (_swReg) _swReg.update().catch(function() {});
}

if ('serviceWorker' in navigator) {
  // updateViaCache: 'none'：檢查更新時不吃 GitHub Pages 10 分鐘的 HTTP 快取
  navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function(reg){
    _swReg = reg;
    reg.update();
    reg.addEventListener('updatefound', function(){
      var nw = reg.installing;
      nw.addEventListener('statechange', function(){
        if (nw.state === 'activated' && navigator.serviceWorker.controller) {
          reloadWhenIdle();
        }
      });
    });
  }).catch(function(){});
}

/* ─── 清掉舊版留在手機上的本機排序／出發時間／交通時間資料 ─────
   這些資料現在一律以 Google Sheet 為準，舊鍵不會再被讀取，留著只佔空間 */
(function purgeObsoleteLocalData() {
  try {
    var dead = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (/(^|__)(day_order_\d+|day_start_\d+|day_mutated_\d+|transit_mins_cache)$/.test(k)) dead.push(k);
    }
    dead.forEach(function(k) { localStorage.removeItem(k); });
  } catch(e) {}
})();

/* ─── Bootstrap ───────────────────────────────────────── */
initAuth();
</script>
